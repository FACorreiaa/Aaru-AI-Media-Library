# One-time (re-runnable) seeding of match profiles for every Aaru bundle id,
# iOS and macOS (REL-004). Release runs match readonly, so dispatch this after
# registering the App IDs and App Groups in the Developer portal, and whenever
# a target or entitlement changes. MATCH_GIT_BASIC_AUTHORIZATION's token needs
# Contents: Read AND Write on north-ios-certificates for this workflow.
name: Seed signing

on:
  workflow_dispatch:

concurrency:
  group: apple-seed-signing
  cancel-in-progress: false

jobs:
  seed:
    name: match appstore (readwrite)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aaru-ios
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: aaru-ios

      - name: Fastlane seed_signing
        run: bundle exec fastlane seed_signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

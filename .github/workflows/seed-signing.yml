# Seeding of match profiles for every Aaru bundle id (REL-004). Run once before
# the first beta, and again after an entitlement change or a certificate
# renewal: the beta lane only reads. MATCH_GIT_BASIC_AUTHORIZATION's token needs
# Contents: Read AND Write on NorthAIProject/north-ios-certificates.
name: Seed signing

on:
  workflow_dispatch:

concurrency:
  group: apple-seed-signing
  cancel-in-progress: false

jobs:
  seed:
    name: match appstore (readwrite)
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: aaru-ios
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: aaru-ios

      - name: Fastlane seed_signing
        run: bundle exec fastlane seed_signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

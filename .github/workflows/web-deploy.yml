# Deploy aaru-client to Cloudflare Workers (REL-006).
#   "Web CI" green on main -> beta Worker (wrangler.staging.jsonc)
#   manual dispatch with deploy_production ticked -> prod Worker (wrangler.jsonc)
# Both talk to the production API; beta is client-side only.
#
# Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
# Account Settings:Read) and CLOUDFLARE_ACCOUNT_ID. Until they exist the jobs
# skip with a notice.
name: Web Deploy

on:
  workflow_run:
    workflows: ["Web CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the production Worker
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: web-deploy-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    name: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'beta' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Web deploy skipped: CLOUDFLARE_API_TOKEN is not set on this repository."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aaru-client/package-lock.json

      - name: Build and deploy
        if: steps.secrets.outputs.ready == 'true'
        working-directory: aaru-client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_CONFIG: ${{ github.event_name == 'workflow_dispatch' && 'wrangler.jsonc' || 'wrangler.staging.jsonc' }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npx wrangler deploy --config "$WRANGLER_CONFIG"

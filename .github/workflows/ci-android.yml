# Android CI for aaru-android (AND-001). Not yet a required check: add it to branch protection
# once it has been green on main.
name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "aaru-android/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      - "design/tokens.json"
      - "scripts/generate-tokens.mjs"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "aaru-android/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      - "design/tokens.json"
      - "scripts/generate-tokens.mjs"
      - ".github/workflows/ci-android.yml"
  workflow_dispatch:

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aaru-android

jobs:
  check:
    name: android check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Formatting (ktlint through Spotless)
        run: ./gradlew spotlessCheck
      - name: Static analysis (detekt, with the Compose rules)
        run: ./gradlew detekt
      - name: The /v1 client matches openapi.yaml
        run: |
          ./gradlew :core:api:generateApi --rerun
          [ -z "$(git status --porcelain -- core/api/src/generated)" ] || {
            git status --porcelain -- core/api/src/generated
            echo "::error::The Kotlin API client is stale. Run ./gradlew :core:api:generateApi and commit."
            exit 1
          }
      - name: Unit tests
        run: ./gradlew test
      - name: Android Lint (warnings are errors)
        run: ./gradlew :app:lintBetaDebug
      - name: Build
        run: ./gradlew :app:assembleBetaDebug

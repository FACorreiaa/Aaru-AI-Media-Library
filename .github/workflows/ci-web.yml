# Web CI for aaru-client (REL-001). Deploys run from web-deploy.yml after this passes:
# it keys on this workflow's name and needs every job below green.
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "aaru-client/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      # /privacy is rendered from this file at build time.
      - "docs/privacy.md"
      # Colour tokens for both clients (scripts/generate-tokens.mjs).
      - "design/tokens.json"
      - "scripts/generate-tokens.mjs"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/npm-setup/**"
  pull_request:
    paths:
      - "aaru-client/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      # /privacy is rendered from this file at build time.
      - "docs/privacy.md"
      # Colour tokens for both clients (scripts/generate-tokens.mjs).
      - "design/tokens.json"
      - "scripts/generate-tokens.mjs"
      - ".github/workflows/ci-web.yml"
      - ".github/actions/npm-setup/**"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aaru-client

# Four independent jobs, no `needs:` between them, so they run side by side and each
# reports on its own.
jobs:
  lint:
    name: web lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/npm-setup
        with:
          package: aaru-client
      - name: Formatting (Prettier)
        run: npm run check
      - name: Lint (oxlint with type information, then ESLint for the JSX selectors)
        run: npm run lint
      - name: Colour tokens match design/tokens.json (and pass contrast)
        run: npm run tokens:check

  typecheck:
    name: web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/npm-setup
        with:
          package: aaru-client
      - run: npm run typecheck
      - name: API types match the spec
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || { echo "::error::API types are stale. Run npm run api:generate in aaru-client and commit."; exit 1; }

  test:
    name: web test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # --changed compares against the base branch, so it needs the history.
          fetch-depth: 0
      - uses: ./.github/actions/npm-setup
        with:
          package: aaru-client
      # A pull request runs the tests that import a file it changed; a change to the
      # lockfile, package.json, tsconfig.json, the vitest config or CI itself reruns all
      # of them (forceRerunTriggers in vitest.config.ts). main always runs the full suite.
      - name: Tests affected by this pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx vitest run --changed "origin/$BASE_REF" --passWithNoTests
      - name: All tests
        if: github.event_name != 'pull_request'
        run: npm test

  build:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/npm-setup
        with:
          package: aaru-client
      - run: npm run build
      - name: Size budget (size-budget.json)
        run: npm run size

# Web CI for aaru-client (REL-001). Deploys run from web-deploy.yml after this passes.
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - "aaru-client/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      # /privacy is rendered from this file at build time.
      - "docs/privacy.md"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "aaru-client/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      # /privacy is rendered from this file at build time.
      - "docs/privacy.md"
      - ".github/workflows/ci-web.yml"
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: check, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aaru-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aaru-client/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - name: API types match the spec
        run: |
          npm run api:generate
          git diff --exit-code -- src/lib/api/schema.d.ts \
            || { echo "::error::API types are stale. Run npm run api:generate in aaru-client and commit."; exit 1; }
      - run: npm test
      - run: npm run build
      - name: Size budget (size-budget.json)
        run: npm run size

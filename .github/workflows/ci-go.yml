# Go CI for aaru-server-v2, the Go port of aaru-server. Its API is generated from the
# same openapi.yaml as the clients, so a spec change re-checks it.
name: Go CI

on:
  push:
    branches: [main]
    paths:
      - "aaru-server-v2/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      - ".github/workflows/ci-go.yml"
  pull_request:
    paths:
      - "aaru-server-v2/**"
      - "aaru-server/Sources/AppAPI/openapi.yaml"
      - ".github/workflows/ci-go.yml"
  workflow_dispatch:

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aaru-server-v2

jobs:
  server:
    # Production runs Postgres 18 (platform/infra apps/aaru/data/postgres.yaml). The pg19 leg is an early
    # warning for the planned 18 -> 19 upgrade and is allowed to fail; the
    # pg18 leg keeps the original job name.
    name: aaru-server-v2 tests${{ matrix.pg != '18' && format(' (pg{0}, allowed to fail)', matrix.pg) || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: "18"
            experimental: false
          - pg: "19"
            experimental: true
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: aaru
          POSTGRES_PASSWORD: aaru
          POSTGRES_DB: aaru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aaru"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: aaru
      POSTGRES_PASSWORD: aaru
      POSTGRES_DATABASE: aaru
      AARU_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: aaru-server-v2/go.mod
          cache-dependency-path: aaru-server-v2/go.sum
      - name: Generated code is current
        run: |
          ./scripts/generate-api.sh
          go tool sqlc generate
          git diff --exit-code -- internal/api internal/db/sqlc
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      # Known vulnerabilities in code the module actually reaches. The tool is pinned, like the
      # lint version below, so CI changes only with the code, the vuln database or a deliberate
      # bump (by hand: Dependabot does not read `go run …@version`; keep `make vuln` in step).
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: aaru-server-v2

# Swift CI for aaru-core and aaru-api (REL-001, APP-001). The Swift server (aaru-server/) is
# archived: the API is aaru-server-v2 (Go, ci-go.yml). aaru-server/ still holds the shared
# openapi.yaml and the generator aaru-api's client is built with, so a spec change re-checks it.
name: Swift CI

on:
  push:
    branches: [main]
    paths:
      - "aaru-core/**"
      - "aaru-server/**"
      - "aaru-api/**"
      - "scripts/generate-api-client.sh"
      - ".github/workflows/ci-swift.yml"
  pull_request:
    paths:
      - "aaru-core/**"
      - "aaru-server/**"
      - "aaru-api/**"
      - "scripts/generate-api-client.sh"
      - ".github/workflows/ci-swift.yml"
  workflow_dispatch:

concurrency:
  group: ci-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: aaru-core tests
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path aaru-core

  api:
    name: aaru-api client fresh + tests
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: aaru-server/.build
          key: ${{ runner.os }}-server-${{ hashFiles('aaru-server/Package.resolved') }}
          restore-keys: ${{ runner.os }}-server-
      - name: Generated client matches the spec
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/generate-api-client.sh
          git diff --exit-code -- aaru-api/Sources/AaruAPI/Generated \
            || { echo "::error::aaru-api is stale. Run scripts/generate-api-client.sh and commit."; exit 1; }
      - name: Test
        run: swift test --package-path aaru-api

  lint:
    name: swiftformat + swiftlint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install swiftformat swiftlint
      - name: Lint
        run: |
          set -euo pipefail
          for pkg in aaru-core aaru-api; do
            echo "== $pkg =="
            (cd "$pkg" && swiftformat . --lint && swiftlint --strict --quiet)
          done

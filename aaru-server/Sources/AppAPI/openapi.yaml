openapi: '3.1.0'
info:
  title: Aaru API
  version: 1.0.0
  description: |
    Aaru's JSON API. Every route lives under `/v1`. Errors share one shape
    (`ErrorResponse`); list routes share one cursor envelope (`PageInfo`).
servers:
  - url: /
    description: Same origin as the request.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database reachability. Unauthenticated.
      security: []
      responses:
        '200':
          description: The server is up and can reach its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server is up but a dependency is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Exchange a Sign in with Apple identity token for a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/link:
    post:
      operationId: requestMagicLink
      summary: Email a one-time sign-in link. Same answer whether or not an account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: The link was sent (or would have been).
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/verify:
    post:
      operationId: verifyMagicLink
      summary: Exchange a magic-link token for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session:
    delete:
      operationId: signOut
      summary: End the current session.
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in account.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything that belongs to it.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `page.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    ErrorResponse:
      type: object
      description: The one error shape every route returns.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`, `validation_failed`.
        message:
          type: string
          description: Human-readable explanation. Never contains internal detail.
        details:
          type: object
          description: Optional per-field detail, keyed by request field name (e.g. `rating`).
          additionalProperties:
            type: string
    PageInfo:
      type: object
      description: |
        Cursor pagination envelope. List routes return `{ items: [...], page: PageInfo }`.
        Cursors are keyed on `(updated_at, id)`; a null `nextCursor` means the last page.
      properties:
        nextCursor:
          type: [string, 'null']
    AppleSignInRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The JWT from ASAuthorizationAppleIDCredential / Sign in with Apple JS.
        nonce:
          type: string
          description: The raw nonce whose SHA-256 the client sent to Apple.
        displayName:
          type: string
          description: Apple sends the name only on the first authorization; pass it then.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    MagicLinkVerifyRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
    Session:
      type: object
      required: [token, userId, expiresAt]
      properties:
        token:
          type: string
          description: "Bearer token, sent in the Authorization header as `Bearer <token>`."
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [userId, providers]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        providers:
          type: array
          items:
            type: string
            enum: [apple, email]
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
  responses:
    Error:
      description: Any error, in the shared shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

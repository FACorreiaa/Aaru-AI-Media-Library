openapi: '3.1.0'
info:
  title: Aaru API
  version: 1.0.0
  description: |
    Aaru's JSON API. Every route lives under `/v1`. Errors share one shape
    (`ErrorResponse`); list routes share one cursor envelope (`PageInfo`).
servers:
  - url: /
    description: Same origin as the request.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database reachability. Unauthenticated.
      security: []
      responses:
        '200':
          description: The server is up and can reach its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server is up but a dependency is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Exchange a Sign in with Apple identity token for a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInRequest'}
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/identities/google:
    post:
      operationId: linkGoogle
      summary: Link a Google account to the signed-in account. Refused if it belongs to another account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInRequest'}
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/link:
    post:
      operationId: requestMagicLink
      summary: Email a one-time sign-in link. Same answer whether or not an account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: The link was sent (or would have been).
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/verify:
    post:
      operationId: verifyMagicLink
      summary: Exchange a magic-link token, or the email and its 6-digit code, for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session:
    delete:
      operationId: signOut
      summary: End the current session.
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in account.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything that belongs to it.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/entitlement:
    get:
      operationId: getEntitlement
      summary: >-
        Aaru Plus and this month's captures (BIL-001). The same on every client; Plus is bought in
        the Apple apps only.
      responses:
        '200':
          description: The account's entitlement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        default:
          $ref: '#/components/responses/Error'
  /v1/billing/apple/transactions:
    post:
      operationId: recordAppleTransaction
      summary: >-
        A purchase or a restore, from the Apple app that made it (BIL-002). The signed transaction
        must carry this account's `appAccountToken`; 409 `plus_other_account` when it names another,
        422 `invalid_transaction` when it does not verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedTransaction]
              properties:
                signedTransaction:
                  type: string
                  description: StoreKit 2's `jwsRepresentation`.
      responses:
        '200':
          description: The entitlement after it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entitlement'
        default:
          $ref: '#/components/responses/Error'
  /v1/billing/apple/notifications:
    post:
      operationId: receiveAppleNotification
      summary: >-
        App Store Server Notifications v2 (BIL-003): renewals, expiries, refunds. Unauthenticated;
        the payload is verified up to Apple's root certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload: {type: string}
      responses:
        '200':
          description: Received.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/profile:
    put:
      operationId: updateProfile
      summary: Claim or change your handle, and optionally your display name. Handles are how friends find you.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '200':
          description: Your social identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUser'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/users/{handle}:
    get:
      operationId: getSocialUser
      summary: The user with exactly this handle and where they stand with you. 404 when nobody holds it or either of you blocked the other.
      parameters:
        - {name: handle, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friend-requests:
    get:
      operationId: listFriendRequests
      summary: Pending requests to you and from you, newest first.
      responses:
        '200':
          description: Both directions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequests'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: sendFriendRequest
      summary: Ask someone to be friends, by handle. If they already asked you, you become friends. Needs your own handle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FriendRequestCreate'}
      responses:
        '200':
          description: The user and where you now stand (outgoing or friend).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friend-requests/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: withdrawFriendRequest
      summary: Decline a request to you, or cancel one you sent. The other side is not told.
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friend-requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The new friend.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUser'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friends:
    get:
      operationId: listFriends
      summary: Your friends, by handle.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friends/{userId}:
    delete:
      operationId: removeFriend
      summary: Unfriend. Silent; the other side is not told.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: No longer friends.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/social-settings:
    get:
      operationId: getSocialSettings
      summary: What your friends may see. Strangers never see anything, whatever is set here.
      responses:
        '200':
          description: Your settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialSettings'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateSocialSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SocialSettings'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialSettings'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/progress:
    get:
      operationId: getProgress
      summary: >-
        Your points, level, streak and the badges you have not seen yet (GAM-001…004). Days are
        counted in the zone from `X-Timezone`, else the zone you last sent, else UTC. Clients read
        this after a write to show what was earned: one toast for a live unlock, one summary when
        `unseen.origin` is `batch` (an import or approved plan) or `backfill` (the first run).
      responses:
        '200':
          description: Your progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Progress'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/badges:
    get:
      operationId: listBadges
      summary: >-
        Every badge in the catalog with what you have of it. A hidden badge you have not earned
        comes back with only its id, family and `hidden`: no name, rule or progress.
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BadgeList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/badges/seen:
    post:
      operationId: markBadgesSeen
      summary: Marks earned badges (by award id) as seen, so they leave `unseen`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: {type: string, format: uuid}
      responses:
        '204':
          description: Seen.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/points:
    get:
      operationId: listPoints
      summary: The points ledger, newest first, a page at a time ("How you earned it").
      parameters:
        - {name: before, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, description: '1–100, 50 unless asked.', schema: {type: integer}}
      responses:
        '200':
          description: A page of the ledger.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PointsPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/leaderboard:
    get:
      operationId: getLeaderboard
      summary: >-
        The weekly friends board (GAM-005): you and friends who joined it, by points earned that
        week on each person's own local dates. Making friends and a first import do not count.
        Until you join (`leaderboardOptIn`), `optedIn` is false and nobody is listed. Never global.
      parameters:
        - name: week
          in: query
          description: An ISO week such as `2026-W43`. Absent means this week in your zone.
          schema: {type: string}
      responses:
        '200':
          description: The board.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Leaderboard'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friends/{userId}/profile:
    get:
      operationId: getFriendProfile
      summary: A friend's shelves and what you share. 404 for anyone who is not your friend. A friend who hides their library shows only their name (`sharing` false).
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendProfile'}
        default:
          $ref: '#/components/responses/Error'
  /v1/activity:
    get:
      operationId: listFriendActivity
      summary: Your friends' last two weeks, newest first, one row per friend, title and day. Only dated episode ticks and finishes; imports never show. Friends who hide their library are left out.
      parameters:
        - name: before
          in: query
          description: The `nextBefore` of the previous page.
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivityPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/activity/{id}/reaction:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'An ActivityItem id.'}
    put:
      operationId: setActivityReaction
      summary: React to a friend's activity row with one of six emoji; reacting again replaces it. Your own rows take none. 404 unless you can see the row.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReactionSet'}
      responses:
        '204':
          description: Saved.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: clearActivityReaction
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/recommendations:
    post:
      operationId: recommendTitle
      summary: Send a title to up to 10 friends, with an optional note of up to 140 characters. Anyone who is not your friend makes the whole request a 404. Needs your own handle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendationCreate'}
      responses:
        '204':
          description: Sent. A title already waiting for the same friend is not sent twice.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/recommendations:
    get:
      operationId: listRecommendations
      summary: Titles friends sent you that you have not added or dismissed, newest first. Only from people who are still your friends.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendationList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/recommendations/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: dismissRecommendation
      responses:
        '204':
          description: Dismissed.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/recommendations/{id}/add:
    post:
      operationId: addRecommendation
      summary: Put the title on your Plan to watch, as a tap would. A title you already have keeps its status. Either way it leaves your recommendations.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Added.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/blocks:
    get:
      operationId: listBlocks
      summary: People you blocked.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/blocks/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: blockUser
      summary: Block. Ends any friendship and pending requests both ways; from then on each of you is a 404 to the other.
      responses:
        '204':
          description: Blocked.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: unblockUser
      responses:
        '204':
          description: Unblocked. Friendship does not come back.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/invites:
    get:
      operationId: listFriendInvites
      summary: Your invite links that are still open, newest first.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendInviteList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createFriendInvite
      summary: Make a one-use invite link, live for 14 days, optionally carrying a title to watch together. Needs your own handle; at most 20 open at once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FriendInviteCreate'}
      responses:
        '200':
          description: The new link.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendInvite'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/invites/{code}:
    delete:
      operationId: revokeFriendInvite
      summary: Revoke one of your open invite links. Anyone opening it afterwards sees an invalid invite.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/invites/{code}/redeem:
    post:
      operationId: redeemFriendInvite
      summary: Accept an invite. You and the inviter become friends and the link is spent; already friends leaves it unspent. Needs your own handle.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InviteRedeem'}
      responses:
        '200':
          description: The new friend.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InviteRedemption'}
        default:
          $ref: '#/components/responses/Error'
  /v1/invites/{code}:
    get:
      operationId: getInvitePreview
      summary: What an invite link shows, signed in or not. Unauthenticated. 404 for any code that is unknown, spent, revoked, expired, or from someone who blocked you or whom you blocked.
      security: []
      parameters:
        - {name: code, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Who sent it and the title it carries.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvitePreview'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/reports:
    post:
      operationId: reportUser
      summary: Report a user to Aaru. The user is not told.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportCreate'}
      responses:
        '204':
          description: Received.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups:
    get:
      operationId: listGroups
      summary: Your groups, in the order you joined them, with unread and mention counts.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGroup
      summary: Create a group you own, with a #general channel. Needs your handle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupCreate'}
      responses:
        '200':
          description: The new group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getGroup
      summary: A group you are in, with its channels, members and pending invites. 404 to anyone else.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGroup
      summary: Rename the group. Owner and admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupCreate'}
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGroup
      summary: Delete the group, its channels and every message. Owner only.
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/members/{userId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateGroupMember
      summary: Make a member an admin, or an admin a member. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupMemberUpdate'}
      responses:
        '204':
          description: Changed.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeGroupMember
      summary: Remove a member, or yourself to leave. Admins remove members; the owner removes anyone and cannot leave.
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/transfer:
    post:
      operationId: transferGroup
      summary: Make another member the owner. You become an admin.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRef'}
      responses:
        '204':
          description: Transferred.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/invites:
    post:
      operationId: inviteToGroup
      summary: Invite a friend. Inviting again, or someone already in, changes nothing.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRef'}
      responses:
        '204':
          description: Invited.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/group-invites:
    get:
      operationId: listGroupInvites
      summary: Invites waiting for you, newest first.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupInviteList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/group-invites/{id}:
    delete:
      operationId: declineGroupInvite
      summary: Decline an invite to you, or cancel one you sent.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/group-invites/{id}/accept:
    post:
      operationId: acceptGroupInvite
      summary: Join the group.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The group you joined.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupSummary'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels:
    post:
      operationId: createChannel
      summary: Add a text channel. Owner and admins.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelCreate'}
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateChannel
      summary: Rename a channel or set its topic. Owner and admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelUpdate'}
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteChannel
      summary: Delete a channel and its messages. The first channel stays. Owner and admins.
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/messages:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listMessages
      summary: Messages oldest first. Without a cursor, the latest page.
      parameters:
        - name: before
          in: query
          description: Messages older than this one.
          schema: {type: string, format: uuid}
        - name: after
          in: query
          description: Messages newer than this one.
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          description: 1–100, default 50.
          schema: {type: integer}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMessagePage'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: postMessage
      summary: Post a message. A retry with the same clientNonce returns the first message.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMessage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/messages/{messageId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: editMessage
      summary: Edit your own message.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageUpdate'}
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMessage'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMessage
      summary: Delete your message, or any message as owner or admin. The row stays, empty.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/board:
    get:
      operationId: listBoard
      summary: The Board feed. Posts by you and your friends. `top` is this week's most upvoted, at most 10.
      parameters:
        - name: sort
          in: query
          schema: {type: string, enum: [recent, top], default: recent}
        - name: before
          in: query
          description: Posts older than this one. Ignored by `top`.
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          description: 1–50, default 20.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardPostPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/board/posts:
    post:
      operationId: createBoardPost
      summary: Post to the Board. Needs a handle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BoardPostCreate'}
      responses:
        '201':
          description: The post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardPost'}
        default:
          $ref: '#/components/responses/Error'
  /v1/board/posts/{postId}:
    parameters:
      - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getBoardPost
      summary: One post. 404 unless it is yours or a friend's.
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardPost'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: editBoardPost
      summary: Edit your own post.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BoardPostEdit'}
      responses:
        '200':
          description: The post.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardPost'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteBoardPost
      summary: Delete your own post.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/board/posts/{postId}/upvote:
    parameters:
      - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: upvoteBoardPost
      summary: Upvote a post. Upvoting twice counts once. 404 unless the post is yours or a friend's.
      responses:
        '204':
          description: Upvoted.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeBoardPostUpvote
      summary: Take your upvote back. Fine if you never gave one.
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/board/posts/{postId}/upvotes:
    parameters:
      - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listBoardPostUpvoters
      summary: Who upvoted a post, minus anyone blocked either way with you.
      responses:
        '200':
          description: The upvoters.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/board/posts/{postId}/comments:
    parameters:
      - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listBoardComments
      summary: Comments on a post, oldest first, minus anyone blocked either way with you. A deleted comment with replies stays as an empty row; one without is dropped. A page can come back shorter than the limit.
      parameters:
        - {name: after, in: query, required: false, description: The id of the last comment seen., schema: {type: string, format: uuid}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
      responses:
        '200':
          description: The comments.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardCommentPage'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createBoardComment
      summary: Comment on a post. A reply to a reply hangs off the top-level comment. 404 unless the post is yours or a friend's.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BoardCommentCreate'}
      responses:
        '201':
          description: The comment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardComment'}
        default:
          $ref: '#/components/responses/Error'
  /v1/board/posts/{postId}/comments/{commentId}:
    parameters:
      - {name: postId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: commentId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: deleteBoardComment
      summary: Delete a comment. Its author or the post's author can.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/read:
    post:
      operationId: markChannelRead
      summary: Mark the channel read up to a message. The read point never moves back.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadMark'}
      responses:
        '204':
          description: Marked.
        default:
          $ref: '#/components/responses/Error'
  /v1/realtime/ticket:
    post:
      operationId: createRealtimeTicket
      summary: >-
        A single-use ticket, valid 60 seconds, for opening the realtime socket from a browser,
        which cannot send an Authorization header on a WebSocket. Apps send their bearer token on
        the upgrade instead.
      responses:
        '200':
          description: The ticket and the socket URL to open with it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeTicket'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/me:
    put:
      operationId: updateMyMembership
      summary: >-
        Your own settings in a group. shareProgress shows your progress in its title channels; muted stops its mention
        alerts. Both are off by default.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MembershipUpdate'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupSummary'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/progress:
    get:
      operationId: getChannelProgress
      summary: A title channel's title, your progress, and the progress of members who share theirs in this group.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelProgress'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/items:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listChannelItems
      summary: A shelf channel's titles, with your own library status for each.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelItemList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addChannelItem
      summary: Add a title to a shelf channel. Any member can; adding one already there changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelItemCreate'}
      responses:
        '200':
          description: The shelf.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelItemList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/items/{titleId}:
    delete:
      operationId: removeChannelItem
      summary: Take a title off a shelf channel. Any member can.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: titleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWatchParty
      summary: A watch channel's newest party, ended or not, and the server's clock for the countdown.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: openWatchParty
      summary: Open a party in the lobby. A show needs the episode. One open party per channel (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPartyCreate'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/ready:
    post:
      operationId: setWatchPartyReady
      summary: Say you are ready, or not.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPartyReady'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/start:
    post:
      operationId: startWatchParty
      summary: Start the countdown. The host or an admin.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPartyStart'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/end:
    post:
      operationId: endWatchParty
      summary: End the party. The host or an admin.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/watched:
    post:
      operationId: markWatchPartyWatched
      summary: Mark the party's episode, film or book watched in your own library. Nobody else's.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Marked.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices:
    put:
      operationId: registerDevice
      summary: Register this device for pushes. A token registered again moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegistration'}
      responses:
        '204':
          description: Registered.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices/{token}:
    delete:
      operationId: unregisterDevice
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Forgotten.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices/live-activity:
    put:
      operationId: registerLiveActivityToken
      summary: >-
        Hand over an ActivityKit push token (SCR-008, SCR-009): the device's push-to-start token
        for `NowPlayingActivityAttributes` (`start`), or the running "Now playing" activity's own
        token (`update`). The server then starts, updates and ends the activity from what plays.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LiveActivityRegistration'}
      responses:
        '204':
          description: Registered.
        default:
          $ref: '#/components/responses/Error'
  /v1/web-push/key:
    get:
      operationId: getWebPushKey
      summary: The VAPID public key a browser subscribes with. 503 `push_unavailable` when web push is off.
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebPushKey'}
        default:
          $ref: '#/components/responses/Error'
  /v1/web-push/subscriptions:
    put:
      operationId: saveWebPushSubscription
      summary: Save this browser's push subscription. Saved again, it moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebPushSubscription'}
      responses:
        '204':
          description: Saved.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWebPushSubscription
      parameters:
        - {name: endpoint, in: query, required: true, schema: {type: string}}
      responses:
        '204':
          description: Forgotten.
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/tokens:
    get:
      operationId: listAgentTokens
      summary: The user's live agent tokens (OUT-001), newest first. Secrets are never returned.
      parameters:
        - name: for
          in: query
          description: >-
            Which surface's tokens: the Stremio addon, MCP clients, the browser extension
            (`scrobble`), or music scrobblers (`music`). Defaults to `stremio`, so Apple builds
            that only know the Stremio kind never see another kind.
          schema: {type: string, enum: [stremio, mcp, scrobble, music], default: stremio}
      responses:
        '200':
          description: Live tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AgentToken'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAgentToken
      summary: >-
        Mint a token for an outside caller. A Stremio token's answer carries the addon's install
        links; an MCP client's carries its setup, with the secret filled in. The secret is shown
        once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentTokenCreate'}
      responses:
        '201':
          description: Minted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTokenCreated'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans:
    get:
      operationId: listPlans
      summary: >-
        Changes outside agents asked for that wait for the user (OUT-004), newest first. Only a
        signed-in session reaches the plan routes; an agent token never does.
      parameters:
        - name: status
          in: query
          description: '`pending` (default) leaves out decided and expired plans.'
          schema: {type: string, enum: [pending, all], default: pending}
      responses:
        '200':
          description: Plans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}:
    get:
      operationId: getPlan
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}/approve:
    post:
      operationId: approvePlan
      summary: >-
        Apply the plan as one undoable action named after its agent. 409 `plan_stale` when the
        library changed since it was made (nothing is written), `plan_expired`, or `plan_decided`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [plan, action]
                properties:
                  plan: {$ref: '#/components/schemas/AgentPlan'}
                  action: {$ref: '#/components/schemas/Action'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}/deny:
    post:
      operationId: denyPlan
      summary: Refuse the plan. Nothing is written; the plan stays as the record of what was asked.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/oauth/requests/{id}:
    get:
      operationId: getOAuthRequest
      summary: >-
        A connection an app asked for over OAuth (Claude's custom connector), for the consent
        page. Expires ten minutes after the app asked.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthConsentRequest'}
        default:
          $ref: '#/components/responses/Error'
  /v1/oauth/requests/{id}/approve:
    post:
      operationId: approveOAuthRequest
      summary: >-
        Allow the app. Only the browser that started the request holds its binding (the
        `aaru_oauth` cookie the API set); the answer is where to send the browser next.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding]
              properties:
                binding: {type: string}
                name: {type: string, maxLength: 80}
                allowLibraryWrites: {type: boolean}
      responses:
        '200':
          description: Send the browser here.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthRedirect'}
        default:
          $ref: '#/components/responses/Error'
  /v1/oauth/requests/{id}/deny:
    post:
      operationId: denyOAuthRequest
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding]
              properties:
                binding: {type: string}
      responses:
        '200':
          description: Send the browser here.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthRedirect'}
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/setup/{kind}:
    get:
      operationId: getAgentSetup
      summary: >-
        How to connect one MCP client (OUT-004), with a placeholder where the secret goes, so
        Settings can show the steps before a token exists.
      parameters:
        - name: kind
          in: path
          required: true
          schema: {$ref: '#/components/schemas/AgentMCPKind'}
      responses:
        '200':
          description: The client's setup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSetup'}
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/tokens/{id}:
    delete:
      operationId: revokeAgentToken
      summary: Revoke a token. Its addon stops answering at once.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/notifications:
    get:
      operationId: getNotificationSettings
      responses:
        '200':
          description: The user's notification choices.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationSettings
      summary: Changes the switches sent; any left out keep their value.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSettingsUpdate'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/profile/stats:
    get:
      operationId: getProfileStats
      summary: >-
        All-time numbers for the profile (GAM-006b), from the library as it is: every ticked episode
        counts, imported and undated ones too, so these can exceed `/v1/me/stats?span=all`, which
        counts dated activity only.
      responses:
        '200':
          description: The profile's stats.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProfileStats'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/stats:
    get:
      operationId: getStats
      summary: >-
        What the user watched and read in one calendar year or month of their time zone (GAM-006a),
        in all time (GAM-006c), or in the last 7 or 30 days (GAM-006d). Derived only from their own
        library. Imported history counts only where it carries a real date.
      parameters:
        - name: year
          in: query
          description: Required unless `span` is sent.
          schema: {type: integer}
        - name: span
          in: query
          description: >-
            `all` is all time: every year from the first active one through the current year,
            one bucket per year, so its totals equal the years' summed. `last7` and `last30` are
            the 7 or 30 days ending today, one bucket per day, with `prior` holding the window
            just before. A span takes no `year` or `month` (422 otherwise).
          schema:
            type: string
            enum: [all, last7, last30]
        - name: month
          in: query
          description: 1–12. Absent means the whole year.
          schema: {type: integer}
        - name: tz
          in: query
          description: IANA time zone for day and month boundaries. Absent means UTC.
          schema: {type: string}
      responses:
        '200':
          description: The period's stats.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stats'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/now-playing:
    get:
      operationId: getNowPlaying
      summary: >-
        What players are playing for you now: Stremio and streaming sites through the browser
        extension (SCR-008), a music scrobbler's `playing_now` and YouTube videos (SCR-009).
        `positionMs` is where a player was at `updatedAt`; a client adds the time since while
        `state` is `playing`. A report too old to believe no longer counts.
      responses:
        '200':
          description: What plays, if anything.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NowPlayingReply'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/listens:
    get:
      operationId: listListens
      summary: >-
        Your listening log, newest first (MUS-005): what music scrobblers sent with your music
        token over ListenBrainz's protocol at `/listenbrainz/1/submit-listens`.
      parameters:
        - name: before
          in: query
          description: Only listens that started before this time; the previous page's `next`.
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          description: 1–100, default 20.
          schema: {type: integer}
      responses:
        '200':
          description: A page of listens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListenPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/listens/top:
    get:
      operationId: getTopListens
      summary: >-
        Your most played artists, tracks or albums over a period (MUS-005). The period is chosen
        as for `/v1/me/stats`: a year, a month of it, or a span.
      parameters:
        - name: by
          in: query
          required: true
          schema: {type: string, enum: [artist, track, album]}
        - name: year
          in: query
          description: Required unless `span` is sent.
          schema: {type: integer}
        - name: span
          in: query
          schema: {type: string, enum: [all, last7, last30]}
        - name: month
          in: query
          description: 1–12. Absent means the whole year.
          schema: {type: integer}
        - name: tz
          in: query
          description: IANA time zone for day and month boundaries. Absent means UTC.
          schema: {type: string}
        - name: limit
          in: query
          description: 1–50, default 10.
          schema: {type: integer}
        - name: artist
          in: query
          description: Only this artist's listens, compared case- and space-folded (MUS-008).
          schema: {type: string, maxLength: 500}
      responses:
        '200':
          description: The period's top list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListenTop'}
        default:
          $ref: '#/components/responses/Error'
  /v1/search:
    get:
      operationId: searchCatalog
      summary: Search the catalog. Results are catalog projections, never library rows.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: >-
            `all` searches films, shows and anime together (TMDB and AniList in parallel, merged;
            books and albums are never included); `anime` searches AniList; `movie`/`show` TMDB;
            `book` Open Library; `album` MusicBrainz (albums and EPs, MUS-001).
          schema:
            type: string
            enum: [all, movie, show, anime, book, album]
      responses:
        '200':
          description: >-
            Matches, best first. With `all`, exact title matches lead, then TMDB and AniList hits
            alternate, at most 40; a TMDB show is left out only when an AniList hit in the same
            results is mapped to it, and that hit then carries `ids.tmdb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        default:
          $ref: '#/components/responses/Error'
  /v1/discover:
    get:
      operationId: getDiscover
      summary: Provider-curated public rows for Home (trending, airing, this season).
      description: >-
        The same lists for every user, cached by the server. Items the caller already has
        carry `libraryItemId`. A row whose provider is down is left out.
      responses:
        '200':
          description: Rows in display order. Empty rows are left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverRows'
        default:
          $ref: '#/components/responses/Error'
  /v1/discover/season:
    get:
      operationId: getDiscoverSeason
      summary: One season's titles for the Seasons view (DISC-002), a page at a time.
      description: >-
        A season is a calendar quarter in UTC: winter Jan–Mar, spring Apr–Jun, summer Jul–Sep,
        fall Oct–Dec. Anime by AniList's broadcast season, new shows by first air date,
        returning shows by an episode airing that season, films by first release. The same
        lists for every user, cached by the server; items the caller has carry `libraryItemId`.
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [anime, shows_new, shows_returning, movies]
        - name: season
          in: query
          required: true
          schema:
            type: string
            enum: [winter, spring, summer, fall]
        - name: year
          in: query
          required: true
          description: 1970 to next year; anything else is 422 `validation_failed`.
          schema: {type: integer}
        - name: page
          in: query
          required: false
          description: 1-based, at most 20.
          schema: {type: integer, default: 1}
      responses:
        '200':
          description: The page. `unavailable` when the provider is down and nothing is cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/concerts/near:
    post:
      operationId: getConcertsNear
      summary: Music events around a point or the saved "Concerts near" city (MUS-003), soonest first.
      description: >-
        POST so a position never sits in a URL. Coordinates are rounded to two decimals (about a
        kilometre) and used for this request only: never stored, never logged. With no coordinates
        the saved city is the centre; with neither, 409 `no_place`. The same list for everyone in
        the same area, cached by the server and linked out to Ticketmaster for tickets.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConcertsNearRequest'}
      responses:
        '200':
          description: The page. `unavailable` when concerts are off or the provider is down.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/concerts/artists:
    get:
      operationId: getArtistConcerts
      summary: Upcoming concerts by the artists of the user's albums (MUS-003).
      description: >-
        Derived from the user's own library, like the calendar; dropped albums aside. An artist
        counts only when Ticketmaster lists them with the same MusicBrainz id. Artists added in
        the last hour may still be `pending`.
      responses:
        '200':
          description: The concerts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistConcerts'}
        default:
          $ref: '#/components/responses/Error'
  /v1/concerts/places:
    get:
      operationId: searchConcertPlaces
      summary: Cities matching what the user typed, for the "Concerts near" picker (MUS-003).
      parameters:
        - name: q
          in: query
          required: true
          description: 2 to 100 characters. Not logged.
          schema: {type: string}
      responses:
        '200':
          description: Up to eight places, best first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPlaceList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/concert-place:
    get:
      operationId: getConcertPlace
      summary: The saved "Concerts near" city, and whether concerts are on at all.
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPlaceSetting'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveConcertPlace
      summary: Saves the "Concerts near" city, rounded to two decimals.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConcertPlace'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPlaceSetting'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteConcertPlace
      summary: Forgets the "Concerts near" city.
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Error'
  /v1/titles/{id}:
    get:
      operationId: getTitle
      summary: A title from the catalog. Shows include their seasons and episodes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetail'
        default:
          $ref: '#/components/responses/Error'
  /v1/titles/{id}/posts:
    get:
      operationId: listTitlePosts
      summary: Posts about this title by you and your friends, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: 1–50, default 20.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BoardPostPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items:
    get:
      operationId: listLibraryItems
      summary: The user's library, most recently updated first. Shelves use the same filters.
      parameters:
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/MediaType'}}
        - {name: anime, in: query, required: false, schema: {type: boolean}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/LibraryStatus'}}
        - {name: owned, in: query, required: false, schema: {type: boolean}}
        - {name: list, in: query, required: false, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addLibraryItem
      summary: Add a title to the library. Adding the same title again returns the existing item.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddLibraryItem'}
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getLibraryItem
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLibraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryItemPatch'}
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLibraryItem
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/episodes/{season}/{episode}:
    put:
      operationId: setEpisodeWatched
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season, in: path, required: true, schema: {type: integer}}
        - {name: episode, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodeWatched'}
      responses:
        '200':
          description: The item with updated progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/seasons/{season}/watched:
    post:
      operationId: markSeasonWatched
      summary: Mark every aired episode of a season watched, as one undoable action.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The item with updated progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/watched:
    post:
      operationId: markShowWatched
      summary: >-
        Mark a whole show watched (PROG-005): every aired regular episode, as one undoable action
        with the watch dates unknown, so the Recap and Insights do not count them as today. An
        ended or canceled show becomes finished; a running one stays in progress, caught up.
        422 for anything but a show.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The item, the action to undo it with, and how many episodes it ticked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShowWatched'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/sync:
    get:
      operationId: syncLibrary
      summary: Items changed and ids deleted since a previous sync token (all items when absent).
      parameters:
        - {name: since, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The changes and the token for next time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibrarySync'}
        default:
          $ref: '#/components/responses/Error'
  /v1/actions:
    get:
      operationId: listActions
      summary: The action journal, newest first. Backs the undo ribbon.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Actions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/undo:
    post:
      operationId: undoAction
      summary: Apply an action's inverse. Journaled as its own action; undoing twice is 409.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The undo, as an action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists:
    get:
      operationId: listLists
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateList'}
      responses:
        '200':
          description: The new list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getList
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameList
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameList'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteList
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/items:
    post:
      operationId: addListItem
      summary: Add a title to a list. It need not be in the library.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddListItem'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/items/{titleId}:
    delete:
      operationId: removeListItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: titleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/order:
    put:
      operationId: reorderList
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListOrder'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports:
    get:
      operationId: listImports
      summary: The user's imports, newest first.
      responses:
        '200':
          description: Up to 50 imports.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/export:
    get:
      operationId: exportAccount
      summary: Everything Aaru holds for the caller, to keep or move elsewhere (GDPR portability).
      description: >-
        `json` (default) is complete: account, every library item with ratings, notes and every
        watched episode, lists and shelves. `csv` is one row per library item in the column layout
        Aaru's own "Any site" import reads, so it can be re-imported here or opened in a spreadsheet.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: The export, as a download.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountExport'}
            text/csv:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/csv:
    post:
      operationId: createCSVImport
      summary: Upload an export file. It is parsed now, matched in the background, and written only after approval.
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [auto, imdb, letterboxd, netflix, tvtime, goodreads, mal, csv]
          description: >-
            `auto` detects the format: MyAnimeList-format XML (also exported by Kitsu and AniList),
            an IMDb, Letterboxd, Netflix viewing activity, TV Time or Goodreads CSV, or any other CSV
            read by its column names (`csv`). `tvtime` takes one CSV from TV Time's export at a time:
            `tvtime-series-episodes.csv`, `tvtime-series.csv` or `tvtime-movies.csv` (Export my
            data), or `tracking-prod-records-v2.csv`, `tracking-prod-records.csv`,
            `followed_tv_show.csv` or `seen_episode.csv` (GDPR export).
        - name: filename
          in: query
          required: false
          description: The file's name. Letterboxd's watchlist export is told apart by it.
          schema: {type: string}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          # MyAnimeList's list export, decompressed (source=mal).
          application/xml:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/cat:
    post:
      operationId: createCATImport
      summary: >-
        Import shows from Pogdesign CAT: a pasted list (one show per line, `Name` or `Name (2026)`) or the
        exported iCal file. Parsed now, matched in the background, written only after approval. Every show
        is planned as wishlist; CAT's watched episodes do not come across.
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string, format: binary}
          text/calendar:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/cat/feed:
    post:
      operationId: createCATFeedImport
      summary: >-
        Import shows from the user's CAT iCal link (https://www.pogdesign.co.uk/cat/download_ics/… or
        generate_ics/…). The calendar is read once, now; the link holds the user's CAT key and is not kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 512, description: The iCal link from CAT.}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/capture:
    post:
      operationId: createCaptureImport
      summary: >-
        Capture (AG-006): pasted text, one image, or a link to a title on TMDB, AniList or Open Library,
        planned like any import and written only after approval. Links are read from the URL alone,
        never fetched. Text and images are read by Aaru's model in the background and deleted once read.
        A free account starts 3 captures a calendar month (UTC); the next is refused with 402
        `capture_quota`. Letterboxd and IMDb links are refused with `capture_use_csv`, other links with
        `capture_unsupported_url`; `capture_unavailable` (503) means no model is configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Exactly one of `text` and `url`.
              properties:
                text: {type: string, maxLength: 20000}
                url: {type: string, maxLength: 2048}
          image/jpeg:
            schema: {type: string, format: binary}
          image/png:
            schema: {type: string, format: binary}
          image/gif:
            schema: {type: string, format: binary}
          image/webp:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Queued for reading and matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/anilist:
    post:
      operationId: createAniListImport
      summary: Import a public AniList anime list by username. Read and matched in the background, written only after approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, description: "AniList username: 2–20 letters, digits or underscores."}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/stremio/link:
    post:
      operationId: startStremioLink
      summary: >-
        Start a Stremio history import. Show the user `link` (or `qrcode`) to approve on stremio.com, then
        poll POST /v1/imports/stremio/link/{code}. No password reaches Aaru; the session the code opens is
        used for one library read, then logged out.
      responses:
        '200':
          description: A code to approve.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StremioLink'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/stremio/link/{code}:
    post:
      operationId: pollStremioLink
      summary: >-
        Ask whether the code was approved. 204 while pending (ask again in a few seconds); 202 with the queued
        import once approved; 410 `stremio_link_expired` when the code ran out.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '202':
          description: Approved. The library was read and its import queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '204':
          description: Not approved yet.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt:
    post:
      operationId: createTraktImport
      summary: Import the connected Trakt account. Read and matched in the background, written only after approval.
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt/connect:
    post:
      operationId: connectTrakt
      summary: >-
        Start connecting Trakt (PKCE). Open the returned address in a browser. Trakt then redirects to
        GET /v1/imports/trakt/callback (a plain redirect route outside this spec: its Location must not be
        percent-encoded), which sends the browser on to `returnTo` with `trakt=connected|denied|failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TraktConnectRequest'}
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraktConnectStart'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt/connection:
    get:
      operationId: getTraktConnection
      responses:
        '200':
          description: Whether Trakt is connected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraktConnection'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectTrakt
      summary: Revoke the Trakt tokens on Trakt, then forget them. Imported items stay.
      responses:
        '204':
          description: Disconnected.
        default:
          $ref: '#/components/responses/Error'
  /v1/connections/mal/connect:
    post:
      operationId: connectMAL
      summary: >-
        Start connecting MyAnimeList (PKCE, `plain`, the only method MAL accepts). Open the returned address in a
        browser. MAL then redirects to GET /v1/connections/mal/callback (a plain redirect route outside this spec),
        which sends the browser on to `returnTo` with `mal=connected|denied|failed`. Once connected, anime progress
        written from then on is pushed to the MAL list (SCR-005).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MALConnectRequest'}
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MALConnectStart'}
        default:
          $ref: '#/components/responses/Error'
  /v1/connections/mal:
    get:
      operationId: getMALConnection
      responses:
        '200':
          description: Whether MyAnimeList is connected, and whether it must be connected again.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MALConnection'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectMAL
      summary: Forget the MyAnimeList tokens. Nothing more is pushed; the MAL list and the library stay as they are.
      responses:
        '204':
          description: Disconnected.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getImport
      summary: One import with every row and what its plan does with it.
      responses:
        '200':
          description: The import.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteImport
      summary: Discard an import. Library items it already created stay; undo the import action for those.
      responses:
        '204':
          description: Discarded.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}/apply:
    post:
      operationId: applyImport
      summary: Approve the plan. Writes it as one undoable action.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}/rows/{index}/resolve:
    post:
      operationId: resolveImportRow
      summary: >-
        Match one unmatched row by hand (IMP-011), with a title the person picked from a search.
        Before the plan is approved the pick joins the plan; after it, the row is written at once
        as its own undoable action. The source's status, rating and ticks come with it, merged
        like any import row.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: index, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaRef]
              properties:
                mediaRef: {$ref: '#/components/schemas/MediaRef'}
      responses:
        '200':
          description: Matched. The job's counts and the row as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [job, row]
                properties:
                  job: {$ref: '#/components/schemas/ImportJob'}
                  row: {$ref: '#/components/schemas/ImportRow'}
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves:
    get:
      operationId: listShelves
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShelfList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShelf
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShelf'}
      responses:
        '200':
          description: The new shelf.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shelf'}
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateShelf
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateShelf'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shelf'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShelf
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves/{id}/items:
    get:
      operationId: listShelfItems
      summary: The shelf's query, resolved now. Same DTO as GET /v1/library/items.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/calendar:
    get:
      operationId: getCalendar
      summary: Episodes of tracked shows airing in [from, to), at most 42 days (a month grid). Times are UTC.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Episodes, by air time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        default:
          $ref: '#/components/responses/Error'
  /v1/up-next:
    get:
      operationId: getUpNext
      summary: >-
        Continue Watching, Start Watching, status counts and Unfinished business for the home
        screen, in one call.
      responses:
        '200':
          description: The home rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpNext'}
        default:
          $ref: '#/components/responses/Error'
  /v1/tonight:
    get:
      operationId: getTonight
      summary: >-
        One to three things to start tonight (AG-005), ranked from the user's own library: the next
        episode of shows in progress, today's airings, books in progress, wishlist films. Reasons
        are templates; no model is called.
      parameters:
        - name: tz
          in: query
          description: IANA time zone for "today" and air times. Absent means UTC.
          schema: {type: string}
      responses:
        '200':
          description: The strip for the local day.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tonight'}
        default:
          $ref: '#/components/responses/Error'
  /v1/tonight/{id}/feedback:
    post:
      operationId: sendTonightFeedback
      summary: >-
        "Not tonight" hides the item until the local day ends; "rejected" (not for me) weighs against
        it for 14 days.
      parameters:
        - {name: id, in: path, required: true, description: The library item., schema: {type: string, format: uuid}}
        - name: tz
          in: query
          description: IANA time zone for the local day. Absent means UTC.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TonightFeedback'}
      responses:
        '204':
          description: Recorded.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `page.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    AgentToken:
      type: object
      required: [id, name, kind, scopes, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        scopes:
          type: array
          items: {type: string, enum: ['library:read', 'library:write', 'scrobble:write', 'imports:write']}
        createdAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: Recorded at most once an hour.
    AgentTokenCreate:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        name: {type: string, maxLength: 80}
        allowLibraryWrites:
          type: boolean
          description: >-
            Adds `library:write`. For Stremio, its "unwatched" and "add to library" reach Aaru;
            removing from Stremio's library never deletes anything in Aaru. For an MCP client, it
            may change one item directly, as a tap does; anything larger waits for approval in
            Aaru. Off by default.
        allowImports:
          type: boolean
          description: >-
            MCP clients only: adds `imports:write`, so the agent may hand Aaru a list to import.
            The import is reviewed and approved in Aaru like any other. Off by default.
        scrobbler:
          $ref: '#/components/schemas/MusicScrobbler'
          description: >-
            Music tokens only: which scrobbler this token is for. It names the token and picks
            the setup steps in `music`. `other` when left out.
    AgentPlan:
      type: object
      required: [id, status, agentName, summary, changes, counts, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, applied, denied, stale, expired]}
        agentName:
          type: string
          description: The connection that asked, as the user named it.
        summary: {type: string}
        changes:
          type: array
          items:
            type: object
            required: [text, titleId, title, type]
            properties:
              text: {type: string}
              titleId: {type: string, format: uuid}
              title: {type: string}
              type: {$ref: '#/components/schemas/MediaType'}
              posterUrl: {type: string}
              libraryItemId:
                type: string
                description: Absent when the change adds the title.
        counts:
          type: object
          required: [adds, updates, removes, episodes]
          properties:
            adds: {type: integer}
            updates: {type: integer}
            removes: {type: integer}
            episodes: {type: integer}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
        actionId:
          type: string
          description: The journaled action, once applied; undo it like any other.
    OAuthConsentRequest:
      type: object
      required: [id, clientName, redirectHost, kind, expiresAt]
      properties:
        id: {type: string, format: uuid}
        clientName:
          type: string
          description: The name the app registered with. Apps name themselves; show the host too.
        redirectHost:
          type: string
          description: Where the app returns the user. This part an impostor cannot fake.
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        expiresAt: {type: string, format: date-time}
    OAuthRedirect:
      type: object
      required: [redirectTo]
      properties:
        redirectTo: {type: string}
    AgentTokenKind:
      type: string
      description: >-
        Which outside caller a token is for. The MCP kinds differ only in the setup shown; they
        reach the same tools. `browser` is Aaru's browser extension and `music` a music
        scrobbler speaking ListenBrainz's protocol (MUS-005); both can only scrobble.
      enum: [stremio, claude_code, codex, hermes, gemini, other, claude, browser, music]
    AgentMCPKind:
      type: string
      enum: [claude, claude_code, codex, hermes, gemini, other]
    MusicScrobbler:
      type: string
      enum: [web_scrobbler, pano_scrobbler, navidrome, jellyfin, other]
    MusicSetup:
      type: object
      description: >-
        How to point one scrobbler at Aaru (MUS-007): numbered steps, some with a link to
        open and values to copy. The token appears in full only here, right after minting.
      required: [scrobbler, title, submitUrl, baseUrl, steps]
      properties:
        scrobbler: {$ref: '#/components/schemas/MusicScrobbler'}
        title: {type: string}
        submitUrl:
          type: string
          description: The full `submit-listens` URL, for clients that ask for it.
        baseUrl:
          type: string
          description: The ListenBrainz-style root, for clients that add `1/submit-listens` themselves.
        steps:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: {type: string}
              link:
                type: object
                required: [label, url]
                properties:
                  label: {type: string}
                  url: {type: string}
              fields:
                type: array
                description: Values to copy, each with the label the scrobbler shows next to its field.
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: {type: string}
                    value: {type: string}
                    secret:
                      type: boolean
                      description: The token. Clients mask it until copied.
    AgentSetup:
      type: object
      description: >-
        How to connect one MCP client: the endpoint, then steps to copy. Before a token exists
        the secret reads `PASTE_YOUR_TOKEN_HERE`.
      required: [kind, title, url, auth, steps, prompt]
      properties:
        kind: {$ref: '#/components/schemas/AgentMCPKind'}
        title: {type: string}
        auth:
          type: string
          enum: [token, oauth]
          description: >-
            `token`: create a token in Aaru and paste it. `oauth`: add Aaru in the client, which
            sends the user to Aaru to approve; no token to copy.
        url:
          type: string
          description: The MCP endpoint (streamable HTTP).
        steps:
          type: array
          items:
            type: object
            required: [label, language, text]
            properties:
              label: {type: string}
              language: {type: string, enum: [bash, json, toml, yaml, text]}
              text: {type: string}
              note: {type: string}
        prompt:
          type: string
          description: A message to paste into the agent once it is connected.
    AgentTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: '#/components/schemas/AgentToken'}
        secret:
          type: string
          description: Shown once. Anyone holding it, or the install links, can use the token.
        stremio:
          type: object
          description: Only for a Stremio token.
          required: [manifestUrl, installUrl, webInstallUrl]
          properties:
            manifestUrl: {type: string}
            installUrl:
              type: string
              description: The `stremio://` link that opens the Stremio app.
            webInstallUrl: {type: string}
        setup: {$ref: '#/components/schemas/AgentSetup'}
        music: {$ref: '#/components/schemas/MusicSetup'}
    ErrorResponse:
      type: object
      description: The one error shape every route returns.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`, `validation_failed`.
        message:
          type: string
          description: Human-readable explanation. Never contains internal detail.
        details:
          type: object
          description: Optional per-field detail, keyed by request field name (e.g. `rating`).
          additionalProperties:
            type: string
    PageInfo:
      type: object
      description: |
        Cursor pagination envelope. List routes return `{ items: [...], page: PageInfo }`.
        Cursors are keyed on `(updated_at, id)`; a null `nextCursor` means the last page.
      properties:
        nextCursor:
          type: [string, 'null']
    AppleSignInRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The JWT from ASAuthorizationAppleIDCredential / Sign in with Apple JS.
        nonce:
          type: string
          description: The raw nonce whose SHA-256 the client sent to Apple.
        displayName:
          type: string
          description: Apple sends the name only on the first authorization; pass it then.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    MagicLinkVerifyRequest:
      type: object
      description: Either `token` (from the link) or `email` and `code` (from the same email).
      properties:
        token:
          type: string
        email:
          type: string
        code:
          type: string
          description: Six digits; spaces and dashes are ignored.
    TraktConnectRequest:
      type: object
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: Where the browser goes after Trakt (the app's `aaru://` scheme or the web app). Must be allowed by the server.
    TraktConnectStart:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl: {type: string}
    TraktConnection:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
        username: {type: string}
        connectedAt: {type: string, format: date-time}
    MALConnectRequest:
      type: object
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: Where the browser goes after MyAnimeList (the app's `aaru://` scheme or the web app). Must be allowed by the server.
    MALConnectStart:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl: {type: string}
    MALConnection:
      type: object
      required: [connected, needsReconnect]
      properties:
        connected: {type: boolean}
        username: {type: string}
        connectedAt: {type: string, format: date-time}
        needsReconnect:
          type: boolean
          description: MyAnimeList refused the tokens. Nothing is pushed until the user connects again.
    StremioLink:
      type: object
      required: [code, link, qrcode, expiresAt]
      properties:
        code: {type: string}
        link: {type: string, format: uri, description: "The stremio.com page where the user approves the code."}
        qrcode: {type: string, format: uri, description: "A QR image of `link`, for scanning with a phone."}
        expiresAt: {type: string, format: date-time}
    ImportJob:
      type: object
      required: [id, source, state, stats, createdAt, updatedAt, rowsTotal, rowsMatched]
      properties:
        id: {type: string, format: uuid}
        source:
          type: string
          enum: [trakt, stremio, imdb_csv, letterboxd_csv, goodreads_csv, cat_list, cat_ics, netflix_csv, tvtime_csv, mal_xml, anilist, csv, capture]
        state:
          type: string
          enum: [queued, running, planned, succeeded, failed, partial]
          description: "`planned` waits for approval; nothing is written before it."
        stats: {$ref: '#/components/schemas/ImportStats'}
        errorSummary: {type: string}
        filename:
          type: string
          description: The uploaded file's name, or the AniList username for an `anilist` import.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        rowsTotal:
          type: integer
          description: >-
            Rows read from the file or provider. 0 for a Trakt or AniList import until the worker
            has read the account.
        rowsMatched:
          type: integer
          description: >-
            Rows matched so far while `running` (IMP-017); back to 0 when a failed attempt is
            retried. With `rowsTotal` it is the import's progress.
        actionId:
          type: string
          format: uuid
          description: >-
            The action that applied the plan, once approved and if it wrote anything. Undo it with
            POST /v1/actions/{id}/undo.
    ImportStats:
      type: object
      required: [created, updated, skipped, unmatched]
      properties:
        created: {type: integer}
        updated: {type: integer}
        skipped: {type: integer}
        unmatched: {type: integer}
    ImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ImportJob'}
    ImportRow:
      type: object
      required: [index, title, type, outcome]
      properties:
        index: {type: integer}
        title: {type: string}
        year: {type: integer}
        author: {type: string}
        type: {$ref: '#/components/schemas/MediaType'}
        sourceKey: {type: string}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        outcome:
          type: string
          enum: [pending, create, update, skip, unmatched]
        reason: {type: string}
        titleId: {type: string, format: uuid}
    ImportDetail:
      type: object
      required: [job, rows]
      properties:
        job: {$ref: '#/components/schemas/ImportJob'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/ImportRow'}
    DeviceRegistration:
      type: object
      required: [token, environment, bundleId]
      properties:
        token: {type: string, description: The APNs device token, hex.}
        environment:
          type: string
          enum: [sandbox, production]
          description: "`sandbox` for Xcode builds; `production` for TestFlight and the App Store."
        bundleId: {type: string}
    LiveActivityRegistration:
      type: object
      required: [token, kind, environment, bundleId]
      properties:
        token: {type: string, description: The ActivityKit push token, hex.}
        kind:
          type: string
          enum: [start, update]
          description: "`start` is the device's push-to-start token; `update` one activity's own."
        watchEventId:
          type: string
          format: uuid
          deprecated: true
          description: Ignored since SCR-009, when one activity shows everything playing.
        environment:
          type: string
          enum: [sandbox, production]
        bundleId: {type: string}
    NowPlayingReply:
      type: object
      required: [items]
      properties:
        nowPlaying:
          $ref: '#/components/schemas/NowPlaying'
          description: The newest library episode or movie playing; kept for clients older than `items`.
        items:
          type: array
          maxItems: 3
          description: >-
            Everything playing now (SCR-009), in the Live Activity's order: library episodes,
            movies and videos first, newest first, then tracks. Empty when nothing plays.
          items: {$ref: '#/components/schemas/NowPlayingItem'}
    NowPlaying:
      type: object
      required: [watchEventId, title, source, state, positionMs, durationMs, updatedAt]
      properties:
        watchEventId: {type: string, format: uuid}
        libraryItemId:
          type: string
          format: uuid
          description: Absent when the title is not in the library yet.
        title: {$ref: '#/components/schemas/TitleSummary'}
        episode:
          $ref: '#/components/schemas/EpisodeRef'
        episodeName: {type: string}
        source:
          type: string
          enum: [stremio, netflix, disney_plus, prime_video]
        state:
          type: string
          enum: [playing, paused]
        positionMs:
          type: integer
          format: int64
          description: Where the player was at `updatedAt`.
        durationMs:
          type: integer
          format: int64
          description: The player's duration, else the catalog runtime; 0 when neither is known.
        updatedAt: {type: string, format: date-time}
    NowPlayingItem:
      type: object
      required: [id, kind, name, source, state, positionMs, durationMs, updatedAt]
      properties:
        id:
          type: string
          description: The watch event or the play; a new id means the next thing plays.
        kind:
          type: string
          enum: [episode, movie, track, video]
        name: {type: string, description: 'The show, film, track or video name.'}
        subtitle: {type: string, description: '"S1 · E8 · Lanterns", the artist, or the channel.'}
        service: {type: string, description: 'Where it plays, as a person reads it: "Stremio", "YouTube Music".'}
        source:
          type: string
          enum: [stremio, netflix, disney_plus, prime_video, listenbrainz, youtube]
        state:
          type: string
          enum: [playing, paused]
        positionMs:
          type: integer
          format: int64
          description: Where the player was at `updatedAt`; a client adds the time since while `playing`.
        durationMs:
          type: integer
          format: int64
          description: 0 when unknown.
        updatedAt: {type: string, format: date-time}
        artworkUrl: {type: string, description: 'Poster, cover or video thumbnail.'}
        originUrl: {type: string, description: 'Tracks and videos: where it plays, when the player said.'}
        libraryItemId:
          type: string
          format: uuid
          description: Episodes and movies, always in the library.
        title:
          $ref: '#/components/schemas/TitleSummary'
          description: Episodes and movies only.
        episode:
          $ref: '#/components/schemas/EpisodeRef'
    WebPushKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: {type: string, description: "VAPID public key, base64url: the browser's applicationServerKey."}
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      description: "`PushSubscription.toJSON()` as the browser gives it."
      properties:
        endpoint: {type: string}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string}
            auth: {type: string}
    NotificationSettings:
      type: object
      required: [airing, groupMentions, groupInvites]
      properties:
        airing:
          type: boolean
          description: Push when a new episode of a show you are watching airs.
        groupMentions:
          type: boolean
          description: Push when someone tags you in a group you have not muted. The alert never holds the message.
        groupInvites:
          type: boolean
          description: Push when a friend invites you into a group.
    NotificationSettingsUpdate:
      type: object
      properties:
        airing: {type: boolean}
        groupMentions: {type: boolean}
        groupInvites: {type: boolean}
    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken: {type: string}
        nonce:
          type: string
          description: The nonce sent with the Google sign-in, if any. Must come back in the token.
    Session:
      type: object
      required: [token, userId, expiresAt]
      properties:
        token:
          type: string
          description: "Bearer token, sent in the Authorization header as `Bearer <token>`."
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [userId, providers]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type: string
          description: Absent until the user claims one in PUT /v1/me/profile.
        providers:
          type: array
          items:
            type: string
            enum: [apple, email, google]
    Entitlement:
      type: object
      required: [plus, appAccountToken, capture]
      properties:
        plus:
          type: boolean
          description: Aaru Plus is active.
        productId:
          type: string
          description: The App Store product keeping Plus active.
        expiresAt:
          type: string
          format: date-time
          description: When the current period ends; it renews unless cancelled.
        sandbox:
          type: boolean
          description: Bought in the App Store sandbox (TestFlight).
        appAccountToken:
          type: string
          format: uuid
          description: What the Apple app sets as a purchase's `appAccountToken`.
        capture:
          type: object
          required: [used, resetsAt]
          properties:
            used:
              type: integer
              description: Captures started this UTC month.
            limit:
              type: integer
              description: The month's limit. Absent on Plus.
            resetsAt:
              type: string
              format: date-time
    ProfileUpdate:
      type: object
      required: [handle]
      properties:
        handle: {type: string, description: '3–20 of a–z, 0–9 and _. Stored lowercase.'}
        displayName: {type: string, description: Absent leaves it unchanged; empty clears it.}
    SocialUser:
      type: object
      required: [userId, handle]
      properties:
        userId: {type: string, format: uuid}
        handle: {type: string}
        displayName: {type: string}
    SocialUserView:
      type: object
      required: [user, relationship]
      properties:
        user: {$ref: '#/components/schemas/SocialUser'}
        relationship:
          type: string
          enum: [none, friend, outgoing, incoming, self]
    SocialUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
    SocialSettings:
      type: object
      required: [shareLibraryWithFriends]
      description: >-
        On PUT, a field left out keeps its saved value (older apps send only
        `shareLibraryWithFriends`). Responses always carry every field.
      properties:
        shareLibraryWithFriends:
          type: boolean
          description: Friends see your shelves, activity and what you share. On by default.
        showAchievementsToFriends:
          type: boolean
          description: Friends see your level and badges (never ones about notes or owned items). On by default.
        leaderboardOptIn:
          type: boolean
          description: You join the weekly friends board, and see it. Off by default.
    FriendItem:
      type: object
      required: [title, status, updatedAt]
      description: One title on a friend's shelf. Never their notes.
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        lastSeason: {type: integer, description: Shows. The last episode they ticked.}
        lastEpisode: {type: integer}
        bookPage: {type: integer}
        finishedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    KindCounts:
      type: object
      required: [movie, show, anime, book, album]
      properties:
        movie: {type: integer}
        show: {type: integer}
        anime: {type: integer}
        book: {type: integer}
        album: {type: integer}
    FriendCompare:
      type: object
      required: [bothWant, bothFinished, theyLoved]
      properties:
        bothWant:
          type: array
          description: Titles you both plan to watch or read.
          items: {$ref: '#/components/schemas/TitleSummary'}
        bothFinished: {type: integer}
        theyLoved:
          type: array
          description: Titles they rated 8 or more that you don't have.
          items: {$ref: '#/components/schemas/TitleSummary'}
    FriendProfile:
      type: object
      required: [user, friendsSince, sharing]
      properties:
        user: {$ref: '#/components/schemas/SocialUser'}
        friendsSince: {type: string, format: date-time}
        sharing:
          type: boolean
          description: False when they hide their library; nothing below is sent then.
        counts: {$ref: '#/components/schemas/KindCounts'}
        watching:
          type: array
          items: {$ref: '#/components/schemas/FriendItem'}
        recentlyFinished:
          type: array
          items: {$ref: '#/components/schemas/FriendItem'}
        compare: {$ref: '#/components/schemas/FriendCompare'}
        achievements: {$ref: '#/components/schemas/FriendAchievements'}
    FriendAchievements:
      type: object
      required: [level, badges]
      description: Absent when the friend turned off showing their badges and level.
      properties:
        level: {type: integer}
        badges:
          type: array
          description: Their highest tier of each earned badge, newest first. Never private badges.
          items: {$ref: '#/components/schemas/BadgeAward'}
    BadgeFamily:
      type: string
      enum: [films, shows, anime, books, music, ratings, lists, imports, discovery, streaks, social]
    BadgeOrigin:
      type: string
      enum: [live, batch, backfill]
      description: A live write (toast), an import or approved plan (one summary), or the first run.
    BadgeAward:
      type: object
      required: [id, badge, name, family, tier, maxTier, awardedAt, origin, reveal]
      properties:
        id: {type: string, format: uuid, description: The award; send it to /v1/me/badges/seen.}
        badge: {type: string, description: 'The badge id, such as `films`.'}
        name: {type: string}
        family: {$ref: '#/components/schemas/BadgeFamily'}
        tier: {type: integer, description: 1–4. Bronze, silver, gold, platinum.}
        maxTier: {type: integer}
        awardedAt: {type: string, format: date-time}
        origin: {$ref: '#/components/schemas/BadgeOrigin'}
        reveal:
          type: boolean
          description: A live award of a tiered badge's top tier, or of a hidden badge. Show the full card once.
    BadgeTier:
      type: object
      required: [tier, threshold, description]
      properties:
        tier: {type: integer}
        threshold: {type: integer}
        description: {type: string}
        awardedAt: {type: string, format: date-time}
    Badge:
      type: object
      required: [id, family, hidden, earned, tier, maxTier]
      properties:
        id: {type: string}
        family: {$ref: '#/components/schemas/BadgeFamily'}
        hidden: {type: boolean}
        earned: {type: boolean}
        tier: {type: integer, description: The highest tier earned; 0 for none.}
        maxTier: {type: integer}
        private: {type: boolean, description: Never shown to friends.}
        name: {type: string, description: Absent for a hidden badge not yet earned.}
        description: {type: string, description: What the next tier asks, or the top tier once earned.}
        progress:
          type: object
          required: [current, target]
          description: Toward the next tier. Absent once every tier is earned, and for hidden badges.
          properties:
            current: {type: integer}
            target: {type: integer}
        tiers:
          type: array
          items: {$ref: '#/components/schemas/BadgeTier'}
    BadgeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Badge'}
    StreakDayState:
      type: object
      required: [date, active]

openapi: '3.1.0'
info:
  title: Aaru API
  version: 1.0.0
  description: |
    Aaru's JSON API. Every route lives under `/v1`. Errors share one shape
    (`ErrorResponse`); list routes share one cursor envelope (`PageInfo`).
servers:
  - url: /
    description: Same origin as the request.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database reachability. Unauthenticated.
      security: []
      responses:
        '200':
          description: The server is up and can reach its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server is up but a dependency is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Exchange a Sign in with Apple identity token for a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInRequest'}
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/identities/google:
    post:
      operationId: linkGoogle
      summary: Link a Google account to the signed-in account. Refused if it belongs to another account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInRequest'}
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/link:
    post:
      operationId: requestMagicLink
      summary: Email a one-time sign-in link. Same answer whether or not an account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: The link was sent (or would have been).
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/verify:
    post:
      operationId: verifyMagicLink
      summary: Exchange a magic-link token, or the email and its 6-digit code, for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session:
    delete:
      operationId: signOut
      summary: End the current session.
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in account.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything that belongs to it.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/profile:
    put:
      operationId: updateProfile
      summary: Claim or change your handle, and optionally your display name. Handles are how friends find you.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdate'}
      responses:
        '200':
          description: Your social identity.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUser'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/users/{handle}:
    get:
      operationId: getSocialUser
      summary: The user with exactly this handle and where they stand with you. 404 when nobody holds it or either of you blocked the other.
      parameters:
        - {name: handle, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friend-requests:
    get:
      operationId: listFriendRequests
      summary: Pending requests to you and from you, newest first.
      responses:
        '200':
          description: Both directions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FriendRequests'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: sendFriendRequest
      summary: Ask someone to be friends, by handle. If they already asked you, you become friends. Needs your own handle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FriendRequestCreate'}
      responses:
        '200':
          description: The user and where you now stand (outgoing or friend).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friend-requests/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: withdrawFriendRequest
      summary: Decline a request to you, or cancel one you sent. The other side is not told.
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friend-requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The new friend.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUser'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friends:
    get:
      operationId: listFriends
      summary: Your friends, by handle.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/friends/{userId}:
    delete:
      operationId: removeFriend
      summary: Unfriend. Silent; the other side is not told.
      parameters:
        - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: No longer friends.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/blocks:
    get:
      operationId: listBlocks
      summary: People you blocked.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SocialUserList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/social/blocks/{userId}:
    parameters:
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    put:
      operationId: blockUser
      summary: Block. Ends any friendship and pending requests both ways; from then on each of you is a 404 to the other.
      responses:
        '204':
          description: Blocked.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: unblockUser
      responses:
        '204':
          description: Unblocked. Friendship does not come back.
        default:
          $ref: '#/components/responses/Error'
  /v1/social/reports:
    post:
      operationId: reportUser
      summary: Report a user to Aaru. The user is not told.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReportCreate'}
      responses:
        '204':
          description: Received.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups:
    get:
      operationId: listGroups
      summary: Your groups, in the order you joined them, with unread and mention counts.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createGroup
      summary: Create a group you own, with a #general channel. Needs your handle.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupCreate'}
      responses:
        '200':
          description: The new group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getGroup
      summary: A group you are in, with its channels, members and pending invites. 404 to anyone else.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateGroup
      summary: Rename the group. Owner and admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupCreate'}
      responses:
        '200':
          description: The group.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteGroup
      summary: Delete the group, its channels and every message. Owner only.
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/members/{userId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateGroupMember
      summary: Make a member an admin, or an admin a member. Owner only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GroupMemberUpdate'}
      responses:
        '204':
          description: Changed.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: removeGroupMember
      summary: Remove a member, or yourself to leave. Admins remove members; the owner removes anyone and cannot leave.
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/transfer:
    post:
      operationId: transferGroup
      summary: Make another member the owner. You become an admin.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRef'}
      responses:
        '204':
          description: Transferred.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/invites:
    post:
      operationId: inviteToGroup
      summary: Invite a friend. Inviting again, or someone already in, changes nothing.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserRef'}
      responses:
        '204':
          description: Invited.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/group-invites:
    get:
      operationId: listGroupInvites
      summary: Invites waiting for you, newest first.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupInviteList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/group-invites/{id}:
    delete:
      operationId: declineGroupInvite
      summary: Decline an invite to you, or cancel one you sent.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/group-invites/{id}/accept:
    post:
      operationId: acceptGroupInvite
      summary: Join the group.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The group you joined.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupSummary'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels:
    post:
      operationId: createChannel
      summary: Add a text channel. Owner and admins.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelCreate'}
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateChannel
      summary: Rename a channel or set its topic. Owner and admins.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelUpdate'}
      responses:
        '200':
          description: The channel.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Channel'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteChannel
      summary: Delete a channel and its messages. The first channel stays. Owner and admins.
      responses:
        '204':
          description: Gone.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/messages:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listMessages
      summary: Messages oldest first. Without a cursor, the latest page.
      parameters:
        - name: before
          in: query
          description: Messages older than this one.
          schema: {type: string, format: uuid}
        - name: after
          in: query
          description: Messages newer than this one.
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          description: 1–100, default 50.
          schema: {type: integer}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMessagePage'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: postMessage
      summary: Post a message. A retry with the same clientNonce returns the first message.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageCreate'}
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMessage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/messages/{messageId}:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: messageId, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: editMessage
      summary: Edit your own message.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MessageUpdate'}
      responses:
        '200':
          description: The message.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupMessage'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteMessage
      summary: Delete your message, or any message as owner or admin. The row stays, empty.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/read:
    post:
      operationId: markChannelRead
      summary: Mark the channel read up to a message. The read point never moves back.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReadMark'}
      responses:
        '204':
          description: Marked.
        default:
          $ref: '#/components/responses/Error'
  /v1/realtime/ticket:
    post:
      operationId: createRealtimeTicket
      summary: >-
        A single-use ticket, valid 60 seconds, for opening the realtime socket from a browser,
        which cannot send an Authorization header on a WebSocket. Apps send their bearer token on
        the upgrade instead.
      responses:
        '200':
          description: The ticket and the socket URL to open with it.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeTicket'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/me:
    put:
      operationId: updateMyMembership
      summary: >-
        Your own settings in a group. shareProgress shows your progress in its title channels; muted stops its mention
        alerts. Both are off by default.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MembershipUpdate'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GroupSummary'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/progress:
    get:
      operationId: getChannelProgress
      summary: A title channel's title, your progress, and the progress of members who share theirs in this group.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelProgress'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/items:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listChannelItems
      summary: A shelf channel's titles, with your own library status for each.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelItemList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addChannelItem
      summary: Add a title to a shelf channel. Any member can; adding one already there changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChannelItemCreate'}
      responses:
        '200':
          description: The shelf.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChannelItemList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/items/{titleId}:
    delete:
      operationId: removeChannelItem
      summary: Take a title off a shelf channel. Any member can.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: titleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party:
    parameters:
      - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getWatchParty
      summary: A watch channel's newest party, ended or not, and the server's clock for the countdown.
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: openWatchParty
      summary: Open a party in the lobby. A show needs the episode. One open party per channel (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPartyCreate'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/ready:
    post:
      operationId: setWatchPartyReady
      summary: Say you are ready, or not.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPartyReady'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/start:
    post:
      operationId: startWatchParty
      summary: Start the countdown. The host or an admin.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WatchPartyStart'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/end:
    post:
      operationId: endWatchParty
      summary: End the party. The host or an admin.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WatchPartyView'}
        default:
          $ref: '#/components/responses/Error'
  /v1/groups/{groupId}/channels/{channelId}/party/watched:
    post:
      operationId: markWatchPartyWatched
      summary: Mark the party's episode, film or book watched in your own library. Nobody else's.
      parameters:
        - {name: groupId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: channelId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Marked.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices:
    put:
      operationId: registerDevice
      summary: Register this device for pushes. A token registered again moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegistration'}
      responses:
        '204':
          description: Registered.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices/{token}:
    delete:
      operationId: unregisterDevice
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Forgotten.
        default:
          $ref: '#/components/responses/Error'
  /v1/web-push/key:
    get:
      operationId: getWebPushKey
      summary: The VAPID public key a browser subscribes with. 503 `push_unavailable` when web push is off.
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebPushKey'}
        default:
          $ref: '#/components/responses/Error'
  /v1/web-push/subscriptions:
    put:
      operationId: saveWebPushSubscription
      summary: Save this browser's push subscription. Saved again, it moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebPushSubscription'}
      responses:
        '204':
          description: Saved.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWebPushSubscription
      parameters:
        - {name: endpoint, in: query, required: true, schema: {type: string}}
      responses:
        '204':
          description: Forgotten.
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/tokens:
    get:
      operationId: listAgentTokens
      summary: The user's live agent tokens (OUT-001), newest first. Secrets are never returned.
      parameters:
        - name: for
          in: query
          description: >-
            Which surface's tokens: the Stremio addon, MCP clients, the browser extension
            (`scrobble`), or music scrobblers (`music`). Defaults to `stremio`, so Apple builds
            that only know the Stremio kind never see another kind.
          schema: {type: string, enum: [stremio, mcp, scrobble, music], default: stremio}
      responses:
        '200':
          description: Live tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AgentToken'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAgentToken
      summary: >-
        Mint a token for an outside caller. A Stremio token's answer carries the addon's install
        links; an MCP client's carries its setup, with the secret filled in. The secret is shown
        once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentTokenCreate'}
      responses:
        '201':
          description: Minted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTokenCreated'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans:
    get:
      operationId: listPlans
      summary: >-
        Changes outside agents asked for that wait for the user (OUT-004), newest first. Only a
        signed-in session reaches the plan routes; an agent token never does.
      parameters:
        - name: status
          in: query
          description: '`pending` (default) leaves out decided and expired plans.'
          schema: {type: string, enum: [pending, all], default: pending}
      responses:
        '200':
          description: Plans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}:
    get:
      operationId: getPlan
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}/approve:
    post:
      operationId: approvePlan
      summary: >-
        Apply the plan as one undoable action named after its agent. 409 `plan_stale` when the
        library changed since it was made (nothing is written), `plan_expired`, or `plan_decided`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [plan, action]
                properties:
                  plan: {$ref: '#/components/schemas/AgentPlan'}
                  action: {$ref: '#/components/schemas/Action'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}/deny:
    post:
      operationId: denyPlan
      summary: Refuse the plan. Nothing is written; the plan stays as the record of what was asked.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/oauth/requests/{id}:
    get:
      operationId: getOAuthRequest
      summary: >-
        A connection an app asked for over OAuth (Claude's custom connector), for the consent
        page. Expires ten minutes after the app asked.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthConsentRequest'}
        default:
          $ref: '#/components/responses/Error'
  /v1/oauth/requests/{id}/approve:
    post:
      operationId: approveOAuthRequest
      summary: >-
        Allow the app. Only the browser that started the request holds its binding (the
        `aaru_oauth` cookie the API set); the answer is where to send the browser next.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding]
              properties:
                binding: {type: string}
                name: {type: string, maxLength: 80}
                allowLibraryWrites: {type: boolean}
      responses:
        '200':
          description: Send the browser here.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthRedirect'}
        default:
          $ref: '#/components/responses/Error'
  /v1/oauth/requests/{id}/deny:
    post:
      operationId: denyOAuthRequest
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [binding]
              properties:
                binding: {type: string}
      responses:
        '200':
          description: Send the browser here.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthRedirect'}
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/setup/{kind}:
    get:
      operationId: getAgentSetup
      summary: >-
        How to connect one MCP client (OUT-004), with a placeholder where the secret goes, so
        Settings can show the steps before a token exists.
      parameters:
        - name: kind
          in: path
          required: true
          schema: {$ref: '#/components/schemas/AgentMCPKind'}
      responses:
        '200':
          description: The client's setup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSetup'}
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/tokens/{id}:
    delete:
      operationId: revokeAgentToken
      summary: Revoke a token. Its addon stops answering at once.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/notifications:
    get:
      operationId: getNotificationSettings
      responses:
        '200':
          description: The user's notification choices.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationSettings
      summary: Changes the switches sent; any left out keep their value.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSettingsUpdate'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/stats:
    get:
      operationId: getStats
      summary: >-
        What the user watched and read in one calendar year or month of their time zone (GAM-006a),
        in all time (GAM-006c), or in the last 7 or 30 days (GAM-006d). Derived only from their own
        library. Imported history counts only where it carries a real date.
      parameters:
        - name: year
          in: query
          description: Required unless `span` is sent.
          schema: {type: integer}
        - name: span
          in: query
          description: >-
            `all` is all time: every year from the first active one through the current year,
            one bucket per year, so its totals equal the years' summed. `last7` and `last30` are
            the 7 or 30 days ending today, one bucket per day, with `prior` holding the window
            just before. A span takes no `year` or `month` (422 otherwise).
          schema:
            type: string
            enum: [all, last7, last30]
        - name: month
          in: query
          description: 1–12. Absent means the whole year.
          schema: {type: integer}
        - name: tz
          in: query
          description: IANA time zone for day and month boundaries. Absent means UTC.
          schema: {type: string}
      responses:
        '200':
          description: The period's stats.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stats'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/listens:
    get:
      operationId: listListens
      summary: >-
        Your listening log, newest first (MUS-005): what music scrobblers sent with your music
        token over ListenBrainz's protocol at `/listenbrainz/1/submit-listens`.
      parameters:
        - name: before
          in: query
          description: Only listens that started before this time; the previous page's `next`.
          schema: {type: string, format: date-time}
        - name: limit
          in: query
          description: 1–100, default 20.
          schema: {type: integer}
      responses:
        '200':
          description: A page of listens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListenPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/listens/top:
    get:
      operationId: getTopListens
      summary: >-
        Your most played artists, tracks or albums over a period (MUS-005). The period is chosen
        as for `/v1/me/stats`: a year, a month of it, or a span.
      parameters:
        - name: by
          in: query
          required: true
          schema: {type: string, enum: [artist, track, album]}
        - name: year
          in: query
          description: Required unless `span` is sent.
          schema: {type: integer}
        - name: span
          in: query
          schema: {type: string, enum: [all, last7, last30]}
        - name: month
          in: query
          description: 1–12. Absent means the whole year.
          schema: {type: integer}
        - name: tz
          in: query
          description: IANA time zone for day and month boundaries. Absent means UTC.
          schema: {type: string}
        - name: limit
          in: query
          description: 1–50, default 10.
          schema: {type: integer}
      responses:
        '200':
          description: The period's top list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListenTop'}
        default:
          $ref: '#/components/responses/Error'
  /v1/search:
    get:
      operationId: searchCatalog
      summary: Search the catalog. Results are catalog projections, never library rows.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: >-
            `all` searches films, shows and anime together (TMDB and AniList in parallel, merged;
            books and albums are never included); `anime` searches AniList; `movie`/`show` TMDB;
            `book` Open Library; `album` MusicBrainz (albums and EPs, MUS-001).
          schema:
            type: string
            enum: [all, movie, show, anime, book, album]
      responses:
        '200':
          description: >-
            Matches, best first. With `all`, exact title matches lead, then TMDB and AniList hits
            alternate, at most 40; a TMDB show is left out only when an AniList hit in the same
            results is mapped to it, and that hit then carries `ids.tmdb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        default:
          $ref: '#/components/responses/Error'
  /v1/discover:
    get:
      operationId: getDiscover
      summary: Provider-curated public rows for Home (trending, airing, this season).
      description: >-
        The same lists for every user, cached by the server. Items the caller already has
        carry `libraryItemId`. A row whose provider is down is left out.
      responses:
        '200':
          description: Rows in display order. Empty rows are left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverRows'
        default:
          $ref: '#/components/responses/Error'
  /v1/discover/season:
    get:
      operationId: getDiscoverSeason
      summary: One season's titles for the Seasons view (DISC-002), a page at a time.
      description: >-
        A season is a calendar quarter in UTC: winter Jan–Mar, spring Apr–Jun, summer Jul–Sep,
        fall Oct–Dec. Anime by AniList's broadcast season, new shows by first air date,
        returning shows by an episode airing that season, films by first release. The same
        lists for every user, cached by the server; items the caller has carry `libraryItemId`.
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum: [anime, shows_new, shows_returning, movies]
        - name: season
          in: query
          required: true
          schema:
            type: string
            enum: [winter, spring, summer, fall]
        - name: year
          in: query
          required: true
          description: 1970 to next year; anything else is 422 `validation_failed`.
          schema: {type: integer}
        - name: page
          in: query
          required: false
          description: 1-based, at most 20.
          schema: {type: integer, default: 1}
      responses:
        '200':
          description: The page. `unavailable` when the provider is down and nothing is cached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonPage'
        default:
          $ref: '#/components/responses/Error'
  /v1/concerts/near:
    post:
      operationId: getConcertsNear
      summary: Music events around a point or the saved "Concerts near" city (MUS-003), soonest first.
      description: >-
        POST so a position never sits in a URL. Coordinates are rounded to two decimals (about a
        kilometre) and used for this request only: never stored, never logged. With no coordinates
        the saved city is the centre; with neither, 409 `no_place`. The same list for everyone in
        the same area, cached by the server and linked out to Ticketmaster for tickets.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConcertsNearRequest'}
      responses:
        '200':
          description: The page. `unavailable` when concerts are off or the provider is down.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/concerts/artists:
    get:
      operationId: getArtistConcerts
      summary: Upcoming concerts by the artists of the user's albums (MUS-003).
      description: >-
        Derived from the user's own library, like the calendar; dropped albums aside. An artist
        counts only when Ticketmaster lists them with the same MusicBrainz id. Artists added in
        the last hour may still be `pending`.
      responses:
        '200':
          description: The concerts.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtistConcerts'}
        default:
          $ref: '#/components/responses/Error'
  /v1/concerts/places:
    get:
      operationId: searchConcertPlaces
      summary: Cities matching what the user typed, for the "Concerts near" picker (MUS-003).
      parameters:
        - name: q
          in: query
          required: true
          description: 2 to 100 characters. Not logged.
          schema: {type: string}
      responses:
        '200':
          description: Up to eight places, best first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPlaceList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/concert-place:
    get:
      operationId: getConcertPlace
      summary: The saved "Concerts near" city, and whether concerts are on at all.
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPlaceSetting'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: saveConcertPlace
      summary: Saves the "Concerts near" city, rounded to two decimals.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConcertPlace'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConcertPlaceSetting'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteConcertPlace
      summary: Forgets the "Concerts near" city.
      responses:
        '204':
          description: Removed, or there was none.
        default:
          $ref: '#/components/responses/Error'
  /v1/titles/{id}:
    get:
      operationId: getTitle
      summary: A title from the catalog. Shows include their seasons and episodes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetail'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items:
    get:
      operationId: listLibraryItems
      summary: The user's library, most recently updated first. Shelves use the same filters.
      parameters:
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/MediaType'}}
        - {name: anime, in: query, required: false, schema: {type: boolean}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/LibraryStatus'}}
        - {name: owned, in: query, required: false, schema: {type: boolean}}
        - {name: list, in: query, required: false, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addLibraryItem
      summary: Add a title to the library. Adding the same title again returns the existing item.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddLibraryItem'}
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getLibraryItem
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLibraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryItemPatch'}
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLibraryItem
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/episodes/{season}/{episode}:
    put:
      operationId: setEpisodeWatched
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season, in: path, required: true, schema: {type: integer}}
        - {name: episode, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodeWatched'}
      responses:
        '200':
          description: The item with updated progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/seasons/{season}/watched:
    post:
      operationId: markSeasonWatched
      summary: Mark every aired episode of a season watched, as one undoable action.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The item with updated progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/sync:
    get:
      operationId: syncLibrary
      summary: Items changed and ids deleted since a previous sync token (all items when absent).
      parameters:
        - {name: since, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The changes and the token for next time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibrarySync'}
        default:
          $ref: '#/components/responses/Error'
  /v1/actions:
    get:
      operationId: listActions
      summary: The action journal, newest first. Backs the undo ribbon.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Actions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/undo:
    post:
      operationId: undoAction
      summary: Apply an action's inverse. Journaled as its own action; undoing twice is 409.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The undo, as an action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists:
    get:
      operationId: listLists
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateList'}
      responses:
        '200':
          description: The new list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getList
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameList
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameList'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteList
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/items:
    post:
      operationId: addListItem
      summary: Add a title to a list. It need not be in the library.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddListItem'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/items/{titleId}:
    delete:
      operationId: removeListItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: titleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/order:
    put:
      operationId: reorderList
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListOrder'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports:
    get:
      operationId: listImports
      summary: The user's imports, newest first.
      responses:
        '200':
          description: Up to 50 imports.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/export:
    get:
      operationId: exportAccount
      summary: Everything Aaru holds for the caller, to keep or move elsewhere (GDPR portability).
      description: >-
        `json` (default) is complete: account, every library item with ratings, notes and every
        watched episode, lists and shelves. `csv` is one row per library item in the column layout
        Aaru's own "Any site" import reads, so it can be re-imported here or opened in a spreadsheet.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: The export, as a download.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountExport'}
            text/csv:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/csv:
    post:
      operationId: createCSVImport
      summary: Upload an export file. It is parsed now, matched in the background, and written only after approval.
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [auto, imdb, letterboxd, netflix, goodreads, mal, csv]
          description: >-
            `auto` detects the format: MyAnimeList-format XML (also exported by Kitsu and AniList),
            an IMDb, Letterboxd, Netflix viewing activity or Goodreads CSV, or any other CSV read by
            its column names (`csv`).
        - name: filename
          in: query
          required: false
          description: The file's name. Letterboxd's watchlist export is told apart by it.
          schema: {type: string}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          # MyAnimeList's list export, decompressed (source=mal).
          application/xml:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/cat:
    post:
      operationId: createCATImport
      summary: >-
        Import shows from Pogdesign CAT: a pasted list (one show per line, `Name` or `Name (2026)`) or the
        exported iCal file. Parsed now, matched in the background, written only after approval. Every show
        is planned as wishlist; CAT's watched episodes do not come across.
      requestBody:
        required: true
        content:
          text/plain:
            schema: {type: string, format: binary}
          text/calendar:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/cat/feed:
    post:
      operationId: createCATFeedImport
      summary: >-
        Import shows from the user's CAT iCal link (https://www.pogdesign.co.uk/cat/download_ics/… or
        generate_ics/…). The calendar is read once, now; the link holds the user's CAT key and is not kept.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: {type: string, maxLength: 512, description: The iCal link from CAT.}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/anilist:
    post:
      operationId: createAniListImport
      summary: Import a public AniList anime list by username. Read and matched in the background, written only after approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, description: "AniList username: 2–20 letters, digits or underscores."}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/stremio/link:
    post:
      operationId: startStremioLink
      summary: >-
        Start a Stremio history import. Show the user `link` (or `qrcode`) to approve on stremio.com, then
        poll POST /v1/imports/stremio/link/{code}. No password reaches Aaru; the session the code opens is
        used for one library read, then logged out.
      responses:
        '200':
          description: A code to approve.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StremioLink'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/stremio/link/{code}:
    post:
      operationId: pollStremioLink
      summary: >-
        Ask whether the code was approved. 204 while pending (ask again in a few seconds); 202 with the queued
        import once approved; 410 `stremio_link_expired` when the code ran out.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '202':
          description: Approved. The library was read and its import queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '204':
          description: Not approved yet.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt:
    post:
      operationId: createTraktImport
      summary: Import the connected Trakt account. Read and matched in the background, written only after approval.
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt/connect:
    post:
      operationId: connectTrakt
      summary: >-
        Start connecting Trakt (PKCE). Open the returned address in a browser. Trakt then redirects to
        GET /v1/imports/trakt/callback (a plain redirect route outside this spec: its Location must not be
        percent-encoded), which sends the browser on to `returnTo` with `trakt=connected|denied|failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TraktConnectRequest'}
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraktConnectStart'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt/connection:
    get:
      operationId: getTraktConnection
      responses:
        '200':
          description: Whether Trakt is connected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraktConnection'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectTrakt
      summary: Revoke the Trakt tokens on Trakt, then forget them. Imported items stay.
      responses:
        '204':
          description: Disconnected.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getImport
      summary: One import with every row and what its plan does with it.
      responses:
        '200':
          description: The import.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteImport
      summary: Discard an import. Library items it already created stay; undo the import action for those.
      responses:
        '204':
          description: Discarded.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}/apply:
    post:
      operationId: applyImport
      summary: Approve the plan. Writes it as one undoable action.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves:
    get:
      operationId: listShelves
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShelfList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShelf
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShelf'}
      responses:
        '200':
          description: The new shelf.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shelf'}
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateShelf
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateShelf'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shelf'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShelf
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves/{id}/items:
    get:
      operationId: listShelfItems
      summary: The shelf's query, resolved now. Same DTO as GET /v1/library/items.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/calendar:
    get:
      operationId: getCalendar
      summary: Episodes of tracked shows airing in [from, to), at most 42 days (a month grid). Times are UTC.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Episodes, by air time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        default:
          $ref: '#/components/responses/Error'
  /v1/up-next:
    get:
      operationId: getUpNext
      summary: >-
        Continue Watching, Start Watching, status counts and Unfinished business for the home
        screen, in one call.
      responses:
        '200':
          description: The home rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpNext'}
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `page.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    AgentToken:
      type: object
      required: [id, name, kind, scopes, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        scopes:
          type: array
          items: {type: string, enum: ['library:read', 'library:write', 'scrobble:write', 'imports:write']}
        createdAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: Recorded at most once an hour.
    AgentTokenCreate:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        name: {type: string, maxLength: 80}
        allowLibraryWrites:
          type: boolean
          description: >-
            Adds `library:write`. For Stremio, its "unwatched" and "add to library" reach Aaru;
            removing from Stremio's library never deletes anything in Aaru. For an MCP client, it
            may change one item directly, as a tap does; anything larger waits for approval in
            Aaru. Off by default.
        allowImports:
          type: boolean
          description: >-
            MCP clients only: adds `imports:write`, so the agent may hand Aaru a list to import.
            The import is reviewed and approved in Aaru like any other. Off by default.
        scrobbler:
          $ref: '#/components/schemas/MusicScrobbler'
          description: >-
            Music tokens only: which scrobbler this token is for. It names the token and picks
            the setup steps in `music`. `other` when left out.
    AgentPlan:
      type: object
      required: [id, status, agentName, summary, changes, counts, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, applied, denied, stale, expired]}
        agentName:
          type: string
          description: The connection that asked, as the user named it.
        summary: {type: string}
        changes:
          type: array
          items:
            type: object
            required: [text, titleId, title, type]
            properties:
              text: {type: string}
              titleId: {type: string, format: uuid}
              title: {type: string}
              type: {$ref: '#/components/schemas/MediaType'}
              posterUrl: {type: string}
              libraryItemId:
                type: string
                description: Absent when the change adds the title.
        counts:
          type: object
          required: [adds, updates, removes, episodes]
          properties:
            adds: {type: integer}
            updates: {type: integer}
            removes: {type: integer}
            episodes: {type: integer}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
        actionId:
          type: string
          description: The journaled action, once applied; undo it like any other.
    OAuthConsentRequest:
      type: object
      required: [id, clientName, redirectHost, kind, expiresAt]
      properties:
        id: {type: string, format: uuid}
        clientName:
          type: string
          description: The name the app registered with. Apps name themselves; show the host too.
        redirectHost:
          type: string
          description: Where the app returns the user. This part an impostor cannot fake.
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        expiresAt: {type: string, format: date-time}
    OAuthRedirect:
      type: object
      required: [redirectTo]
      properties:
        redirectTo: {type: string}
    AgentTokenKind:
      type: string
      description: >-
        Which outside caller a token is for. The MCP kinds differ only in the setup shown; they
        reach the same tools. `browser` is Aaru's browser extension and `music` a music
        scrobbler speaking ListenBrainz's protocol (MUS-005); both can only scrobble.
      enum: [stremio, claude_code, codex, hermes, gemini, other, claude, browser, music]
    AgentMCPKind:
      type: string
      enum: [claude, claude_code, codex, hermes, gemini, other]
    MusicScrobbler:
      type: string
      enum: [web_scrobbler, pano_scrobbler, navidrome, jellyfin, other]
    MusicSetup:
      type: object
      description: >-
        How to point one scrobbler at Aaru (MUS-007): numbered steps, some with a link to
        open and values to copy. The token appears in full only here, right after minting.
      required: [scrobbler, title, submitUrl, baseUrl, steps]
      properties:
        scrobbler: {$ref: '#/components/schemas/MusicScrobbler'}
        title: {type: string}
        submitUrl:
          type: string
          description: The full `submit-listens` URL, for clients that ask for it.
        baseUrl:
          type: string
          description: The ListenBrainz-style root, for clients that add `1/submit-listens` themselves.
        steps:
          type: array
          items:
            type: object
            required: [text]
            properties:
              text: {type: string}
              link:
                type: object
                required: [label, url]
                properties:
                  label: {type: string}
                  url: {type: string}
              fields:
                type: array
                description: Values to copy, each with the label the scrobbler shows next to its field.
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: {type: string}
                    value: {type: string}
                    secret:
                      type: boolean
                      description: The token. Clients mask it until copied.
    AgentSetup:
      type: object
      description: >-
        How to connect one MCP client: the endpoint, then steps to copy. Before a token exists
        the secret reads `PASTE_YOUR_TOKEN_HERE`.
      required: [kind, title, url, auth, steps, prompt]
      properties:
        kind: {$ref: '#/components/schemas/AgentMCPKind'}
        title: {type: string}
        auth:
          type: string
          enum: [token, oauth]
          description: >-
            `token`: create a token in Aaru and paste it. `oauth`: add Aaru in the client, which
            sends the user to Aaru to approve; no token to copy.
        url:
          type: string
          description: The MCP endpoint (streamable HTTP).
        steps:
          type: array
          items:
            type: object
            required: [label, language, text]
            properties:
              label: {type: string}
              language: {type: string, enum: [bash, json, toml, yaml, text]}
              text: {type: string}
              note: {type: string}
        prompt:
          type: string
          description: A message to paste into the agent once it is connected.
    AgentTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: '#/components/schemas/AgentToken'}
        secret:
          type: string
          description: Shown once. Anyone holding it, or the install links, can use the token.
        stremio:
          type: object
          description: Only for a Stremio token.
          required: [manifestUrl, installUrl, webInstallUrl]
          properties:
            manifestUrl: {type: string}
            installUrl:
              type: string
              description: The `stremio://` link that opens the Stremio app.
            webInstallUrl: {type: string}
        setup: {$ref: '#/components/schemas/AgentSetup'}
        music: {$ref: '#/components/schemas/MusicSetup'}
    ErrorResponse:
      type: object
      description: The one error shape every route returns.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`, `validation_failed`.
        message:
          type: string
          description: Human-readable explanation. Never contains internal detail.
        details:
          type: object
          description: Optional per-field detail, keyed by request field name (e.g. `rating`).
          additionalProperties:
            type: string
    PageInfo:
      type: object
      description: |
        Cursor pagination envelope. List routes return `{ items: [...], page: PageInfo }`.
        Cursors are keyed on `(updated_at, id)`; a null `nextCursor` means the last page.
      properties:
        nextCursor:
          type: [string, 'null']
    AppleSignInRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The JWT from ASAuthorizationAppleIDCredential / Sign in with Apple JS.
        nonce:
          type: string
          description: The raw nonce whose SHA-256 the client sent to Apple.
        displayName:
          type: string
          description: Apple sends the name only on the first authorization; pass it then.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    MagicLinkVerifyRequest:
      type: object
      description: Either `token` (from the link) or `email` and `code` (from the same email).
      properties:
        token:
          type: string
        email:
          type: string
        code:
          type: string
          description: Six digits; spaces and dashes are ignored.
    TraktConnectRequest:
      type: object
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: Where the browser goes after Trakt (the app's `aaru://` scheme or the web app). Must be allowed by the server.
    TraktConnectStart:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl: {type: string}
    TraktConnection:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
        username: {type: string}
        connectedAt: {type: string, format: date-time}
    StremioLink:
      type: object
      required: [code, link, qrcode, expiresAt]
      properties:
        code: {type: string}
        link: {type: string, format: uri, description: "The stremio.com page where the user approves the code."}
        qrcode: {type: string, format: uri, description: "A QR image of `link`, for scanning with a phone."}
        expiresAt: {type: string, format: date-time}
    ImportJob:
      type: object
      required: [id, source, state, stats, createdAt, updatedAt, rowsTotal, rowsMatched]
      properties:
        id: {type: string, format: uuid}
        source:
          type: string
          enum: [trakt, stremio, imdb_csv, letterboxd_csv, goodreads_csv, cat_list, cat_ics, netflix_csv, mal_xml, anilist, csv]
        state:
          type: string
          enum: [queued, running, planned, succeeded, failed, partial]
          description: "`planned` waits for approval; nothing is written before it."
        stats: {$ref: '#/components/schemas/ImportStats'}
        errorSummary: {type: string}
        filename:
          type: string
          description: The uploaded file's name, or the AniList username for an `anilist` import.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        rowsTotal:
          type: integer
          description: >-
            Rows read from the file or provider. 0 for a Trakt or AniList import until the worker
            has read the account.
        rowsMatched:
          type: integer
          description: >-
            Rows matched so far while `running` (IMP-017); back to 0 when a failed attempt is
            retried. With `rowsTotal` it is the import's progress.
    ImportStats:
      type: object
      required: [created, updated, skipped, unmatched]
      properties:
        created: {type: integer}
        updated: {type: integer}
        skipped: {type: integer}
        unmatched: {type: integer}
    ImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ImportJob'}
    ImportRow:
      type: object
      required: [index, title, type, outcome]
      properties:
        index: {type: integer}
        title: {type: string}
        year: {type: integer}
        author: {type: string}
        type: {$ref: '#/components/schemas/MediaType'}
        sourceKey: {type: string}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        outcome:
          type: string
          enum: [pending, create, update, skip, unmatched]
        reason: {type: string}
        titleId: {type: string, format: uuid}
    ImportDetail:
      type: object
      required: [job, rows]
      properties:
        job: {$ref: '#/components/schemas/ImportJob'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/ImportRow'}
    DeviceRegistration:
      type: object
      required: [token, environment, bundleId]
      properties:
        token: {type: string, description: The APNs device token, hex.}
        environment:
          type: string
          enum: [sandbox, production]
          description: "`sandbox` for Xcode builds; `production` for TestFlight and the App Store."
        bundleId: {type: string}
    WebPushKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: {type: string, description: "VAPID public key, base64url: the browser's applicationServerKey."}
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      description: "`PushSubscription.toJSON()` as the browser gives it."
      properties:
        endpoint: {type: string}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string}
            auth: {type: string}
    NotificationSettings:
      type: object
      required: [airing, groupMentions, groupInvites]
      properties:
        airing:
          type: boolean
          description: Push when a new episode of a show you are watching airs.
        groupMentions:
          type: boolean
          description: Push when someone tags you in a group you have not muted. The alert never holds the message.
        groupInvites:
          type: boolean
          description: Push when a friend invites you into a group.
    NotificationSettingsUpdate:
      type: object
      properties:
        airing: {type: boolean}
        groupMentions: {type: boolean}
        groupInvites: {type: boolean}
    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken: {type: string}
        nonce:
          type: string
          description: The nonce sent with the Google sign-in, if any. Must come back in the token.
    Session:
      type: object
      required: [token, userId, expiresAt]
      properties:
        token:
          type: string
          description: "Bearer token, sent in the Authorization header as `Bearer <token>`."
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [userId, providers]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        handle:
          type: string
          description: Absent until the user claims one in PUT /v1/me/profile.
        providers:
          type: array
          items:
            type: string
            enum: [apple, email, google]
    ProfileUpdate:
      type: object
      required: [handle]
      properties:
        handle: {type: string, description: '3–20 of a–z, 0–9 and _. Stored lowercase.'}
        displayName: {type: string, description: Absent leaves it unchanged; empty clears it.}
    SocialUser:
      type: object
      required: [userId, handle]
      properties:
        userId: {type: string, format: uuid}
        handle: {type: string}
        displayName: {type: string}
    SocialUserView:
      type: object
      required: [user, relationship]
      properties:
        user: {$ref: '#/components/schemas/SocialUser'}
        relationship:
          type: string
          enum: [none, friend, outgoing, incoming, self]
    SocialUserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
    FriendRequest:
      type: object
      required: [id, user, createdAt]
      properties:
        id: {type: string, format: uuid}
        user: {$ref: '#/components/schemas/SocialUser', description: The other person.}
        createdAt: {type: string, format: date-time}
    FriendRequests:
      type: object
      required: [incoming, outgoing]
      properties:
        incoming:
          type: array
          items: {$ref: '#/components/schemas/FriendRequest'}
        outgoing:
          type: array
          items: {$ref: '#/components/schemas/FriendRequest'}
    FriendRequestCreate:
      type: object
      required: [handle]
      properties:
        handle: {type: string}
    ReportCreate:
      type: object
      required: [userId, reason]
      properties:
        userId: {type: string, format: uuid}
        reason:
          type: string
          enum: [spam, harassment, impersonation, other]
        note: {type: string, maxLength: 1000}
    GroupRole:
      type: string
      enum: [owner, admin, member]
    GroupSummary:
      type: object
      required: [id, name, role, defaultChannelId, unread, mentions, shareProgress, muted]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        role: {$ref: '#/components/schemas/GroupRole'}
        defaultChannelId: {type: string, format: uuid}
        unread: {type: integer, description: Messages from others since you last read, across channels.}
        mentions: {type: integer, description: Unread messages that tag you.}
        shareProgress: {type: boolean, description: You show your progress in this group's title channels.}
        muted: {type: boolean, description: "Mentions in this group send you no alerts."}
    GroupList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupSummary'}
    GroupMember:
      type: object
      required: [user, role, joinedAt, shareProgress]
      properties:
        user: {$ref: '#/components/schemas/SocialUser'}
        role: {$ref: '#/components/schemas/GroupRole'}
        joinedAt: {type: string, format: date-time}
        shareProgress: {type: boolean}
    Channel:
      type: object
      required: [id, kind, name, position, isDefault, unread, mentions]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ChannelKind'}
        title: {$ref: '#/components/schemas/TitleSummary', description: What a title channel is about.}
        name: {type: string, description: 'Lowercase, dashes for spaces: movie-night.'}
        topic: {type: string}
        position: {type: integer}
        isDefault: {type: boolean, description: 'The #general every group starts with. Cannot be deleted.'}
        unread: {type: integer}
        mentions: {type: integer}
    GroupDetail:
      type: object
      required: [group, channels, members, invited, agent]
      properties:
        group: {$ref: '#/components/schemas/GroupSummary'}
        channels:
          type: array
          items: {$ref: '#/components/schemas/Channel'}
        members:
          type: array
          items: {$ref: '#/components/schemas/GroupMember'}
        invited:
          type: array
          description: Friends invited who have not answered yet.
          items: {$ref: '#/components/schemas/SocialUser'}
        agent: {type: boolean, description: '@aaru answers in this group. When false, hide it from mentions.'}
    GroupCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 50}
    GroupMemberUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]
    UserRef:
      type: object
      required: [userId]
      properties:
        userId: {type: string, format: uuid}
    GroupInvite:
      type: object
      required: [id, groupId, groupName, inviter, createdAt]
      properties:
        id: {type: string, format: uuid}
        groupId: {type: string, format: uuid}
        groupName: {type: string}
        inviter: {$ref: '#/components/schemas/SocialUser'}
        createdAt: {type: string, format: date-time}
    GroupInviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupInvite'}
    ChannelKind:
      type: string
      description: 'text: chat. title: one title, with the spoiler guard. watch: watch parties. shelf: a shared list.'
      enum: [text, title, watch, shelf]
    ChannelCreate:
      type: object
      properties:
        kind: {$ref: '#/components/schemas/ChannelKind'}
        name: {type: string, description: "Required, except a title channel takes its title's name."}
        topic: {type: string, maxLength: 200}
        title: {$ref: '#/components/schemas/MediaRef', description: Required for a title channel.}
    ChannelUpdate:
      type: object
      properties:
        name: {type: string, description: Absent leaves it unchanged.}
        topic: {type: string, description: Absent leaves it unchanged; empty clears it.}
    GroupMessage:
      type: object
      required: [id, channelId, body, mentions, mentionsAgent, fromBlocked, deleted, createdAt, veiled, fromAgent]
      properties:
        id: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/SocialUser', description: Absent once the author deleted their account.}
        body: {type: string, description: Empty when deleted.}
        mentions:
          type: array
          description: Members the message tags.
          items: {type: string, format: uuid}
        mentionsAgent: {type: boolean, description: The message tags @aaru.}
        fromBlocked: {type: boolean, description: You blocked the author. Show it collapsed.}
        deleted: {type: boolean}
        createdAt: {type: string, format: date-time}
        editedAt: {type: string, format: date-time}
        clientNonce: {type: string, description: 'Only on your own messages: the clientNonce you posted with, to match a pending send to its echo.'}
        spoiler: {$ref: '#/components/schemas/SpoilerStamp', description: 'Only on your own messages: it says where you are in the title.'}
        veiled: {type: boolean, description: "It may spoil what you have not watched yet: show it veiled until you tap."}
        fromAgent: {type: boolean, description: Written by @aaru. It has no author.}
        replyTo: {type: string, format: uuid, description: The mention an @aaru reply answers.}
        components:
          type: array
          description: 'Cards on an @aaru reply. Catalog titles only; their buttons are the viewer''s own taps.'
          items: {$ref: '#/components/schemas/MessageComponent'}
    MessageComponent:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [title]
        title: {$ref: '#/components/schemas/TitleSummary'}
    GroupMessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupMessage'}
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
        clientNonce: {type: string, maxLength: 64, description: Makes a retry safe.}
        spoiler: {$ref: '#/components/schemas/SpoilerStamp', description: "Title channels: stamp by hand. Absent: stamped from your progress."}
        spoilerFree: {type: boolean, description: 'Title channels: no stamp at all.'}
    MessageUpdate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
    ReadMark:
      type: object
      required: [messageId]
      properties:
        messageId: {type: string, format: uuid}
    RealtimeTicket:
      type: object
      required: [ticket, url, expiresAt]
      properties:
        ticket: {type: string}
        url: {type: string, description: 'The wss:// URL to open, ticket included.'}
        expiresAt: {type: string, format: date-time}
    RealtimeEvent:
      type: object
      description: >-
        One frame from GET /v1/ws (a WebSocket). The socket is never the source of truth: on
        `ready` (every connect and reconnect), refetch what is on screen with REST.
      required: [type]
      properties:
        type:
          type: string
          enum: [ready, message.created, message.updated, message.deleted, typing, read, group.updated, group.removed, invites.changed, shelf.updated, watch.updated, watch.reaction, agent.thinking]
        groupId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        messageId: {type: string, format: uuid, description: 'agent.thinking: the mention being answered.'}
        message: {$ref: '#/components/schemas/GroupMessage'}
        user: {$ref: '#/components/schemas/SocialUser', description: 'Who is typing, or reacting.'}
        emoji: {type: string, description: 'watch.reaction only.'}
    RealtimeCommand:
      type: object
      description: One frame a client sends on GET /v1/ws. At most one typing frame per channel every 3 seconds, and one reaction a second, counts.
      required: [type, groupId, channelId]
      properties:
        type:
          type: string
          enum: [typing, react]
        emoji: {type: string, description: 'react only: one of 😂 😱 😭 ❤️ 👏 🔥.'}
        groupId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
    MembershipUpdate:
      type: object
      description: Any field left out keeps its value.
      properties:
        shareProgress: {type: boolean}
        muted: {type: boolean}
    SpoilerStamp:
      type: object
      description: How far into the title a reader must be to read the message unveiled. An episode, or the ending.
      properties:
        season: {type: integer}
        episode: {type: integer}
        ending: {type: boolean}
    MemberProgress:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/SocialUser'}
        status: {$ref: '#/components/schemas/LibraryStatus', description: Absent when it is not in their library.}
        season: {type: integer, description: The furthest episode they ticked.}
        episode: {type: integer}
    ChannelProgress:
      type: object
      required: [title, members]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        mine: {$ref: '#/components/schemas/MemberProgress'}
        members:
          type: array
          description: Only members who share their progress in this group.
          items: {$ref: '#/components/schemas/MemberProgress'}
    ChannelItem:
      type: object
      required: [title, addedAt]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        addedBy: {$ref: '#/components/schemas/SocialUser'}
        addedAt: {type: string, format: date-time}
        myStatus: {$ref: '#/components/schemas/LibraryStatus', description: Yours, when it is in your library.}
    ChannelItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ChannelItem'}
    ChannelItemCreate:
      type: object
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/MediaRef'}
    WatchParty:
      type: object
      required: [id, title, state, ready]
      properties:
        id: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        season: {type: integer}
        episode: {type: integer}
        state:
          type: string
          enum: [lobby, countdown, live, ended]
        startsAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        host: {$ref: '#/components/schemas/SocialUser'}
        ready:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
    WatchPartyView:
      type: object
      required: [serverTime]
      properties:
        party: {$ref: '#/components/schemas/WatchParty'}
        serverTime: {type: string, format: date-time, description: 'Count down against this, not the device clock.'}
    WatchPartyCreate:
      type: object
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/MediaRef'}
        season: {type: integer}
        episode: {type: integer}
    WatchPartyReady:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
    WatchPartyStart:
      type: object
      properties:
        countdownSeconds: {type: integer, description: '3–60, default 10.'}
    ExternalIds:
      type: object
      description: Provider identifiers known for a title. Absent means unknown.
      properties:
        tmdb: {type: string}
        imdb: {type: string}
        trakt: {type: string}
        tvdb: {type: string}
        isbn: {type: string}
        openLibrary: {type: string}
        anilist: {type: string}
        mal: {type: string}
        anidb: {type: string}
        musicbrainz:
          type: string
          description: An album's MusicBrainz release-group id (MUS-001).
    MediaType:
      type: string
      description: >-
        `album` (MUS-001) is a MusicBrainz release group of type Album or EP: status, rating and
        notes, no progress.
      enum: [movie, show, book, album]
    CatalogHit:
      type: object
      required: [type, title, isAnime, ids]
      properties:
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        overview: {type: string}
        byline:
          type: string
          description: Authors, for books; the artist credit, for albums.
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        libraryItemId:
          type: string
          description: The caller's library item for this title, when they have one. Discover only.
        releaseDate:
          type: string
          description: >-
            YYYY-MM-DD. A film's first release or a show's first air date (TMDB), an anime's start
            date (AniList). Absent when the provider has no full date.
    SearchResults:
      type: object
      required: [items, incomplete]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
        incomplete:
          type: boolean
          description: >-
            True when one provider of an `all` search failed or ran out of time, so the items
            come from the other alone. Always false for a single-provider search.
    DiscoverRow:
      type: object
      required: [id, title, items]
      properties:
        id:
          type: string
          description: >-
            Stable row key, e.g. `tv_trending`, `anime_season`, `books_trending`, `music_new`. Not an enum:
            the server may add rows, and clients render any row they get.
        title:
          type: string
          description: Display title, e.g. "Fall 2026 anime".
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
    DiscoverRows:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: {$ref: '#/components/schemas/DiscoverRow'}
    SeasonPage:
      type: object
      required: [kind, season, year, from, until, title, items, page, hasMore, unavailable]
      properties:
        kind:
          type: string
          enum: [anime, shows_new, shows_returning, movies]
        season:
          type: string
          enum: [winter, spring, summer, fall]
        year: {type: integer}
        from:
          type: string
          description: First day of the season, YYYY-MM-DD.
        until:
          type: string
          description: Last day of the season, YYYY-MM-DD.
        title:
          type: string
          description: Display name, e.g. "Fall 2026".
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
        page: {type: integer}
        hasMore: {type: boolean}
        total:
          type: integer
          description: The provider's count for the whole season, when it gives one.
        unavailable:
          type: boolean
          description: The provider did not answer and nothing was cached; not an empty season.
    Concert:
      type: object
      description: One music event from Ticketmaster. Tickets are bought there, never in Aaru.
      required: [id, name, artists, localDate, url]
      properties:
        id: {type: string}
        name: {type: string}
        artists:
          type: array
          description: The acts on the bill, headliner first.
          items: {type: string}
        startsAt:
          type: string
          format: date-time
          description: The exact start, when announced.
        localDate:
          type: string
          description: The day at the venue, YYYY-MM-DD.
        localTime:
          type: string
          description: The time at the venue, HH:mm, when announced.
        venue: {type: string}
        city: {type: string}
        country: {type: string}
        distanceKm:
          type: number
          description: From the searched point. Absent for an artist's concerts.
        url:
          type: string
          description: Ticketmaster's event page.
        imageUrl:
          type: string
          description: Ticketmaster's image for the event, referenced, never hosted.
    ConcertPlace:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: {type: string, description: '1 to 200 characters.'}
        region: {type: string}
        country: {type: string}
        countryCode: {type: string, description: ISO 3166-1 alpha-2.}
        latitude: {type: number, description: Rounded to two decimals by the server.}
        longitude: {type: number, description: Rounded to two decimals by the server.}
    ConcertPlaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ConcertPlace'}
    ConcertPlaceSetting:
      type: object
      required: [available]
      properties:
        place: {$ref: '#/components/schemas/ConcertPlace'}
        available:
          type: boolean
          description: False when concerts are off on this server; clients hide the Concerts view.
    ConcertsNearRequest:
      type: object
      required: [radiusKm]
      properties:
        latitude:
          type: number
          description: Sent with `longitude` for a one-off position; absent uses the saved city.
        longitude: {type: number}
        radiusKm:
          type: integer
          enum: [25, 50, 100]
        page:
          type: integer
          description: 1-based, at most 10.
          default: 1
    ConcertPage:
      type: object
      required: [radiusKm, items, page, hasMore, unavailable]
      properties:
        place: {$ref: '#/components/schemas/ConcertPlace'}
        radiusKm: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/Concert'}
        page: {type: integer}
        hasMore: {type: boolean}
        unavailable:
          type: boolean
          description: Concerts are off, or Ticketmaster did not answer and nothing was cached.
    ArtistConcerts:
      type: object
      required: [items, matched, pending, unavailable]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Concert'}
        matched:
          type: integer
          description: Library artists Ticketmaster knows.
        pending:
          type: integer
          description: Library artists not looked up yet.
        unavailable: {type: boolean}
    Episode:
      type: object
      required: [season, number, airTimeKnown]
      properties:
        season: {type: integer}
        number: {type: integer}
        name: {type: string}
        overview:
          type: string
          description: The episode's synopsis, when the catalog has one.
        stillUrl:
          type: string
          description: A frame from the episode (TMDB, referenced, never hosted).
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: True when `airsAt` is the exact broadcast time; false when only the date is known.
        runtimeMinutes: {type: integer}
    Season:
      type: object
      required: [number, episodes]
      properties:
        number: {type: integer}
        episodes:
          type: array
          items: {$ref: '#/components/schemas/Episode'}
    TitleDetail:
      type: object
      required: [id, type, title, isAnime, ids]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        synopsis: {type: string}
        posterUrl: {type: string}
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        status:
          type: string
          enum: [upcoming, returning, ended, canceled]
        runtimeMinutes: {type: integer}
        seasons:
          type: array
          description: Shows only.
          items: {$ref: '#/components/schemas/Season'}
        byline:
          type: string
          description: Authors, for books; the artist credit, for albums.
        genres:
          type: array
          description: Albums only (MUS-001), at most five, most tagged first.
          items: {type: string}
        tracks:
          type: array
          description: >-
            Albums only: the tracklist of the album's earliest official release, by disc then
            position. Absent when MusicBrainz could not be reached and none is stored yet.
          items: {$ref: '#/components/schemas/AlbumTrack'}
    AlbumTrack:
      type: object
      required: [disc, position, name]
      properties:
        disc: {type: integer}
        position: {type: integer}
        name: {type: string}
        lengthMs: {type: integer}
    LibraryStatus:
      type: string
      enum: [wishlist, in_progress, finished, dropped]
    MediaRef:
      type: object
      required: [type]
      description: A title by Aaru id, by provider ids, or by title + year.
      properties:
        titleId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        title: {type: string}
        year: {type: integer}
    AddLibraryItem:
      type: object
      required: [mediaRef]
      properties:
        mediaRef: {$ref: '#/components/schemas/MediaRef'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
    LibraryItemPatch:
      type: object
      properties:
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating:
          type: number
          description: 1–10 in 0.5 steps.
        notes: {type: string}
        isOwned: {type: boolean}
        bookPage: {type: integer}
        bookPercent: {type: number}
        clear:
          type: array
          description: Fields to empty.
          items:
            type: string
            enum: [rating, notes, bookProgress]
    EpisodeWatched:
      type: object
      required: [watched]
      properties:
        watched: {type: boolean}
    EpisodeRef:
      type: object
      required: [season, number]
      properties:
        season: {type: integer}
        number: {type: integer}
    ShowProgress:
      type: object
      required: [watchedCount, airedCount]
      description: Specials (season 0) are not counted.
      properties:
        watchedCount: {type: integer}
        airedCount: {type: integer}
        nextEpisode: {$ref: '#/components/schemas/EpisodeRef'}
    BookProgress:
      type: object
      properties:
        page: {type: integer}
        percent: {type: number}
    TitleSummary:
      type: object
      required: [id, type, title, isAnime, ids]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        backdropUrl:
          type: string
          description: Wide art (TMDB backdrop, AniList banner), for banners such as the week grid.
        network:
          type: string
          description: Shows only. Network or streaming service ("HBO", "Netflix", "Crunchyroll").
        byline:
          type: string
          description: Authors, for books; the artist credit, for albums.
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
    LibraryEntry:
      type: object
      required: [id, title, status, isOwned, addedAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        notes: {type: string}
        isOwned: {type: boolean}
        addedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        progress: {$ref: '#/components/schemas/ShowProgress'}
        bookProgress: {$ref: '#/components/schemas/BookProgress'}
        watchedEpisodes:
          type: array
          description: |
            Every watched episode of a show, in order. Only on single-item responses (the item,
            and episode and season writes); lists and sync leave it out.
          items: {$ref: '#/components/schemas/EpisodeRef'}
    AccountExport:
      type: object
      required: [exportedAt, account, library, lists, shelves]
      properties:
        exportedAt: {type: string, format: date-time}
        account: {$ref: '#/components/schemas/Me'}
        library:
          type: array
          description: Every library item; shows carry `watchedEpisodes`.
          items: {$ref: '#/components/schemas/LibraryEntry'}
        lists:
          type: array
          items:
            type: object
            required: [name, createdAt, items]
            properties:
              name: {type: string}
              createdAt: {type: string, format: date-time}
              items:
                type: array
                items: {$ref: '#/components/schemas/TitleSummary'}
        shelves:
          type: array
          items: {$ref: '#/components/schemas/Shelf'}
        friends:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
        blocked:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
        groups:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name: {type: string}
              role: {$ref: '#/components/schemas/GroupRole'}
        groupMessages:
          type: array
          description: Messages you wrote in groups, oldest first.
          items:
            type: object
            required: [group, channel, body, createdAt]
            properties:
              group: {type: string}
              channel: {type: string}
              body: {type: string}
              createdAt: {type: string, format: date-time}
        listens:
          type: array
          description: Every listen in your listening log, newest first (MUS-005).
          items: {$ref: '#/components/schemas/Listen'}
    LibraryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryEntry'}
        page: {$ref: '#/components/schemas/PageInfo'}
    LibrarySync:
      type: object
      required: [items, deleted, token]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryEntry'}
        deleted:
          type: array
          items: {type: string, format: uuid}
        token: {type: string}
    Action:
      type: object
      required: [id, actor, kind, summary, itemIds, createdAt]
      properties:
        id: {type: string, format: uuid}
        actor:
          type: string
          enum: [user, agent, external_agent]
        kind: {type: string}
        summary: {type: string}
        itemIds:
          type: array
          items: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        undoneAt: {type: string, format: date-time}
        undoOf: {type: string, format: uuid}
        agentName:
          type: string
          description: The connected app that made it (an agent token's name); absent for your own writes.
    ActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Action'}
    ListSummary:
      type: object
      required: [id, name, itemCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        itemCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ListList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ListSummary'}
    ListDetail:
      type: object
      required: [id, name, titles, items, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        titles:
          type: array
          description: Superseded by `items`; kept for clients that predate it.
          items: {$ref: '#/components/schemas/TitleSummary'}
        items:
          type: array
          description: The members in list order.
          items: {$ref: '#/components/schemas/ListItem'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ListItem:
      type: object
      description: >-
        One list member. `entry` is the caller's library row when the title is in the library.
        Shows carry `showStatus` and `nextAiring` (the first episode not aired yet) once their
        episodes are loaded.
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        entry: {$ref: '#/components/schemas/LibraryEntry'}
        showStatus:
          type: string
          enum: [upcoming, returning, ended, canceled]
        nextAiring: {$ref: '#/components/schemas/UpcomingEpisode'}
    UpcomingEpisode:
      type: object
      required: [season, number, airsAt, airTimeKnown]
      properties:
        season: {type: integer}
        number: {type: integer}
        episodeName: {type: string}
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: False when the source gives only a date, as on CalendarEntry.
    CreateList:
      type: object
      required: [name]
      properties:
        name: {type: string}
    RenameList:
      type: object
      required: [name]
      properties:
        name: {type: string}
    AddListItem:
      type: object
      required: [mediaRef]
      properties:
        mediaRef: {$ref: '#/components/schemas/MediaRef'}
    ListOrder:
      type: object
      required: [titleIds]
      properties:
        titleIds:
          type: array
          items: {type: string, format: uuid}
    ShelfFilter:
      type: object
      description: The same filters GET /v1/library/items accepts.
      properties:
        type: {$ref: '#/components/schemas/MediaType'}
        anime: {type: boolean}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        owned: {type: boolean}
        list: {type: string, format: uuid}
    Shelf:
      type: object
      required: [id, name, filter, isPinned]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    ShelfList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Shelf'}
    CreateShelf:
      type: object
      required: [name, filter]
      properties:
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    UpdateShelf:
      type: object
      properties:
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    CalendarEntry:
      type: object
      required: [libraryItemId, title, season, number, airsAt, airTimeKnown, watched, kind]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        season: {type: integer}
        number: {type: integer}
        episodeName: {type: string}
        episodeOverview:
          type: string
          description: The episode's synopsis, when the catalog has one (TMDB; AniList has none).
        stillUrl:
          type: string
          description: The episode's still image (TMDB), when the catalog has one.
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: >-
            False when the source gives only a date: airsAt is midnight UTC of that date, and
            clients show the day (taken in UTC) without a time.
        runtimeMinutes: {type: integer}
        watched: {type: boolean}
        kind:
          type: string
          enum: [premiere, finale, regular]
    Calendar:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalendarEntry'}
    ContinueEntry:
      type: object
      required: [libraryItemId, title, next, remainingCount, remainingMinutes, isFinale]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        next: {$ref: '#/components/schemas/EpisodeRef'}
        nextName: {type: string}
        nextRuntimeMinutes: {type: integer}
        remainingCount:
          type: integer
          description: Aired, unwatched episodes including the next one. Specials excluded.
        remainingMinutes: {type: integer}
        isFinale:
          type: boolean
          description: The next episode is the last of its season.
    StartEntry:
      type: object
      required: [libraryItemId, title]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        runtimeMinutes: {type: integer}
    UpNext:
      type: object
      required: [continueWatching, startWatching]
      properties:
        continueWatching:
          type: array
          items: {$ref: '#/components/schemas/ContinueEntry'}
        startWatching:
          type: array
          items: {$ref: '#/components/schemas/StartEntry'}
        counts: {$ref: '#/components/schemas/LibraryCounts'}
        unfinished:
          type: array
          description: >-
            Unfinished business (UPN-002): every dropped item, and every in-progress item last
            changed 30 or more days ago that is not in `continueWatching`. Newest change first, at
            most 20.
          items: {$ref: '#/components/schemas/UnfinishedEntry'}
    LibraryCounts:
      type: object
      description: The user's library items per status.
      required: [wishlist, inProgress, finished, dropped]
      properties:
        wishlist: {type: integer}
        inProgress: {type: integer}
        finished: {type: integer}
        dropped: {type: integer}
    UnfinishedEntry:
      type: object
      required: [libraryItemId, title, reason, since]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        reason:
          type: string
          enum: [dropped, stalled]
          description: "`dropped` is the status; `stalled` is in progress and untouched for 30 days."
        since:
          type: string
          format: date-time
          description: The item's last change.
        next: {$ref: '#/components/schemas/EpisodeRef'}
    Stats:
      type: object
      description: >-
        `busiest` is the bucket with the most time (minutes, then episodes, then finishes).
        `mostEpisodes` is the bucket with the most episodes; it is absent when no episodes were
        watched or the top count is shared, so a tie names no winner.
        `prior` is the totals of the equal-length window just before a rolling span, for deltas;
        it is absent for calendar spans. `biggestDay` is the single local day with the most time
        (then episodes), the earliest on a tie.
      required: [span, year, timeZone, isPartial, totals, byKind, buckets, topTitles, ratings, topGenres]
      properties:
        span:
          type: string
          enum: [month, year, all, last7, last30]
        year:
          type: integer
          description: The last year the period touches; for `all`, the current year.
        month: {type: integer}
        from:
          type: string
          description: First day of a rolling span (YYYY-MM-DD); absent for calendar spans.
        until:
          type: string
          description: Last day of a rolling span (YYYY-MM-DD, inclusive, today); absent for calendar spans.
        timeZone: {type: string}
        isPartial:
          type: boolean
          description: The period is not over yet in the user's time zone (always true for `all`).
        totals: {$ref: '#/components/schemas/StatsTotals'}
        prior: {$ref: '#/components/schemas/StatsTotals'}
        byKind:
          type: array
          description: >-
            Movie, show, anime and book, always, in that order; then album (MUS-001) only when the
            period finished one. They sum to `totals`.
          items: {$ref: '#/components/schemas/StatsKind'}
        buckets:
          type: array
          description: >-
            One per month of the year, one per day of the month or rolling span, or one per year (all
            time) from the first active year to this one, in order.
          items: {$ref: '#/components/schemas/StatsBucket'}
        busiest: {$ref: '#/components/schemas/StatsBucket'}
        mostEpisodes: {$ref: '#/components/schemas/StatsBucket'}
        longestRun: {$ref: '#/components/schemas/StatsRun'}
        topTitles:
          type: array
          description: Most time spent, at most five.
          items: {$ref: '#/components/schemas/StatsTitle'}
        ratings: {$ref: '#/components/schemas/StatsRatings'}
        first: {$ref: '#/components/schemas/StatsMoment'}
        last: {$ref: '#/components/schemas/StatsMoment'}
        topGenres:
          type: array
          description: >-
            GAM-006e: the three genres with the most time, from films, shows and anime (books
            have none). Empty until the titles' genres are stored.
          items: {$ref: '#/components/schemas/StatsGenre'}
        biggestDay: {$ref: '#/components/schemas/StatsBucket'}
        persona:
          type: string
          description: >-
            GAM-006e: one word for the period from the user's own numbers, the first rule that
            holds: `binger` (a day of 6+ episodes or 14 days in a row), `bookworm` (books are
            most of 2+ finishes), `anime` (anime is most of the time), `completionist` (24+
            finished), `explorer` (3+ kinds), else `steady`. Absent when nothing happened.
          enum: [binger, bookworm, anime, completionist, explorer, steady]
    StatsGenre:
      type: object
      required: [name, minutes, titles]
      properties:
        name: {type: string}
        minutes: {type: integer}
        titles:
          type: integer
          description: How many titles in the period carried this genre.
    Listen:
      type: object
      description: >-
        One play of a track a scrobbler sent (MUS-005). Never a library item: listening does not
        change the library.
      required: [id, listenedAt, artist, track]
      properties:
        id: {type: string}
        listenedAt: {type: string, format: date-time, description: When the track started.}
        artist: {type: string}
        track: {type: string}
        album: {type: string}
        durationMs: {type: integer}
        coverUrl: {type: string, description: The album's Cover Art Archive cover when Aaru knows the album.}
        originUrl: {type: string, description: Where it played, when the scrobbler said.}
        client: {type: string, description: 'The scrobbler, e.g. "Web Scrobbler".'}
        musicService: {type: string, description: 'Where it was heard, e.g. "YouTube Music".'}
    ListenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Listen'}
        next:
          type: string
          format: date-time
          description: Pass as `before` for the next page; absent on the last page.
    ListenTop:
      type: object
      required: [by, span, year, timeZone, listens, minutes, items]
      properties:
        by: {type: string, enum: [artist, track, album]}
        span: {type: string, enum: [month, year, all, last7, last30]}
        year: {type: integer}
        month: {type: integer}
        timeZone: {type: string}
        listens: {type: integer, description: Every listen in the period.}
        minutes: {type: integer, description: Their length summed, for listens whose length is known.}
        items:
          type: array
          items:
            type: object
            required: [artist, count, minutes]
            properties:
              artist: {type: string}
              track: {type: string, description: Present when ranking tracks.}
              album: {type: string, description: Present when ranking albums.}
              count: {type: integer}
              minutes: {type: integer}
    StatsTotals:
      type: object
      required: [episodesWatched, minutesWatched, activeDays, moviesFinished, showsFinished, animeFinished,
        booksFinished, albumsFinished]
      properties:
        episodesWatched: {type: integer}
        minutesWatched:
          type: integer
          description: Episode runtimes plus finished movies. Books have no minutes.
        activeDays: {type: integer}
        moviesFinished: {type: integer}
        showsFinished: {type: integer}
        animeFinished:
          type: integer
          description: Anime shows and films. Not counted again as shows or movies.
        booksFinished: {type: integer}
        albumsFinished:
          type: integer
          description: MUS-001. Albums have no minutes.
    StatsKind:
      type: object
      required: [kind, episodes, minutes, finished]
      properties:
        kind:
          type: string
          enum: [movie, show, anime, book, album]
          description: Anime is its own kind, films and shows alike; never counted again as either.
        episodes: {type: integer}
        minutes: {type: integer}
        finished: {type: integer}
    StatsBucket:
      type: object
      required: [start, episodes, minutes, finished]
      properties:
        start:
          type: string
          description: First local day of the bucket, YYYY-MM-DD.
        episodes: {type: integer}
        minutes: {type: integer}
        finished: {type: integer}
    StatsRun:
      type: object
      required: [days, start, end]
      properties:
        days: {type: integer}
        start: {type: string, description: 'YYYY-MM-DD'}
        end: {type: string, description: 'YYYY-MM-DD, inclusive.'}
    StatsTitle:
      type: object
      required: [title, episodes, minutes]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        episodes: {type: integer}
        minutes: {type: integer}
    StatsRatings:
      type: object
      required: [count, distribution]
      properties:
        count:
          type: integer
          description: Titles finished in the period that have a rating.
        mean: {type: number}
        highest: {$ref: '#/components/schemas/TitleSummary'}
        highestRating: {type: number}
        distribution:
          type: array
          description: >-
            Ten counts of those ratings on the 1–10 scale. Index n holds ratings above n up to n + 1,
            so a half star rounds up: 7.5 counts as 8 (index 7), 1 is index 0, 10 is index 9.
          minItems: 10
          maxItems: 10
          items: {type: integer}
    StatsMoment:
      type: object
      required: [title, at]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        at: {type: string, format: date-time}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
  responses:
    Error:
      description: Any error, in the shared shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

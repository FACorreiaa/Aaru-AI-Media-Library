        title: {$ref: '#/components/schemas/TitleSummary'}
        day: {type: string, format: date}
        at: {type: string, format: date-time}
        revocation: {type: boolean, description: Points taken back by an undo or a short friendship.}
    PointsPage:
      type: object
      required: [items]
      properties:

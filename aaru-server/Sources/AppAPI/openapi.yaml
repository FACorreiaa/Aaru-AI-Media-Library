openapi: '3.1.0'
info:
  title: Aaru API
  version: 1.0.0
  description: |
    Aaru's JSON API. Every route lives under `/v1`. Errors share one shape
    (`ErrorResponse`); list routes share one cursor envelope (`PageInfo`).
servers:
  - url: /
    description: Same origin as the request.
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Liveness and database reachability. Unauthenticated.
      security: []
      responses:
        '200':
          description: The server is up and can reach its database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The server is up but a dependency is not reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/apple:
    post:
      operationId: signInWithApple
      summary: Exchange a Sign in with Apple identity token for a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppleSignInRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/google:
    post:
      operationId: signInWithGoogle
      summary: Exchange a Google ID token for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInRequest'}
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/identities/google:
    post:
      operationId: linkGoogle
      summary: Link a Google account to the signed-in account. Refused if it belongs to another account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleSignInRequest'}
      responses:
        '200':
          description: Linked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/link:
    post:
      operationId: requestMagicLink
      summary: Email a one-time sign-in link. Same answer whether or not an account exists.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
      responses:
        '202':
          description: The link was sent (or would have been).
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/email/verify:
    post:
      operationId: verifyMagicLink
      summary: Exchange a magic-link token, or the email and its 6-digit code, for a session. Creates the account on first use.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
      responses:
        '200':
          description: Signed in. The token is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/session:
    delete:
      operationId: signOut
      summary: End the current session.
      responses:
        '204':
          description: Signed out.
        default:
          $ref: '#/components/responses/Error'
  /v1/me:
    get:
      operationId: getMe
      summary: The signed-in account.
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteAccount
      summary: Delete the account and everything that belongs to it.
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices:
    put:
      operationId: registerDevice
      summary: Register this device for pushes. A token registered again moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceRegistration'}
      responses:
        '204':
          description: Registered.
        default:
          $ref: '#/components/responses/Error'
  /v1/devices/{token}:
    delete:
      operationId: unregisterDevice
      parameters:
        - {name: token, in: path, required: true, schema: {type: string}}
      responses:
        '204':
          description: Forgotten.
        default:
          $ref: '#/components/responses/Error'
  /v1/web-push/key:
    get:
      operationId: getWebPushKey
      summary: The VAPID public key a browser subscribes with. 503 `push_unavailable` when web push is off.
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebPushKey'}
        default:
          $ref: '#/components/responses/Error'
  /v1/web-push/subscriptions:
    put:
      operationId: saveWebPushSubscription
      summary: Save this browser's push subscription. Saved again, it moves to this user.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebPushSubscription'}
      responses:
        '204':
          description: Saved.
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteWebPushSubscription
      parameters:
        - {name: endpoint, in: query, required: true, schema: {type: string}}
      responses:
        '204':
          description: Forgotten.
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/tokens:
    get:
      operationId: listAgentTokens
      summary: The user's live agent tokens (OUT-001), newest first. Secrets are never returned.
      parameters:
        - name: for
          in: query
          description: >-
            Which surface's tokens: the Stremio addon or MCP clients. Defaults to `stremio`, so
            Apple builds that only know the Stremio kind never see an MCP token.
          schema: {type: string, enum: [stremio, mcp], default: stremio}
      responses:
        '200':
          description: Live tokens.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AgentToken'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createAgentToken
      summary: >-
        Mint a token for an outside caller. A Stremio token's answer carries the addon's install
        links; an MCP client's carries its setup, with the secret filled in. The secret is shown
        once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AgentTokenCreate'}
      responses:
        '201':
          description: Minted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTokenCreated'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans:
    get:
      operationId: listPlans
      summary: >-
        Changes outside agents asked for that wait for the user (OUT-004), newest first. Only a
        signed-in session reaches the plan routes; an agent token never does.
      parameters:
        - name: status
          in: query
          description: '`pending` (default) leaves out decided and expired plans.'
          schema: {type: string, enum: [pending, all], default: pending}
      responses:
        '200':
          description: Plans.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}:
    get:
      operationId: getPlan
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}/approve:
    post:
      operationId: approvePlan
      summary: >-
        Apply the plan as one undoable action named after its agent. 409 `plan_stale` when the
        library changed since it was made (nothing is written), `plan_expired`, or `plan_decided`.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [plan, action]
                properties:
                  plan: {$ref: '#/components/schemas/AgentPlan'}
                  action: {$ref: '#/components/schemas/Action'}
        default:
          $ref: '#/components/responses/Error'
  /v1/plans/{id}/deny:
    post:
      operationId: denyPlan
      summary: Refuse the plan. Nothing is written; the plan stays as the record of what was asked.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Denied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPlan'}
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/setup/{kind}:
    get:
      operationId: getAgentSetup
      summary: >-
        How to connect one MCP client (OUT-004), with a placeholder where the secret goes, so
        Settings can show the steps before a token exists.
      parameters:
        - name: kind
          in: path
          required: true
          schema: {$ref: '#/components/schemas/AgentMCPKind'}
      responses:
        '200':
          description: The client's setup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentSetup'}
        default:
          $ref: '#/components/responses/Error'
  /v1/agent/tokens/{id}:
    delete:
      operationId: revokeAgentToken
      summary: Revoke a token. Its addon stops answering at once.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204':
          description: Revoked.
        default:
          $ref: '#/components/responses/Error'
  /v1/me/notifications:
    get:
      operationId: getNotificationSettings
      responses:
        '200':
          description: The user's notification choices.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default:
          $ref: '#/components/responses/Error'
    put:
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NotificationSettings'}
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationSettings'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/stats:
    get:
      operationId: getStats
      summary: >-
        What the user watched and read in one calendar year or month of their time zone (GAM-006a),
        or in all time (GAM-006c). Derived only from their own library. Imported history counts
        only where it carries a real date.
      parameters:
        - name: year
          in: query
          description: Required unless `span=all`.
          schema: {type: integer}
        - name: span
          in: query
          description: >-
            `all` is all time: every year from the first active one through the current year,
            one bucket per year, so its totals equal the years' summed. It takes no `year` or
            `month` (422 otherwise).
          schema:
            type: string
            enum: [all]
        - name: month
          in: query
          description: 1–12. Absent means the whole year.
          schema: {type: integer}
        - name: tz
          in: query
          description: IANA time zone for day and month boundaries. Absent means UTC.
          schema: {type: string}
      responses:
        '200':
          description: The period's stats.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stats'}
        default:
          $ref: '#/components/responses/Error'
  /v1/search:
    get:
      operationId: searchCatalog
      summary: Search the catalog. Results are catalog projections, never library rows.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: >-
            `all` searches films, shows and anime together (TMDB and AniList in parallel, merged;
            books are never included); `anime` searches AniList; `movie`/`show` TMDB; `book` Open
            Library.
          schema:
            type: string
            enum: [all, movie, show, anime, book]
      responses:
        '200':
          description: >-
            Matches, best first. With `all`, exact title matches lead, then TMDB and AniList hits
            alternate, at most 40; a TMDB show is left out only when an AniList hit in the same
            results is mapped to it, and that hit then carries `ids.tmdb`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        default:
          $ref: '#/components/responses/Error'
  /v1/discover:
    get:
      operationId: getDiscover
      summary: Provider-curated public rows for Home (trending, airing, this season).
      description: >-
        The same lists for every user, cached by the server. Items the caller already has
        carry `libraryItemId`. A row whose provider is down is left out.
      responses:
        '200':
          description: Rows in display order. Empty rows are left out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverRows'
        default:
          $ref: '#/components/responses/Error'
  /v1/titles/{id}:
    get:
      operationId: getTitle
      summary: A title from the catalog. Shows include their seasons and episodes.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TitleDetail'
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items:
    get:
      operationId: listLibraryItems
      summary: The user's library, most recently updated first. Shelves use the same filters.
      parameters:
        - {name: type, in: query, required: false, schema: {$ref: '#/components/schemas/MediaType'}}
        - {name: anime, in: query, required: false, schema: {type: boolean}}
        - {name: status, in: query, required: false, schema: {$ref: '#/components/schemas/LibraryStatus'}}
        - {name: owned, in: query, required: false, schema: {type: boolean}}
        - {name: list, in: query, required: false, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: addLibraryItem
      summary: Add a title to the library. Adding the same title again returns the existing item.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddLibraryItem'}
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getLibraryItem
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateLibraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LibraryItemPatch'}
      responses:
        '200':
          description: The updated item.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteLibraryItem
      responses:
        '204':
          description: Removed.
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/episodes/{season}/{episode}:
    put:
      operationId: setEpisodeWatched
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season, in: path, required: true, schema: {type: integer}}
        - {name: episode, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodeWatched'}
      responses:
        '200':
          description: The item with updated progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/items/{id}/seasons/{season}/watched:
    post:
      operationId: markSeasonWatched
      summary: Mark every aired episode of a season watched, as one undoable action.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: season, in: path, required: true, schema: {type: integer}}
      responses:
        '200':
          description: The item with updated progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryEntry'}
        default:
          $ref: '#/components/responses/Error'
  /v1/library/sync:
    get:
      operationId: syncLibrary
      summary: Items changed and ids deleted since a previous sync token (all items when absent).
      parameters:
        - {name: since, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: The changes and the token for next time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibrarySync'}
        default:
          $ref: '#/components/responses/Error'
  /v1/actions:
    get:
      operationId: listActions
      summary: The action journal, newest first. Backs the undo ribbon.
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Actions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActionList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/actions/{id}/undo:
    post:
      operationId: undoAction
      summary: Apply an action's inverse. Journaled as its own action; undoing twice is 409.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: The undo, as an action.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Action'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists:
    get:
      operationId: listLists
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createList
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateList'}
      responses:
        '200':
          description: The new list.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getList
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
    patch:
      operationId: renameList
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RenameList'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteList
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/items:
    post:
      operationId: addListItem
      summary: Add a title to a list. It need not be in the library.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddListItem'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/items/{titleId}:
    delete:
      operationId: removeListItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: titleId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/lists/{id}/order:
    put:
      operationId: reorderList
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListOrder'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListDetail'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports:
    get:
      operationId: listImports
      summary: The user's imports, newest first.
      responses:
        '200':
          description: Up to 50 imports.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportList'}
        default:
          $ref: '#/components/responses/Error'
  /v1/me/export:
    get:
      operationId: exportAccount
      summary: Everything Aaru holds for the caller, to keep or move elsewhere (GDPR portability).
      description: >-
        `json` (default) is complete: account, every library item with ratings, notes and every
        watched episode, lists and shelves. `csv` is one row per library item in the column layout
        Aaru's own "Any site" import reads, so it can be re-imported here or opened in a spreadsheet.
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: The export, as a download.
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountExport'}
            text/csv:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/csv:
    post:
      operationId: createCSVImport
      summary: Upload an export file. It is parsed now, matched in the background, and written only after approval.
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [auto, imdb, letterboxd, goodreads, mal, csv]
          description: >-
            `auto` detects the format: MyAnimeList-format XML (also exported by Kitsu and AniList),
            an IMDb, Letterboxd or Goodreads CSV, or any other CSV read by its column names (`csv`).
        - name: filename
          in: query
          required: false
          description: The file's name. Letterboxd's watchlist export is told apart by it.
          schema: {type: string}
      requestBody:
        required: true
        content:
          text/csv:
            schema: {type: string, format: binary}
          # MyAnimeList's list export, decompressed (source=mal).
          application/xml:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: Queued for matching.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/anilist:
    post:
      operationId: createAniListImport
      summary: Import a public AniList anime list by username. Read and matched in the background, written only after approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, description: "AniList username: 2–20 letters, digits or underscores."}
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/stremio/link:
    post:
      operationId: startStremioLink
      summary: >-
        Start a Stremio history import. Show the user `link` (or `qrcode`) to approve on stremio.com, then
        poll POST /v1/imports/stremio/link/{code}. No password reaches Aaru; the session the code opens is
        used for one library read, then logged out.
      responses:
        '200':
          description: A code to approve.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StremioLink'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/stremio/link/{code}:
    post:
      operationId: pollStremioLink
      summary: >-
        Ask whether the code was approved. 204 while pending (ask again in a few seconds); 202 with the queued
        import once approved; 410 `stremio_link_expired` when the code ran out.
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, maxLength: 64}}
      responses:
        '202':
          description: Approved. The library was read and its import queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        '204':
          description: Not approved yet.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt:
    post:
      operationId: createTraktImport
      summary: Import the connected Trakt account. Read and matched in the background, written only after approval.
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt/connect:
    post:
      operationId: connectTrakt
      summary: >-
        Start connecting Trakt (PKCE). Open the returned address in a browser. Trakt then redirects to
        GET /v1/imports/trakt/callback (a plain redirect route outside this spec: its Location must not be
        percent-encoded), which sends the browser on to `returnTo` with `trakt=connected|denied|failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TraktConnectRequest'}
      responses:
        '200':
          description: Where to send the browser.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraktConnectStart'}
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/trakt/connection:
    get:
      operationId: getTraktConnection
      responses:
        '200':
          description: Whether Trakt is connected.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraktConnection'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: disconnectTrakt
      summary: Forget the Trakt tokens. Imported items stay.
      responses:
        '204':
          description: Disconnected.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getImport
      summary: One import with every row and what its plan does with it.
      responses:
        '200':
          description: The import.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportDetail'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteImport
      summary: Discard an import. Library items it already created stay; undo the import action for those.
      responses:
        '204':
          description: Discarded.
        default:
          $ref: '#/components/responses/Error'
  /v1/imports/{id}/apply:
    post:
      operationId: applyImport
      summary: Approve the plan. Writes it as one undoable action.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportJob'}
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves:
    get:
      operationId: listShelves
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ShelfList'}
        default:
          $ref: '#/components/responses/Error'
    post:
      operationId: createShelf
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateShelf'}
      responses:
        '200':
          description: The new shelf.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shelf'}
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    patch:
      operationId: updateShelf
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateShelf'}
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Shelf'}
        default:
          $ref: '#/components/responses/Error'
    delete:
      operationId: deleteShelf
      responses:
        '204':
          description: Deleted.
        default:
          $ref: '#/components/responses/Error'
  /v1/shelves/{id}/items:
    get:
      operationId: listShelfItems
      summary: The shelf's query, resolved now. Same DTO as GET /v1/library/items.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryPage'}
        default:
          $ref: '#/components/responses/Error'
  /v1/calendar:
    get:
      operationId: getCalendar
      summary: Episodes of tracked shows airing in [from, to), at most 42 days (a month grid). Times are UTC.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Episodes, by air time.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Calendar'}
        default:
          $ref: '#/components/responses/Error'
  /v1/up-next:
    get:
      operationId: getUpNext
      summary: >-
        Continue Watching, Start Watching, status counts and Unfinished business for the home
        screen, in one call.
      responses:
        '200':
          description: The home rows.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpNext'}
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous page's `page.nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  schemas:
    AgentToken:
      type: object
      required: [id, name, kind, scopes, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        scopes:
          type: array
          items: {type: string, enum: ['library:read', 'library:write', 'scrobble:write']}
        createdAt: {type: string, format: date-time}
        lastUsedAt:
          type: string
          format: date-time
          description: Recorded at most once an hour.
    AgentTokenCreate:
      type: object
      required: [kind]
      properties:
        kind: {$ref: '#/components/schemas/AgentTokenKind'}
        name: {type: string, maxLength: 80}
        allowLibraryWrites:
          type: boolean
          description: >-
            Adds `library:write`. For Stremio, its "unwatched" and "add to library" reach Aaru;
            removing from Stremio's library never deletes anything in Aaru. For an MCP client, it
            may change one item directly, as a tap does; anything larger waits for approval in
            Aaru. Off by default.
    AgentPlan:
      type: object
      required: [id, status, agentName, summary, changes, counts, createdAt, expiresAt]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [pending, applied, denied, stale, expired]}
        agentName:
          type: string
          description: The connection that asked, as the user named it.
        summary: {type: string}
        changes:
          type: array
          items:
            type: object
            required: [text, titleId, title, type]
            properties:
              text: {type: string}
              titleId: {type: string, format: uuid}
              title: {type: string}
              type: {$ref: '#/components/schemas/MediaType'}
              posterUrl: {type: string}
              libraryItemId:
                type: string
                description: Absent when the change adds the title.
        counts:
          type: object
          required: [adds, updates, removes, episodes]
          properties:
            adds: {type: integer}
            updates: {type: integer}
            removes: {type: integer}
            episodes: {type: integer}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
        actionId:
          type: string
          description: The journaled action, once applied; undo it like any other.
    AgentTokenKind:
      type: string
      description: >-
        Which outside caller a token is for. The MCP kinds differ only in the setup shown; they
        reach the same tools.
      enum: [stremio, claude_code, codex, hermes, gemini, other]
    AgentMCPKind:
      type: string
      enum: [claude_code, codex, hermes, gemini, other]
    AgentSetup:
      type: object
      description: >-
        How to connect one MCP client: the endpoint, then steps to copy. Before a token exists
        the secret reads `PASTE_YOUR_TOKEN_HERE`.
      required: [kind, title, url, steps, prompt]
      properties:
        kind: {$ref: '#/components/schemas/AgentMCPKind'}
        title: {type: string}
        url:
          type: string
          description: The MCP endpoint (streamable HTTP).
        steps:
          type: array
          items:
            type: object
            required: [label, language, text]
            properties:
              label: {type: string}
              language: {type: string, enum: [bash, json, toml, yaml, text]}
              text: {type: string}
              note: {type: string}
        prompt:
          type: string
          description: A message to paste into the agent once it is connected.
    AgentTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: '#/components/schemas/AgentToken'}
        secret:
          type: string
          description: Shown once. Anyone holding it, or the install links, can use the token.
        stremio:
          type: object
          description: Only for a Stremio token.
          required: [manifestUrl, installUrl, webInstallUrl]
          properties:
            manifestUrl: {type: string}
            installUrl:
              type: string
              description: The `stremio://` link that opens the Stremio app.
            webInstallUrl: {type: string}
        setup: {$ref: '#/components/schemas/AgentSetup'}
    ErrorResponse:
      type: object
      description: The one error shape every route returns.
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. `not_found`, `validation_failed`.
        message:
          type: string
          description: Human-readable explanation. Never contains internal detail.
        details:
          type: object
          description: Optional per-field detail, keyed by request field name (e.g. `rating`).
          additionalProperties:
            type: string
    PageInfo:
      type: object
      description: |
        Cursor pagination envelope. List routes return `{ items: [...], page: PageInfo }`.
        Cursors are keyed on `(updated_at, id)`; a null `nextCursor` means the last page.
      properties:
        nextCursor:
          type: [string, 'null']
    AppleSignInRequest:
      type: object
      required: [identityToken, nonce]
      properties:
        identityToken:
          type: string
          description: The JWT from ASAuthorizationAppleIDCredential / Sign in with Apple JS.
        nonce:
          type: string
          description: The raw nonce whose SHA-256 the client sent to Apple.
        displayName:
          type: string
          description: Apple sends the name only on the first authorization; pass it then.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
    MagicLinkVerifyRequest:
      type: object
      description: Either `token` (from the link) or `email` and `code` (from the same email).
      properties:
        token:
          type: string
        email:
          type: string
        code:
          type: string
          description: Six digits; spaces and dashes are ignored.
    TraktConnectRequest:
      type: object
      required: [returnTo]
      properties:
        returnTo:
          type: string
          description: Where the browser goes after Trakt (the app's `aaru://` scheme or the web app). Must be allowed by the server.
    TraktConnectStart:
      type: object
      required: [authorizeUrl]
      properties:
        authorizeUrl: {type: string}
    TraktConnection:
      type: object
      required: [connected]
      properties:
        connected: {type: boolean}
        username: {type: string}
        connectedAt: {type: string, format: date-time}
    StremioLink:
      type: object
      required: [code, link, qrcode, expiresAt]
      properties:
        code: {type: string}
        link: {type: string, format: uri, description: "The stremio.com page where the user approves the code."}
        qrcode: {type: string, format: uri, description: "A QR image of `link`, for scanning with a phone."}
        expiresAt: {type: string, format: date-time}
    ImportJob:
      type: object
      required: [id, source, state, stats, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        source:
          type: string
          enum: [trakt, stremio, imdb_csv, letterboxd_csv, goodreads_csv, cat_list, cat_ics, mal_xml, anilist, csv]
        state:
          type: string
          enum: [queued, running, planned, succeeded, failed, partial]
          description: "`planned` waits for approval; nothing is written before it."
        stats: {$ref: '#/components/schemas/ImportStats'}
        errorSummary: {type: string}
        filename:
          type: string
          description: The uploaded file's name, or the AniList username for an `anilist` import.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ImportStats:
      type: object
      required: [created, updated, skipped, unmatched]
      properties:
        created: {type: integer}
        updated: {type: integer}
        skipped: {type: integer}
        unmatched: {type: integer}
    ImportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ImportJob'}
    ImportRow:
      type: object
      required: [index, title, type, outcome]
      properties:
        index: {type: integer}
        title: {type: string}
        year: {type: integer}
        author: {type: string}
        type: {$ref: '#/components/schemas/MediaType'}
        sourceKey: {type: string}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        outcome:
          type: string
          enum: [pending, create, update, skip, unmatched]
        reason: {type: string}
        titleId: {type: string, format: uuid}
    ImportDetail:
      type: object
      required: [job, rows]
      properties:
        job: {$ref: '#/components/schemas/ImportJob'}
        rows:
          type: array
          items: {$ref: '#/components/schemas/ImportRow'}
    DeviceRegistration:
      type: object
      required: [token, environment, bundleId]
      properties:
        token: {type: string, description: The APNs device token, hex.}
        environment:
          type: string
          enum: [sandbox, production]
          description: "`sandbox` for Xcode builds; `production` for TestFlight and the App Store."
        bundleId: {type: string}
    WebPushKey:
      type: object
      required: [publicKey]
      properties:
        publicKey: {type: string, description: "VAPID public key, base64url: the browser's applicationServerKey."}
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      description: "`PushSubscription.toJSON()` as the browser gives it."
      properties:
        endpoint: {type: string}
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: {type: string}
            auth: {type: string}
    NotificationSettings:
      type: object
      required: [airing]
      properties:
        airing:
          type: boolean
          description: Push when a new episode of a show you are watching airs.
    GoogleSignInRequest:
      type: object
      required: [idToken]
      properties:
        idToken: {type: string}
        nonce:
          type: string
          description: The nonce sent with the Google sign-in, if any. Must come back in the token.
    Session:
      type: object
      required: [token, userId, expiresAt]
      properties:
        token:
          type: string
          description: "Bearer token, sent in the Authorization header as `Bearer <token>`."
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [userId, providers]
      properties:
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        providers:
          type: array
          items:
            type: string
            enum: [apple, email, google]
    ExternalIds:
      type: object
      description: Provider identifiers known for a title. Absent means unknown.
      properties:
        tmdb: {type: string}
        imdb: {type: string}
        trakt: {type: string}
        tvdb: {type: string}
        isbn: {type: string}
        openLibrary: {type: string}
        anilist: {type: string}
        mal: {type: string}
        anidb: {type: string}
    MediaType:
      type: string
      enum: [movie, show, book]
    CatalogHit:
      type: object
      required: [type, title, isAnime, ids]
      properties:
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        overview: {type: string}
        byline:
          type: string
          description: Authors, for books.
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        libraryItemId:
          type: string
          description: The caller's library item for this title, when they have one. Discover only.
        releaseDate:
          type: string
          description: >-
            YYYY-MM-DD. A film's first release or a show's first air date (TMDB), an anime's start
            date (AniList). Absent when the provider has no full date.
    SearchResults:
      type: object
      required: [items, incomplete]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
        incomplete:
          type: boolean
          description: >-
            True when one provider of an `all` search failed or ran out of time, so the items
            come from the other alone. Always false for a single-provider search.
    DiscoverRow:
      type: object
      required: [id, title, items]
      properties:
        id:
          type: string
          description: >-
            Stable row key, e.g. `tv_trending`, `anime_season`, `books_trending`. Not an enum:
            the server may add rows, and clients render any row they get.
        title:
          type: string
          description: Display title, e.g. "Fall 2026 anime".
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
    DiscoverRows:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: {$ref: '#/components/schemas/DiscoverRow'}
    Episode:
      type: object
      required: [season, number, airTimeKnown]
      properties:
        season: {type: integer}
        number: {type: integer}
        name: {type: string}
        overview:
          type: string
          description: The episode's synopsis, when the catalog has one.
        stillUrl:
          type: string
          description: A frame from the episode (TMDB, referenced, never hosted).
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: True when `airsAt` is the exact broadcast time; false when only the date is known.
        runtimeMinutes: {type: integer}
    Season:
      type: object
      required: [number, episodes]
      properties:
        number: {type: integer}
        episodes:
          type: array
          items: {$ref: '#/components/schemas/Episode'}
    TitleDetail:
      type: object
      required: [id, type, title, isAnime, ids]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        synopsis: {type: string}
        posterUrl: {type: string}
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        status:
          type: string
          enum: [upcoming, returning, ended, canceled]
        runtimeMinutes: {type: integer}
        seasons:
          type: array
          description: Shows only.
          items: {$ref: '#/components/schemas/Season'}
    LibraryStatus:
      type: string
      enum: [wishlist, in_progress, finished, dropped]
    MediaRef:
      type: object
      required: [type]
      description: A title by Aaru id, by provider ids, or by title + year.
      properties:
        titleId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        title: {type: string}
        year: {type: integer}
    AddLibraryItem:
      type: object
      required: [mediaRef]
      properties:
        mediaRef: {$ref: '#/components/schemas/MediaRef'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
    LibraryItemPatch:
      type: object
      properties:
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating:
          type: number
          description: 1–10 in 0.5 steps.
        notes: {type: string}
        isOwned: {type: boolean}
        bookPage: {type: integer}
        bookPercent: {type: number}
        clear:
          type: array
          description: Fields to empty.
          items:
            type: string
            enum: [rating, notes, bookProgress]
    EpisodeWatched:
      type: object
      required: [watched]
      properties:
        watched: {type: boolean}
    EpisodeRef:
      type: object
      required: [season, number]
      properties:
        season: {type: integer}
        number: {type: integer}
    ShowProgress:
      type: object
      required: [watchedCount, airedCount]
      description: Specials (season 0) are not counted.
      properties:
        watchedCount: {type: integer}
        airedCount: {type: integer}
        nextEpisode: {$ref: '#/components/schemas/EpisodeRef'}
    BookProgress:
      type: object
      properties:
        page: {type: integer}
        percent: {type: number}
    TitleSummary:
      type: object
      required: [id, type, title, isAnime, ids]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        backdropUrl:
          type: string
          description: Wide art (TMDB backdrop, AniList banner), for banners such as the week grid.
        network:
          type: string
          description: Shows only. Network or streaming service ("HBO", "Netflix", "Crunchyroll").
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
    LibraryEntry:
      type: object
      required: [id, title, status, isOwned, addedAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        notes: {type: string}
        isOwned: {type: boolean}
        addedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        progress: {$ref: '#/components/schemas/ShowProgress'}
        bookProgress: {$ref: '#/components/schemas/BookProgress'}
        watchedEpisodes:
          type: array
          description: |
            Every watched episode of a show, in order. Only on single-item responses (the item,
            and episode and season writes); lists and sync leave it out.
          items: {$ref: '#/components/schemas/EpisodeRef'}
    AccountExport:
      type: object
      required: [exportedAt, account, library, lists, shelves]
      properties:
        exportedAt: {type: string, format: date-time}
        account: {$ref: '#/components/schemas/Me'}
        library:
          type: array
          description: Every library item; shows carry `watchedEpisodes`.
          items: {$ref: '#/components/schemas/LibraryEntry'}
        lists:
          type: array
          items:
            type: object
            required: [name, createdAt, items]
            properties:
              name: {type: string}
              createdAt: {type: string, format: date-time}
              items:
                type: array
                items: {$ref: '#/components/schemas/TitleSummary'}
        shelves:
          type: array
          items: {$ref: '#/components/schemas/Shelf'}
    LibraryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryEntry'}
        page: {$ref: '#/components/schemas/PageInfo'}
    LibrarySync:
      type: object
      required: [items, deleted, token]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryEntry'}
        deleted:
          type: array
          items: {type: string, format: uuid}
        token: {type: string}
    Action:
      type: object
      required: [id, actor, kind, summary, itemIds, createdAt]
      properties:
        id: {type: string, format: uuid}
        actor:
          type: string
          enum: [user, agent, external_agent]
        kind: {type: string}
        summary: {type: string}
        itemIds:
          type: array
          items: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        undoneAt: {type: string, format: date-time}
        undoOf: {type: string, format: uuid}
        agentName:
          type: string
          description: The connected app that made it (an agent token's name); absent for your own writes.
    ActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Action'}
    ListSummary:
      type: object
      required: [id, name, itemCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        itemCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ListList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ListSummary'}
    ListDetail:
      type: object
      required: [id, name, titles, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        titles:
          type: array
          items: {$ref: '#/components/schemas/TitleSummary'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CreateList:
      type: object
      required: [name]
      properties:
        name: {type: string}
    RenameList:
      type: object
      required: [name]
      properties:
        name: {type: string}
    AddListItem:
      type: object
      required: [mediaRef]
      properties:
        mediaRef: {$ref: '#/components/schemas/MediaRef'}
    ListOrder:
      type: object
      required: [titleIds]
      properties:
        titleIds:
          type: array
          items: {type: string, format: uuid}
    ShelfFilter:
      type: object
      description: The same filters GET /v1/library/items accepts.
      properties:
        type: {$ref: '#/components/schemas/MediaType'}
        anime: {type: boolean}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        owned: {type: boolean}
        list: {type: string, format: uuid}
    Shelf:
      type: object
      required: [id, name, filter, isPinned]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    ShelfList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Shelf'}
    CreateShelf:
      type: object
      required: [name, filter]
      properties:
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    UpdateShelf:
      type: object
      properties:
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    CalendarEntry:
      type: object
      required: [libraryItemId, title, season, number, airsAt, airTimeKnown, watched, kind]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        season: {type: integer}
        number: {type: integer}
        episodeName: {type: string}
        episodeOverview:
          type: string
          description: The episode's synopsis, when the catalog has one (TMDB; AniList has none).
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: >-
            False when the source gives only a date: airsAt is midnight UTC of that date, and
            clients show the day (taken in UTC) without a time.
        runtimeMinutes: {type: integer}
        watched: {type: boolean}
        kind:
          type: string
          enum: [premiere, finale, regular]
    Calendar:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalendarEntry'}
    ContinueEntry:
      type: object
      required: [libraryItemId, title, next, remainingCount, remainingMinutes, isFinale]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        next: {$ref: '#/components/schemas/EpisodeRef'}
        nextName: {type: string}
        nextRuntimeMinutes: {type: integer}
        remainingCount:
          type: integer
          description: Aired, unwatched episodes including the next one. Specials excluded.
        remainingMinutes: {type: integer}
        isFinale:
          type: boolean
          description: The next episode is the last of its season.
    StartEntry:
      type: object
      required: [libraryItemId, title]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        runtimeMinutes: {type: integer}
    UpNext:
      type: object
      required: [continueWatching, startWatching]
      properties:
        continueWatching:
          type: array
          items: {$ref: '#/components/schemas/ContinueEntry'}
        startWatching:
          type: array
          items: {$ref: '#/components/schemas/StartEntry'}
        counts: {$ref: '#/components/schemas/LibraryCounts'}
        unfinished:
          type: array
          description: >-
            Unfinished business (UPN-002): every dropped item, and every in-progress item last
            changed 30 or more days ago that is not in `continueWatching`. Newest change first, at
            most 20.
          items: {$ref: '#/components/schemas/UnfinishedEntry'}
    LibraryCounts:
      type: object
      description: The user's library items per status.
      required: [wishlist, inProgress, finished, dropped]
      properties:
        wishlist: {type: integer}
        inProgress: {type: integer}
        finished: {type: integer}
        dropped: {type: integer}
    UnfinishedEntry:
      type: object
      required: [libraryItemId, title, reason, since]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        reason:
          type: string
          enum: [dropped, stalled]
          description: "`dropped` is the status; `stalled` is in progress and untouched for 30 days."
        since:
          type: string
          format: date-time
          description: The item's last change.
        next: {$ref: '#/components/schemas/EpisodeRef'}
    Stats:
      type: object
      description: >-
        `busiest` is the bucket with the most time (minutes, then episodes, then finishes).
        `mostEpisodes` is the bucket with the most episodes; it is absent when no episodes were
        watched or the top count is shared, so a tie names no winner.
      required: [span, year, timeZone, isPartial, totals, byKind, buckets, topTitles, ratings]
      properties:
        span:
          type: string
          enum: [month, year, all]
        year:
          type: integer
          description: The last year the period touches; for `all`, the current year.
        month: {type: integer}
        timeZone: {type: string}
        isPartial:
          type: boolean
          description: The period is not over yet in the user's time zone (always true for `all`).
        totals: {$ref: '#/components/schemas/StatsTotals'}
        byKind:
          type: array
          description: Movie, show, anime and book, always all four in that order; they sum to `totals`.
          items: {$ref: '#/components/schemas/StatsKind'}
        buckets:
          type: array
          description: >-
            One per month of the year, one per day of the month, or one per year (all time) from the
            first active year to this one, in order.
          items: {$ref: '#/components/schemas/StatsBucket'}
        busiest: {$ref: '#/components/schemas/StatsBucket'}
        mostEpisodes: {$ref: '#/components/schemas/StatsBucket'}
        longestRun: {$ref: '#/components/schemas/StatsRun'}
        topTitles:
          type: array
          description: Most time spent, at most five.
          items: {$ref: '#/components/schemas/StatsTitle'}
        ratings: {$ref: '#/components/schemas/StatsRatings'}
        first: {$ref: '#/components/schemas/StatsMoment'}
        last: {$ref: '#/components/schemas/StatsMoment'}
    StatsTotals:
      type: object
      required: [episodesWatched, minutesWatched, activeDays, moviesFinished, showsFinished, animeFinished,
        booksFinished]
      properties:
        episodesWatched: {type: integer}
        minutesWatched:
          type: integer
          description: Episode runtimes plus finished movies. Books have no minutes.
        activeDays: {type: integer}
        moviesFinished: {type: integer}
        showsFinished: {type: integer}
        animeFinished:
          type: integer
          description: Anime shows and films. Not counted again as shows or movies.
        booksFinished: {type: integer}
    StatsKind:
      type: object
      required: [kind, episodes, minutes, finished]
      properties:
        kind:
          type: string
          enum: [movie, show, anime, book]
          description: Anime is its own kind, films and shows alike; never counted again as either.
        episodes: {type: integer}
        minutes: {type: integer}
        finished: {type: integer}
    StatsBucket:
      type: object
      required: [start, episodes, minutes, finished]
      properties:
        start:
          type: string
          description: First local day of the bucket, YYYY-MM-DD.
        episodes: {type: integer}
        minutes: {type: integer}
        finished: {type: integer}
    StatsRun:
      type: object
      required: [days, start, end]
      properties:
        days: {type: integer}
        start: {type: string, description: 'YYYY-MM-DD'}
        end: {type: string, description: 'YYYY-MM-DD, inclusive.'}
    StatsTitle:
      type: object
      required: [title, episodes, minutes]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        episodes: {type: integer}
        minutes: {type: integer}
    StatsRatings:
      type: object
      required: [count, distribution]
      properties:
        count:
          type: integer
          description: Titles finished in the period that have a rating.
        mean: {type: number}
        highest: {$ref: '#/components/schemas/TitleSummary'}
        highestRating: {type: number}
        distribution:
          type: array
          description: >-
            Ten counts of those ratings on the 1–10 scale. Index n holds ratings above n up to n + 1,
            so a half star rounds up: 7.5 counts as 8 (index 7), 1 is index 0, 10 is index 9.
          minItems: 10
          maxItems: 10
          items: {type: integer}
    StatsMoment:
      type: object
      required: [title, at]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        at: {type: string, format: date-time}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
  responses:
    Error:
      description: Any error, in the shared shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

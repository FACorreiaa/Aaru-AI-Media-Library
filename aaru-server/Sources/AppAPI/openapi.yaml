        createdAt: {type: string, format: date-time}
    GroupInviteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupInvite'}
    ChannelKind:
      type: string
      description: 'text: chat. title: one title, with the spoiler guard. watch: watch parties. shelf: a shared list.'
      enum: [text, title, watch, shelf]
    ChannelCreate:
      type: object
      properties:
        kind: {$ref: '#/components/schemas/ChannelKind'}
        name: {type: string, description: "Required, except a title channel takes its title's name."}
        topic: {type: string, maxLength: 200}
        title: {$ref: '#/components/schemas/MediaRef', description: Required for a title channel.}
    ChannelUpdate:
      type: object
      properties:
        name: {type: string, description: Absent leaves it unchanged.}
        topic: {type: string, description: Absent leaves it unchanged; empty clears it.}
    GroupMessage:
      type: object
      required: [id, channelId, body, mentions, mentionsAgent, fromBlocked, deleted, createdAt, veiled, fromAgent]
      properties:
        id: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/SocialUser', description: Absent once the author deleted their account.}
        body: {type: string, description: Empty when deleted.}
        mentions:
          type: array
          description: Members the message tags.
          items: {type: string, format: uuid}
        mentionsAgent: {type: boolean, description: The message tags @aaru.}
        fromBlocked: {type: boolean, description: You blocked the author. Show it collapsed.}
        deleted: {type: boolean}
        createdAt: {type: string, format: date-time}
        editedAt: {type: string, format: date-time}
        clientNonce: {type: string, description: 'Only on your own messages: the clientNonce you posted with, to match a pending send to its echo.'}
        spoiler: {$ref: '#/components/schemas/SpoilerStamp', description: 'Only on your own messages: it says where you are in the title.'}
        veiled: {type: boolean, description: "It may spoil what you have not watched yet: show it veiled until you tap."}
        fromAgent: {type: boolean, description: Written by @aaru. It has no author.}
        replyTo: {type: string, format: uuid, description: The mention an @aaru reply answers.}
        components:
          type: array
          description: 'Cards on an @aaru reply. Catalog titles only; their buttons are the viewer''s own taps.'
          items: {$ref: '#/components/schemas/MessageComponent'}
    MessageComponent:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [title]
        title: {$ref: '#/components/schemas/TitleSummary'}
    GroupMessagePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupMessage'}
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
        clientNonce: {type: string, maxLength: 64, description: Makes a retry safe.}
        spoiler: {$ref: '#/components/schemas/SpoilerStamp', description: "Title channels: stamp by hand. Absent: stamped from your progress."}
        spoilerFree: {type: boolean, description: 'Title channels: no stamp at all.'}
    BoardComment:
      type: object
      required: [id, postId, body, mentions, mentionsAgent, deleted, createdAt, fromAgent]
      properties:
        id: {type: string, format: uuid}
        postId: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/SocialUser', description: Absent for Aaru's comments and for deleted comments.}
        body: {type: string, description: Empty when deleted.}
        mentions:
          type: array
          description: Friends the comment tags.
          items: {type: string, format: uuid}
        mentionsAgent: {type: boolean, description: The comment tags @aaru. Recorded only; Aaru does not answer on the Board yet.}
        deleted: {type: boolean}
        createdAt: {type: string, format: date-time}
        fromAgent: {type: boolean, description: Written by @aaru. It has no author.}
        replyTo: {type: string, format: uuid, description: The top-level comment this one answers. Never a reply itself.}
        mine: {type: boolean}
    BoardCommentCreate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
        replyTo: {type: string, format: uuid}
    BoardCommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BoardComment'}
        next:
          type: [string, 'null']
          format: uuid
          description: Pass as `after` for the next page. Null on the last page. A page can be empty or short with a `next` still set, because deleted and blocked rows are skipped after the page is cut; keep following it.
    BoardPost:
      type: object
      required: [id, author, body, createdAt, upvotes, upvotedByMe, commentCount, veiled, mine]
      properties:
        id: {type: string, format: uuid}
        author: {$ref: '#/components/schemas/SocialUser'}
        title: {$ref: '#/components/schemas/TitleSummary'}
        rating: {type: number, description: Needs a title.}
        body: {type: string}
        spoiler: {$ref: '#/components/schemas/SpoilerStamp', description: 'Only on your own posts: it says where you are in the title.'}
        createdAt: {type: string, format: date-time}
        editedAt: {type: string, format: date-time}
        upvotes: {type: integer}
        upvotedByMe: {type: boolean}
        commentCount: {type: integer}
        veiled: {type: boolean, description: "It may spoil what you have not watched yet: show it veiled until you tap."}
        mine: {type: boolean}
    BoardPostPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/BoardPost'}
    BoardPostCreate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
        title: {$ref: '#/components/schemas/MediaRef'}
        rating: {type: number, description: Needs a title.}
        spoiler: {$ref: '#/components/schemas/SpoilerStamp', description: "With a title: stamp by hand. Absent: stamped from your progress."}
        spoilerFree: {type: boolean, description: 'With a title: no stamp at all.'}
    BoardPostEdit:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
    MessageUpdate:
      type: object
      required: [body]
      properties:
        body: {type: string, maxLength: 4000}
    ReadMark:
      type: object
      required: [messageId]
      properties:
        messageId: {type: string, format: uuid}
    RealtimeTicket:
      type: object
      required: [ticket, url, expiresAt]
      properties:
        ticket: {type: string}
        url: {type: string, description: 'The wss:// URL to open, ticket included.'}
        expiresAt: {type: string, format: date-time}
    RealtimeEvent:
      type: object
      description: >-
        One frame from GET /v1/ws (a WebSocket). The socket is never the source of truth: on
        `ready` (every connect and reconnect), refetch what is on screen with REST.
      required: [type]
      properties:
        type:
          type: string
          enum: [ready, message.created, message.updated, message.deleted, typing, read, group.updated, group.removed, invites.changed, shelf.updated, watch.updated, watch.reaction, agent.thinking]
        groupId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
        messageId: {type: string, format: uuid, description: 'agent.thinking: the mention being answered.'}
        message: {$ref: '#/components/schemas/GroupMessage'}
        user: {$ref: '#/components/schemas/SocialUser', description: 'Who is typing, or reacting.'}
        emoji: {type: string, description: 'watch.reaction only.'}
    RealtimeCommand:
      type: object
      description: One frame a client sends on GET /v1/ws. At most one typing frame per channel every 3 seconds, and one reaction a second, counts.
      required: [type, groupId, channelId]
      properties:
        type:
          type: string
          enum: [typing, react]
        emoji: {type: string, description: 'react only: one of 😂 😱 😭 ❤️ 👏 🔥.'}
        groupId: {type: string, format: uuid}
        channelId: {type: string, format: uuid}
    MembershipUpdate:
      type: object
      description: Any field left out keeps its value.
      properties:
        shareProgress: {type: boolean}
        muted: {type: boolean}
    SpoilerStamp:
      type: object
      description: How far into the title a reader must be to read the message unveiled. An episode, or the ending.
      properties:
        season: {type: integer}
        episode: {type: integer}
        ending: {type: boolean}
    MemberProgress:
      type: object
      required: [user]
      properties:
        user: {$ref: '#/components/schemas/SocialUser'}
        status: {$ref: '#/components/schemas/LibraryStatus', description: Absent when it is not in their library.}
        season: {type: integer, description: The furthest episode they ticked.}
        episode: {type: integer}
    ChannelProgress:
      type: object
      required: [title, members]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        mine: {$ref: '#/components/schemas/MemberProgress'}
        members:
          type: array
          description: Only members who share their progress in this group.
          items: {$ref: '#/components/schemas/MemberProgress'}
    ChannelItem:
      type: object
      required: [title, addedAt]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        addedBy: {$ref: '#/components/schemas/SocialUser'}
        addedAt: {type: string, format: date-time}
        myStatus: {$ref: '#/components/schemas/LibraryStatus', description: Yours, when it is in your library.}
    ChannelItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ChannelItem'}
    ChannelItemCreate:
      type: object
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/MediaRef'}
    WatchParty:
      type: object
      required: [id, title, state, ready]
      properties:
        id: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        season: {type: integer}
        episode: {type: integer}
        state:
          type: string
          enum: [lobby, countdown, live, ended]
        startsAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        host: {$ref: '#/components/schemas/SocialUser'}
        ready:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
    WatchPartyView:
      type: object
      required: [serverTime]
      properties:
        party: {$ref: '#/components/schemas/WatchParty'}
        serverTime: {type: string, format: date-time, description: 'Count down against this, not the device clock.'}
    WatchPartyCreate:
      type: object
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/MediaRef'}
        season: {type: integer}
        episode: {type: integer}
    WatchPartyReady:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
    WatchPartyStart:
      type: object
      properties:
        countdownSeconds: {type: integer, description: '3–60, default 10.'}
    ExternalIds:
      type: object
      description: Provider identifiers known for a title. Absent means unknown.
      properties:
        tmdb: {type: string}
        imdb: {type: string}
        trakt: {type: string}
        tvdb: {type: string}
        isbn: {type: string}
        openLibrary: {type: string}
        anilist: {type: string}
        mal: {type: string}
        anidb: {type: string}
        musicbrainz:
          type: string
          description: An album's MusicBrainz release-group id (MUS-001).
    MediaType:
      type: string
      description: >-
        `album` (MUS-001) is a MusicBrainz release group of type Album or EP: status, rating and
        notes, no progress.
      enum: [movie, show, book, album]
    CatalogHit:
      type: object
      required: [type, title, isAnime, ids]
      properties:
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        overview: {type: string}
        byline:
          type: string
          description: Authors, for books; the artist credit, for albums.
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        libraryItemId:
          type: string
          description: The caller's library item for this title, when they have one. Discover only.
        releaseDate:
          type: string
          description: >-
            YYYY-MM-DD. A film's first release or a show's first air date (TMDB), an anime's start
            date (AniList). Absent when the provider has no full date.
    SearchResults:
      type: object
      required: [items, incomplete]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
        incomplete:
          type: boolean
          description: >-
            True when one provider of an `all` search failed or ran out of time, so the items
            come from the other alone. An `anime` search is also incomplete while AniList is down
            and TMDB stands in.
        notice:
          type: string
          description: >-
            Why the items are partial, in words to show, e.g. AniList being down while TMDB's
            Japanese animation stands in.
    DiscoverRow:
      type: object
      required: [id, title, items]
      properties:
        id:
          type: string
          description: >-
            Stable row key, e.g. `tv_trending`, `anime_season`, `books_trending`, `music_new`. Not an enum:
            the server may add rows, and clients render any row they get.
        title:
          type: string
          description: Display title, e.g. "Fall 2026 anime".
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
        note:
          type: string
          description: Where a stand-in row came from, e.g. TMDB while AniList is down.
    DiscoverRows:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items: {$ref: '#/components/schemas/DiscoverRow'}
    SeasonPage:
      type: object
      required: [kind, season, year, from, until, title, items, page, hasMore, unavailable]
      properties:
        kind:
          type: string
          enum: [anime, shows_new, shows_returning, movies]
        season:
          type: string
          enum: [winter, spring, summer, fall]
        year: {type: integer}
        from:
          type: string
          description: First day of the season, YYYY-MM-DD.
        until:
          type: string
          description: Last day of the season, YYYY-MM-DD.
        title:
          type: string
          description: Display name, e.g. "Fall 2026".
        items:
          type: array
          items: {$ref: '#/components/schemas/CatalogHit'}
        page: {type: integer}
        hasMore: {type: boolean}
        total:
          type: integer
          description: The provider's count for the whole season, when it gives one.
        unavailable:
          type: boolean
          description: The provider did not answer and nothing was cached; not an empty season.
    Concert:
      type: object
      description: One music event from Ticketmaster. Tickets are bought there, never in Aaru.
      required: [id, name, artists, localDate, url]
      properties:
        id: {type: string}
        name: {type: string}
        artists:
          type: array
          description: The acts on the bill, headliner first.
          items: {type: string}
        startsAt:
          type: string
          format: date-time
          description: The exact start, when announced.
        localDate:
          type: string
          description: The day at the venue, YYYY-MM-DD.
        localTime:
          type: string
          description: The time at the venue, HH:mm, when announced.
        venue: {type: string}
        city: {type: string}
        country: {type: string}
        distanceKm:
          type: number
          description: From the searched point. Absent for an artist's concerts.
        url:
          type: string
          description: Ticketmaster's event page.
        imageUrl:
          type: string
          description: Ticketmaster's image for the event, referenced, never hosted.
    ConcertPlace:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: {type: string, description: '1 to 200 characters.'}
        region: {type: string}
        country: {type: string}
        countryCode: {type: string, description: ISO 3166-1 alpha-2.}
        latitude: {type: number, description: Rounded to two decimals by the server.}
        longitude: {type: number, description: Rounded to two decimals by the server.}
    ConcertPlaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ConcertPlace'}
    ConcertPlaceSetting:
      type: object
      required: [available]
      properties:
        place: {$ref: '#/components/schemas/ConcertPlace'}
        available:
          type: boolean
          description: False when concerts are off on this server; clients hide the Concerts view.
    ConcertsNearRequest:
      type: object
      required: [radiusKm]
      properties:
        latitude:
          type: number
          description: Sent with `longitude` for a one-off position; absent uses the saved city.
        longitude: {type: number}
        radiusKm:
          type: integer
          enum: [25, 50, 100]
        page:
          type: integer
          description: 1-based, at most 10.
          default: 1
    ConcertPage:
      type: object
      required: [radiusKm, items, page, hasMore, unavailable]
      properties:
        place: {$ref: '#/components/schemas/ConcertPlace'}
        radiusKm: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/Concert'}
        page: {type: integer}
        hasMore: {type: boolean}
        unavailable:
          type: boolean
          description: Concerts are off, or Ticketmaster did not answer and nothing was cached.
    ArtistConcerts:
      type: object
      required: [items, matched, pending, unavailable]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Concert'}
        matched:
          type: integer
          description: Library artists Ticketmaster knows.
        pending:
          type: integer
          description: Library artists not looked up yet.
        unavailable: {type: boolean}
    Episode:
      type: object
      required: [season, number, airTimeKnown]
      properties:
        season: {type: integer}
        number: {type: integer}
        name: {type: string}
        overview:
          type: string
          description: The episode's synopsis, when the catalog has one.
        stillUrl:
          type: string
          description: A frame from the episode (TMDB, referenced, never hosted).
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: True when `airsAt` is the exact broadcast time; false when only the date is known.
        runtimeMinutes: {type: integer}
    Season:
      type: object
      required: [number, episodes]
      properties:
        number: {type: integer}
        episodes:
          type: array
          items: {$ref: '#/components/schemas/Episode'}
    TitleDetail:
      type: object
      required: [id, type, title, isAnime, ids]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        synopsis: {type: string}
        posterUrl: {type: string}
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        status:
          type: string
          enum: [upcoming, returning, ended, canceled]
        runtimeMinutes: {type: integer}
        seasons:
          type: array
          description: Shows only.
          items: {$ref: '#/components/schemas/Season'}
        byline:
          type: string
          description: Authors, for books; the artist credit, for albums.
        genres:
          type: array
          description: Albums only (MUS-001), at most five, most tagged first.
          items: {type: string}
        tracks:
          type: array
          description: >-
            Albums only: the tracklist of the album's earliest official release, by disc then
            position. Absent when MusicBrainz could not be reached and none is stored yet.
          items: {$ref: '#/components/schemas/AlbumTrack'}
    AlbumTrack:
      type: object
      required: [disc, position, name]
      properties:
        disc: {type: integer}
        position: {type: integer}
        name: {type: string}
        lengthMs: {type: integer}
    LibraryStatus:
      type: string
      enum: [wishlist, in_progress, finished, dropped]
    MediaRef:
      type: object
      required: [type]
      description: A title by Aaru id, by provider ids, or by title + year.
      properties:
        titleId: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        ids: {$ref: '#/components/schemas/ExternalIds'}
        title: {type: string}
        year: {type: integer}
    AddLibraryItem:
      type: object
      required: [mediaRef]
      properties:
        mediaRef: {$ref: '#/components/schemas/MediaRef'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
    LibraryItemPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/LibraryStatus'
          description: >-
            `finished` on a show marks the whole show watched, as `POST …/watched` does (PROG-005):
            a running show stays in progress, caught up.
        rating:
          type: number
          description: 1–10 in 0.5 steps.
        notes: {type: string}
        isOwned: {type: boolean}
        bookPage: {type: integer}
        bookPercent: {type: number}
        clear:
          type: array
          description: Fields to empty.
          items:
            type: string
            enum: [rating, notes, bookProgress]
    EpisodeWatched:
      type: object
      required: [watched]
      properties:
        watched: {type: boolean}
    EpisodeRef:
      type: object
      required: [season, number]
      properties:
        season: {type: integer}
        number: {type: integer}
    ShowProgress:
      type: object
      required: [watchedCount, airedCount]
      description: Specials (season 0) are not counted.
      properties:
        watchedCount: {type: integer}
        airedCount: {type: integer}
        nextEpisode: {$ref: '#/components/schemas/EpisodeRef'}
    BookProgress:
      type: object
      properties:
        page: {type: integer}
        percent: {type: number}
    TitleSummary:
      type: object
      required: [id, type, title, isAnime, ids]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MediaType'}
        title: {type: string}
        originalTitle: {type: string}
        year: {type: integer}
        posterUrl: {type: string}
        backdropUrl:
          type: string
          description: Wide art (TMDB backdrop, AniList banner), for banners such as the week grid.
        network:
          type: string
          description: Shows only. Network or streaming service ("HBO", "Netflix", "Crunchyroll").
        byline:
          type: string
          description: Authors, for books; the artist credit, for albums.
        pageCount:
          type: integer
          description: Books only, when known (Open Library's median across editions).
        isAnime: {type: boolean}
        ids: {$ref: '#/components/schemas/ExternalIds'}
    LibraryEntry:
      type: object
      required: [id, title, status, isOwned, addedAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        rating: {type: number}
        notes: {type: string}
        isOwned: {type: boolean}
        addedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        progress: {$ref: '#/components/schemas/ShowProgress'}
        bookProgress: {$ref: '#/components/schemas/BookProgress'}
        watchedEpisodes:
          type: array
          description: |
            Every watched episode of a show, in order. Only on single-item responses (the item,
            and episode and season writes); lists and sync leave it out.
          items: {$ref: '#/components/schemas/EpisodeRef'}
    AccountExport:
      type: object
      required: [exportedAt, account, library, lists, shelves]
      properties:
        exportedAt: {type: string, format: date-time}
        account: {$ref: '#/components/schemas/Me'}
        library:
          type: array
          description: Every library item; shows carry `watchedEpisodes`.
          items: {$ref: '#/components/schemas/LibraryEntry'}
        lists:
          type: array
          items:
            type: object
            required: [name, createdAt, items]
            properties:
              name: {type: string}
              createdAt: {type: string, format: date-time}
              items:
                type: array
                items: {$ref: '#/components/schemas/TitleSummary'}
        shelves:
          type: array
          items: {$ref: '#/components/schemas/Shelf'}
        friends:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
        blocked:
          type: array
          items: {$ref: '#/components/schemas/SocialUser'}
        groups:
          type: array
          items:
            type: object
            required: [name, role]
            properties:
              name: {type: string}
              role: {$ref: '#/components/schemas/GroupRole'}
        groupMessages:
          type: array
          description: Messages you wrote in groups, oldest first.
          items:
            type: object
            required: [group, channel, body, createdAt]
            properties:
              group: {type: string}
              channel: {type: string}
              body: {type: string}
              createdAt: {type: string, format: date-time}
        listens:
          type: array
          description: Every listen in your listening log, newest first (MUS-005).
          items: {$ref: '#/components/schemas/Listen'}
    LibraryPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryEntry'}
        page: {$ref: '#/components/schemas/PageInfo'}
    LibrarySync:
      type: object
      required: [items, deleted, token]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LibraryEntry'}
        deleted:
          type: array
          items: {type: string, format: uuid}
        token: {type: string}
    Action:
      type: object
      required: [id, actor, kind, summary, itemIds, createdAt]
      properties:
        id: {type: string, format: uuid}
        actor:
          type: string
          enum: [user, agent, external_agent]
        kind: {type: string}
        summary: {type: string}
        itemIds:
          type: array
          items: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        undoneAt: {type: string, format: date-time}
        undoOf: {type: string, format: uuid}
        agentName:
          type: string
          description: The connected app that made it (an agent token's name); absent for your own writes.
    ActionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Action'}
    ListSummary:
      type: object
      required: [id, name, itemCount, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        itemCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ListList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ListSummary'}
    ListDetail:
      type: object
      required: [id, name, titles, items, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        titles:
          type: array
          description: Superseded by `items`; kept for clients that predate it.
          items: {$ref: '#/components/schemas/TitleSummary'}
        items:
          type: array
          description: The members in list order.
          items: {$ref: '#/components/schemas/ListItem'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ListItem:
      type: object
      description: >-
        One list member. `entry` is the caller's library row when the title is in the library.
        Shows carry `showStatus` and `nextAiring` (the first episode not aired yet) once their
        episodes are loaded.
      required: [title]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        entry: {$ref: '#/components/schemas/LibraryEntry'}
        showStatus:
          type: string
          enum: [upcoming, returning, ended, canceled]
        nextAiring: {$ref: '#/components/schemas/UpcomingEpisode'}
    UpcomingEpisode:
      type: object
      required: [season, number, airsAt, airTimeKnown]
      properties:
        season: {type: integer}
        number: {type: integer}
        episodeName: {type: string}
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: False when the source gives only a date, as on CalendarEntry.
    CreateList:
      type: object
      required: [name]
      properties:
        name: {type: string}
    RenameList:
      type: object
      required: [name]
      properties:
        name: {type: string}
    AddListItem:
      type: object
      required: [mediaRef]
      properties:
        mediaRef: {$ref: '#/components/schemas/MediaRef'}
    ListOrder:
      type: object
      required: [titleIds]
      properties:
        titleIds:
          type: array
          items: {type: string, format: uuid}
    ShelfFilter:
      type: object
      description: The same filters GET /v1/library/items accepts.
      properties:
        type: {$ref: '#/components/schemas/MediaType'}
        anime: {type: boolean}
        status: {$ref: '#/components/schemas/LibraryStatus'}
        owned: {type: boolean}
        list: {type: string, format: uuid}
    Shelf:
      type: object
      required: [id, name, filter, isPinned]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    ShelfList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Shelf'}
    CreateShelf:
      type: object
      required: [name, filter]
      properties:
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    UpdateShelf:
      type: object
      properties:
        name: {type: string}
        filter: {$ref: '#/components/schemas/ShelfFilter'}
        isPinned: {type: boolean}
    CalendarEntry:
      type: object
      required: [libraryItemId, title, season, number, airsAt, airTimeKnown, watched, kind]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        season: {type: integer}
        number: {type: integer}
        episodeName: {type: string}
        episodeOverview:
          type: string
          description: The episode's synopsis, when the catalog has one (TMDB; AniList has none).
        stillUrl:
          type: string
          description: The episode's still image (TMDB), when the catalog has one.
        airsAt: {type: string, format: date-time}
        airTimeKnown:
          type: boolean
          description: >-
            False when the source gives only a date: airsAt is midnight UTC of that date, and
            clients show the day (taken in UTC) without a time.
        runtimeMinutes: {type: integer}
        watched: {type: boolean}
        kind:
          type: string
          enum: [premiere, finale, regular]
    Calendar:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CalendarEntry'}
    ContinueEntry:
      type: object
      required: [libraryItemId, title, next, remainingCount, remainingMinutes, isFinale]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        next: {$ref: '#/components/schemas/EpisodeRef'}
        nextName: {type: string}
        nextRuntimeMinutes: {type: integer}
        remainingCount:
          type: integer
          description: Aired, unwatched episodes including the next one. Specials excluded.
        remainingMinutes: {type: integer}
        isFinale:
          type: boolean
          description: The next episode is the last of its season.
    StartEntry:
      type: object
      required: [libraryItemId, title]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        runtimeMinutes: {type: integer}
    TonightPick:
      type: object
      required: [libraryItemId, title, kind, reason, airTimeKnown]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        kind:
          type: string
          enum: [continue, airing, reading, start]
          description: >-
            continue: the next aired episode of a show in progress. airing: an episode airing
            today. reading: a book in progress. start: a wishlist film.
        episode: {$ref: '#/components/schemas/EpisodeRef'}
        episodeName: {type: string}
        minutes: {type: integer}
        airsAt: {type: string, format: date-time}
        airTimeKnown: {type: boolean}
        reason:
          type: string
          description: Why it is here, e.g. "52 min · 3 left" or "Airs 21:00 · 44 min".
    Tonight:
      type: object
      required: [day, picks]
      properties:
        day: {type: string, format: date, description: The local day the strip is for.}
        picks:
          type: array
          items: {$ref: '#/components/schemas/TonightPick'}
    TonightFeedback:
      type: object
      required: [verdict]
      properties:
        verdict:
          type: string
          enum: [rejected, not_tonight]
    UpNext:
      type: object
      required: [continueWatching, startWatching]
      properties:
        continueWatching:
          type: array
          items: {$ref: '#/components/schemas/ContinueEntry'}
        startWatching:
          type: array
          items: {$ref: '#/components/schemas/StartEntry'}
        counts: {$ref: '#/components/schemas/LibraryCounts'}
        unfinished:
          type: array
          description: >-
            Unfinished business (UPN-002): every dropped item, and every in-progress item last
            changed 30 or more days ago that is not in `continueWatching`. Newest change first, at
            most 20.
          items: {$ref: '#/components/schemas/UnfinishedEntry'}
    LibraryCounts:
      type: object
      description: The user's library items per status.
      required: [wishlist, inProgress, finished, dropped]
      properties:
        wishlist: {type: integer}
        inProgress: {type: integer}
        finished: {type: integer}
        dropped: {type: integer}
    UnfinishedEntry:
      type: object
      required: [libraryItemId, title, reason, since]
      properties:
        libraryItemId: {type: string, format: uuid}
        title: {$ref: '#/components/schemas/TitleSummary'}
        reason:
          type: string
          enum: [dropped, stalled]
          description: "`dropped` is the status; `stalled` is in progress and untouched for 30 days."
        since:
          type: string
          format: date-time
          description: The item's last change.
        next: {$ref: '#/components/schemas/EpisodeRef'}
    Stats:
      type: object
      description: >-
        `busiest` is the bucket with the most time (minutes, then episodes, then finishes).
        `mostEpisodes` is the bucket with the most episodes; it is absent when no episodes were
        watched or the top count is shared, so a tie names no winner.
        `prior` is the totals of the equal-length window just before a rolling span, for deltas;
        it is absent for calendar spans. `biggestDay` is the single local day with the most time
        (then episodes), the earliest on a tie.
      required: [span, year, timeZone, isPartial, totals, byKind, buckets, topTitles, ratings, topGenres]
      properties:
        span:
          type: string
          enum: [month, year, all, last7, last30]
        year:
          type: integer
          description: The last year the period touches; for `all`, the current year.
        month: {type: integer}
        from:
          type: string
          description: First day of a rolling span (YYYY-MM-DD); absent for calendar spans.
        until:
          type: string
          description: Last day of a rolling span (YYYY-MM-DD, inclusive, today); absent for calendar spans.
        timeZone: {type: string}
        isPartial:
          type: boolean
          description: The period is not over yet in the user's time zone (always true for `all`).
        totals: {$ref: '#/components/schemas/StatsTotals'}
        prior: {$ref: '#/components/schemas/StatsTotals'}
        byKind:
          type: array
          description: >-
            Movie, show, anime and book, always, in that order; then album (MUS-001) only when the
            period finished one. They sum to `totals`.
          items: {$ref: '#/components/schemas/StatsKind'}
        buckets:
          type: array
          description: >-
            One per month of the year, one per day of the month or rolling span, or one per year (all
            time) from the first active year to this one, in order.
          items: {$ref: '#/components/schemas/StatsBucket'}
        busiest: {$ref: '#/components/schemas/StatsBucket'}
        mostEpisodes: {$ref: '#/components/schemas/StatsBucket'}
        longestRun: {$ref: '#/components/schemas/StatsRun'}
        topTitles:
          type: array
          description: Most time spent, at most five.
          items: {$ref: '#/components/schemas/StatsTitle'}
        ratings: {$ref: '#/components/schemas/StatsRatings'}
        first: {$ref: '#/components/schemas/StatsMoment'}
        last: {$ref: '#/components/schemas/StatsMoment'}
        topGenres:
          type: array
          description: >-
            GAM-006e: the three genres with the most time, from films, shows and anime (books
            have none). Empty until the titles' genres are stored.
          items: {$ref: '#/components/schemas/StatsGenre'}
        biggestDay: {$ref: '#/components/schemas/StatsBucket'}
        persona:
          type: string
          description: >-
            GAM-006e: one word for the period from the user's own numbers, the first rule that
            holds: `binger` (a day of 6+ episodes or 14 days in a row), `bookworm` (books are
            most of 2+ finishes), `anime` (anime is most of the time), `completionist` (24+
            finished), `explorer` (3+ kinds), else `steady`. Absent when nothing happened.
          enum: [binger, bookworm, anime, completionist, explorer, steady]
        music: {$ref: '#/components/schemas/StatsMusic'}
    StatsMusic:
      type: object
      description: >-
        MUS-008: the period's listening, apart from the library's numbers (listening never adds
        to them). Absent when nothing was heard.
      required: [listens, minutes, topArtistTracks]
      properties:
        listens: {type: integer}
        minutes: {type: integer, description: Listens whose length is known, summed.}
        priorListens: {type: integer, description: The previous equal-length window; rolling spans only.}
        priorMinutes: {type: integer}
        topArtist:
          type: object
          required: [artist, count, minutes]
          properties:
            artist: {type: string}
            count: {type: integer}
            minutes: {type: integer}
            coverUrl: {type: string}
        topArtistTracks:
          type: array
          description: The top artist's three most played tracks.
          items:
            type: object
            required: [track, count]
            properties:
              track: {type: string}
              count: {type: integer}
    ShowWatched:
      type: object
      required: [entry, episodes]
      properties:
        entry: {$ref: '#/components/schemas/LibraryEntry'}
        action:
          $ref: '#/components/schemas/Action'
          description: Absent when every aired episode was already watched and nothing changed.
        episodes:
          type: integer
          description: Episodes this ticked.
    ProfileStats:
      type: object
      required: [episodesWatched, minutesWatched, pagesRead, shows, anime, movies, books, byKind, topGenres, topNetworks, mostWatched, ratings]
      properties:
        memberSince: {type: string, format: date-time}
        episodesWatched: {type: integer}
        minutesWatched:
          type: integer
          description: Ticked episodes' runtime plus finished films' runtime. Books have no minutes.
        pagesRead:
          type: integer
          description: Page counts of finished books, where known.
        shows: {$ref: '#/components/schemas/LibraryCounts'}
        anime:
          $ref: '#/components/schemas/LibraryCounts'
          description: Anime counts here only, never again as a show or film.
        movies: {$ref: '#/components/schemas/LibraryCounts'}
        books: {$ref: '#/components/schemas/LibraryCounts'}
        byKind:
          type: array
          description: Movie, show, anime and book; `finished` is the finished count.
          items: {$ref: '#/components/schemas/StatsKind'}
        topGenres:
          type: array
          description: Up to eight genres by time, films, shows and anime only.
          items: {$ref: '#/components/schemas/StatsGenre'}
        topNetworks:
          type: array
          description: Up to five networks or services by time.
          items: {$ref: '#/components/schemas/StatsGenre'}
        mostWatched:
          type: array
          description: Up to three titles with the most time.
          items: {$ref: '#/components/schemas/StatsTitle'}
        ratings:
          $ref: '#/components/schemas/StatsRatings'
          description: Every rated item, whatever its status.
    StatsGenre:
      type: object
      required: [name, minutes, titles]
      properties:
        name: {type: string}
        minutes: {type: integer}
        titles:
          type: integer
          description: How many titles in the period carried this genre.
    Listen:
      type: object
      description: >-
        One play of a track a scrobbler sent (MUS-005). Never a library item: listening does not
        change the library.
      required: [id, listenedAt, artist, track]
      properties:
        id: {type: string}
        listenedAt: {type: string, format: date-time, description: When the track started.}
        artist: {type: string}
        track: {type: string}
        album: {type: string}
        durationMs: {type: integer}
        coverUrl: {type: string, description: The album's Cover Art Archive cover when Aaru knows the album.}
        originUrl: {type: string, description: Where it played, when the scrobbler said.}
        client: {type: string, description: 'The scrobbler, e.g. "Web Scrobbler".'}
        musicService: {type: string, description: 'Where it was heard, e.g. "YouTube Music".'}
        albumRef:
          $ref: '#/components/schemas/MediaRef'
          description: >-
            The album once MusicBrainz identified it (MUS-006): by Aaru's title id when the album is
            in the catalog, always by its MusicBrainz id. Open or add it like a search hit.
    ListenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Listen'}
        next:
          type: string
          format: date-time
          description: Pass as `before` for the next page; absent on the last page.
    ListenTop:
      type: object
      required: [by, span, year, timeZone, listens, minutes, items]
      properties:
        by: {type: string, enum: [artist, track, album]}
        span: {type: string, enum: [month, year, all, last7, last30]}
        year: {type: integer}
        month: {type: integer}
        timeZone: {type: string}
        listens: {type: integer, description: Every listen in the period.}
        minutes: {type: integer, description: Their length summed, for listens whose length is known.}
        items:
          type: array
          items:
            type: object
            required: [artist, count, minutes]
            properties:
              artist: {type: string}
              track: {type: string, description: Present when ranking tracks.}
              album: {type: string, description: Present when ranking albums.}
              count: {type: integer}
              minutes: {type: integer}
              coverUrl:
                type: string
                description: The cover of the newest identified album among the row's listens.
              albumRef:
                $ref: '#/components/schemas/MediaRef'
                description: >-
                  Ranking tracks or albums: that album, by MusicBrainz id, and by Aaru's title id
                  once it is in the catalog.
    StatsTotals:
      type: object
      required: [episodesWatched, minutesWatched, activeDays, moviesFinished, showsFinished, animeFinished,
        booksFinished, albumsFinished]
      properties:
        episodesWatched: {type: integer}
        minutesWatched:
          type: integer
          description: Episode runtimes plus finished movies. Books have no minutes.
        activeDays: {type: integer}
        moviesFinished: {type: integer}
        showsFinished: {type: integer}
        animeFinished:
          type: integer
          description: Anime shows and films. Not counted again as shows or movies.
        booksFinished: {type: integer}
        albumsFinished:
          type: integer
          description: MUS-001. Albums have no minutes.
    StatsKind:
      type: object
      required: [kind, episodes, minutes, finished]
      properties:
        kind:
          type: string
          enum: [movie, show, anime, book, album]
          description: Anime is its own kind, films and shows alike; never counted again as either.
        episodes: {type: integer}
        minutes: {type: integer}
        finished: {type: integer}
    StatsBucket:
      type: object
      required: [start, episodes, minutes, finished]
      properties:
        start:
          type: string
          description: First local day of the bucket, YYYY-MM-DD.
        episodes: {type: integer}
        minutes: {type: integer}
        finished: {type: integer}
    StatsRun:
      type: object
      required: [days, start, end]
      properties:
        days: {type: integer}
        start: {type: string, description: 'YYYY-MM-DD'}
        end: {type: string, description: 'YYYY-MM-DD, inclusive.'}
    StatsTitle:
      type: object
      required: [title, episodes, minutes]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        episodes: {type: integer}
        minutes: {type: integer}
    StatsRatings:
      type: object
      required: [count, distribution]
      properties:
        count:
          type: integer
          description: Titles finished in the period that have a rating.
        mean: {type: number}
        highest: {$ref: '#/components/schemas/TitleSummary'}
        highestRating: {type: number}
        distribution:
          type: array
          description: >-
            Ten counts of those ratings on the 1–10 scale. Index n holds ratings above n up to n + 1,
            so a half star rounds up: 7.5 counts as 8 (index 7), 1 is index 0, 10 is index 9.
          minItems: 10
          maxItems: 10
          items: {type: integer}
    StatsMoment:
      type: object
      required: [title, at]
      properties:
        title: {$ref: '#/components/schemas/TitleSummary'}
        at: {type: string, format: date-time}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
  responses:
    Error:
      description: Any error, in the shared shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

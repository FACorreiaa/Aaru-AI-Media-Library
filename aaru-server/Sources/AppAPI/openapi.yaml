        active: {type: boolean}
    StreakState:
      type: object
      required: [current, longest, today, days]
      properties:
        current: {type: integer, description: Days in the streak still alive; 0 when broken.}
        longest: {type: integer}
        today: {type: boolean, description: Today already counts.}
        days:
          type: array
          description: The last seven local dates, oldest first.
          items: {$ref: '#/components/schemas/StreakDayState'}
    Progress:
      type: object
      required: [total, level, levelStart, nextLevelAt, weekPoints, streak, unseen]
      properties:
        total: {type: integer}
        level: {type: integer}
        levelStart: {type: integer, description: Points where this level began.}
        nextLevelAt: {type: integer}
        weekPoints: {type: integer, description: This ISO week's points as the board counts them.}
        streak: {$ref: '#/components/schemas/StreakState'}
        unseen:
          type: object
          required: [count, origin, items]
          properties:
            count: {type: integer}
            origin: {$ref: '#/components/schemas/BadgeOrigin'}
            items:
              type: array
              description: The newest five.
              items: {$ref: '#/components/schemas/BadgeAward'}
    PointsEventItem:

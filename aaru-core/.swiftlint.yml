included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData

line_length:
  warning: 120
  ignores_urls: true
  ignores_comments: true

identifier_name:
  excluded:
    - id
    - x
    - y
    # pairwise comparisons in matching code and its tests
    - a
    - b
    - c

opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - unused_import

disabled_rules:
  - trailing_comma # swiftformat owns commas
  - opening_brace # swiftformat owns brace wrapping
  - trailing_whitespace

# Postgres for local runs and tests (the same defaults the Swift server used).
services:
  postgres:
    # Same major as production (platform/infra apps/aaru/data/postgres.yaml).
    image: postgres:18
    ports:
      - 5432:5432
    environment:
      - POSTGRES_PASSWORD=testing123
      - POSTGRES_USER=hb
      - POSTGRES_DB=hb

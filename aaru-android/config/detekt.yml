# Built on detekt's defaults. Only what Aaru changes is written here.
config:
  warningsAsErrors: true

naming:
  FunctionNaming:
    # Composables are named like types.
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 120
    excludeCommentStatements: true
  ForbiddenComment:
    active: true
  WildcardImport:
    active: true

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
    functionThreshold: 8
  LongMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']
